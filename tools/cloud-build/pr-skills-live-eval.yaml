# Shared Cloud Build workflow for PR-skills-smoke-eval (automatic 5-case smoke
# gate on skill/eval PRs) and PR-test-skills-full-eval (on-demand
# approval-gated full evaluation suite on any PR).

---

steps:
- id: git-prepare-workspace
  name: gcr.io/cloud-builders/git
  entrypoint: bash
  args:
  - -ceu
  - |
    cd /workspace
    if [ -d .git ]; then
      if [ -f .git/shallow ]; then
        git fetch --unshallow
      fi
    else
      git init -b main
      git config user.email "ci@cluster-toolkit.local"
      git config user.name "CTK Eval CI"
      git add -A
      git commit -q -m "ci workspace snapshot"
    fi
    if [ -n "${_COMPARE_REF}" ]; then
      git remote get-url origin >/dev/null 2>&1 || git remote add origin \
        https://github.com/GoogleCloudPlatform/cluster-toolkit.git
      git fetch --no-tags origin \
        "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
      REF="${_COMPARE_REF}"
      git rev-parse --verify "$${REF}^{commit}" >/dev/null 2>&1 \
        || git fetch --no-tags origin "$${REF#origin/}" || true
    fi
- id: skills-live-eval
  waitFor: [git-prepare-workspace]
  name: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner
  automapSubstitutions: true
  env:
  - 'GOOGLE_GENAI_USE_VERTEXAI=true'
  - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
  - 'GOOGLE_CLOUD_LOCATION=global'
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    cd /workspace
    archive_artifacts() {
      if [ -n "${_ARTIFACTS_BUCKET}" ]; then
        DEST="gs://${_ARTIFACTS_BUCKET}/skills-eval/${BUILD_ID:-manual}"
        gsutil -m cp -r /workspace/live-eval-results.json \
          /workspace/live-eval-summary.md /workspace/live-logs \
          "${DEST}/" 2>/dev/null || true
      fi
    }
    trap archive_artifacts EXIT
    # Transitional bootstrap until DAILY-image-build-test-runner rebuilds
    # test-runner post-merge with pyyaml, nodejs, and @google/gemini-cli.
    python3 -c "import yaml" 2>/dev/null \
      || pip install --no-cache-dir pyyaml
    # Subshells may invoke system /usr/bin/python3 directly instead of
    # /opt/venv/bin/python3.
    if ! /usr/bin/python3 -c "import yaml" 2>/dev/null; then
      apt-get -y update && apt-get -y install python3-yaml
    fi
    if ! command -v npm >/dev/null 2>&1; then
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get -y update && apt-get -y install nodejs
    fi
    if ! command -v gemini >/dev/null 2>&1; then
      npm install -g @google/gemini-cli@0.66.0
    fi
    for gdir in "$HOME/.gemini" "/root/.gemini"; do
      mkdir -p "$gdir/policies"
      cat > "$gdir/settings.json" <<EOF
    {
      "security": {"auth": {"selectedType": "vertex-ai"}},
      "model": {"name": "${_GEMINI_MODEL}"}
    }
    EOF
      cat > "$gdir/trustedFolders.json" <<'EOF'
    {
      "/tmp": "TRUST_FOLDER",
      "/workspace": "TRUST_FOLDER"
    }
    EOF
      cat > "$gdir/policies/allow-yolo-shell.toml" <<'EOF'
    [[rule]]
    toolName = "run_shell_command"
    argsPattern = ".*"
    decision = "allow"
    priority = 999
    modes = ["yolo"]
    allowRedirection = true
    EOF
    done
    python3 tools/run_eval.py --all
    make gcluster
    COMPARE_ARGS=()
    if [ -n "${_COMPARE_REF}" ]; then
      COMPARE_ARGS=(--compare "${_COMPARE_REF}")
    fi
    python3 -u tools/run_eval.py \
      --skill skills/cluster-blueprint-assistant \
      --live \
      --agent gemini \
      --project "$PROJECT_ID" \
      --cases "${_EVAL_CASES}" \
      --concurrency "${_EVAL_CONCURRENCY}" \
      --retries "${_EVAL_RETRIES}" \
      --timeout 600 \
      --live-logs /workspace/live-logs \
      "${COMPARE_ARGS[@]}" \
      --json-output /workspace/live-eval-results.json \
      --markdown-output /workspace/live-eval-summary.md
substitutions:
  _EVAL_CASES: "case_1,case_4,case_6,case_15,case_16"
  _EVAL_CONCURRENCY: "4"
  _EVAL_RETRIES: "1"
  _GEMINI_MODEL: "gemini-3.1-pro-preview"
  _COMPARE_REF: ""
  _ARTIFACTS_BUCKET: ""
timeout: 3600s
options:
  machineType: N1_HIGHCPU_8
  automapSubstitutions: true
