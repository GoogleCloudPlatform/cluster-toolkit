# Shared Cloud Build workflow for PR-skills-smoke-eval (automatic live smoke
# gate on skill/eval PRs) and PR-test-skills-full-eval (approval-gated full
# evaluation suite on matching skill, runner, Cloud Build, and Go CLI PRs).

---

steps:
- id: git-prepare-workspace
  name: gcr.io/cloud-builders/git
  automapSubstitutions: true
  entrypoint: bash
  args:
  - -ceu
  - |
    cd /workspace
    if [ -d .git ]; then
      git remote get-url origin >/dev/null 2>&1 || git remote add origin \
        https://github.com/GoogleCloudPlatform/cluster-toolkit.git
      if [ -f .git/shallow ]; then
        git fetch --unshallow origin
      fi
    else
      rm -f .git
      git init -b main
      git config user.email "ci@cluster-toolkit.local"
      git config user.name "CTK Eval CI"
      git add -A
      git commit -q -m "ci workspace snapshot"
      git remote add origin \
        https://github.com/GoogleCloudPlatform/cluster-toolkit.git
    fi
    RAW_BASE="${_BASE_BRANCH}"
    TARGET_BASE="$${BASE_BRANCH:-$${RAW_BASE:-develop}}"
    git fetch --no-tags origin \
      "+refs/heads/$${TARGET_BASE}:refs/remotes/origin/$${TARGET_BASE}" \
      || echo "[WARN] Failed to fetch base branch '$${TARGET_BASE}' from origin" >&2
    if [ "$${TARGET_BASE}" != "main" ]; then
      git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" \
        || echo "[WARN] Failed to fetch fallback branch 'main' from origin" >&2
    fi
    if [ -n "${_COMPARE_REF}" ]; then
      git fetch --no-tags origin \
        "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
      REF="${_COMPARE_REF}"
      git rev-parse --verify "$${REF}^{commit}" >/dev/null 2>&1 \
        || git fetch --no-tags origin "$${REF#origin/}" || true
    fi
- id: skills-live-eval
  waitFor: [git-prepare-workspace]
  name: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner
  automapSubstitutions: true
  env:
  - 'GOOGLE_GENAI_USE_VERTEXAI=true'
  - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
  - 'GOOGLE_CLOUD_LOCATION=global'
  - 'GEMINI_CLI_TRUST_WORKSPACE=true'
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    cd /workspace
    archive_artifacts() {
      ARTIFACT_BKT="${_ARTIFACTS_BUCKET:-${PROJECT_ID}-build-logs}"
      if [ -n "${ARTIFACT_BKT}" ]; then
        DEST="gs://${ARTIFACT_BKT}/skills-eval/${BUILD_ID:-manual}"
        for p in /workspace/live-eval-results.json \
          /workspace/live-eval-summary.md /workspace/live-logs; do
          if [ -e "$p" ]; then
            gsutil -m cp -r "$p" "${DEST}/" \
              || echo "[WARN] Failed to archive $p to ${DEST}/" >&2
          fi
        done
      fi
    }
    trap archive_artifacts EXIT
    # Transitional bootstrap until DAILY-image-build-test-runner rebuilds
    # test-runner post-merge with pyyaml, nodejs, and @google/gemini-cli.
    if ! command -v gemini >/dev/null 2>&1 \
      || ! gemini --version 2>/dev/null | grep -qx '0\.68\.0' \
      || ! python3 -c "import yaml" 2>/dev/null \
      || ! /usr/bin/python3 -c "import yaml" 2>/dev/null; then
      bash tools/cloud-build/images/test-runner/install-skills-deps.sh
    fi
    # Gemini CLI 0.68.0 activate_skill scans .gemini/skills and ~/.gemini/skills
    # rather than skills/*/SKILL.md; excluding it prevents stale skill leakage.
    for gdir in "$HOME/.gemini" "/root/.gemini"; do
      mkdir -p "$gdir/policies"
      cat > "$gdir/settings.json" <<EOF
    {
      "security": {"auth": {"selectedType": "vertex-ai"}},
      "model": {"name": "${_GEMINI_MODEL}"},
      "tools": {"exclude": ["activate_skill"]}
    }
    EOF
      cat > "$gdir/trustedFolders.json" <<'EOF'
    {
      "/tmp": "TRUST_FOLDER",
      "/workspace": "TRUST_FOLDER"
    }
    EOF
      cat > "$gdir/policies/allow-yolo-shell.toml" <<'EOF'
    [[rule]]
    toolName = "run_shell_command"
    decision = "allow"
    priority = 999
    allowRedirection = true
    EOF
    done
    make test-skills
    COMPARE_ARGS=()
    if [ -n "${_COMPARE_REF}" ]; then
      COMPARE_ARGS=(--compare "${_COMPARE_REF}")
    fi
    # Backward-compatible translation if the provisioned trigger still passes
    # the legacy 5-case list before Terraform apply updates it:
    EVAL_SKILL="${_EVAL_SKILL}"
    if [ "${_EVAL_CASES}" = "case_1,case_4,case_6,case_15,case_16" ]; then
      EVAL_CASES="smoke"
      if [ "${EVAL_SKILL}" = "skills/cluster-blueprint-assistant" ]; then
        EVAL_SKILL=""
      fi
    else
      EVAL_CASES="${_EVAL_CASES}"
    fi
    if [ -n "${EVAL_SKILL}" ]; then
      TARGET_ARGS=(--skill "${EVAL_SKILL}")
    elif [ "${EVAL_CASES}" = "all" ]; then
      TARGET_ARGS=(--all)
    else
      RAW_BASE="${_BASE_BRANCH}"
      TARGET_BASE="${BASE_BRANCH:-${RAW_BASE:-develop}}"
      if git rev-parse --verify "origin/${TARGET_BASE}^{commit}" >/dev/null 2>&1; then
        BASE_REF="origin/${TARGET_BASE}"
      else
        BASE_REF="origin/main"
      fi
      TARGET_ARGS=(--changed-from "${BASE_REF}")
    fi
    if python3 tools/run_eval.py "${TARGET_ARGS[@]}" \
      --cases "${EVAL_CASES}" --check-needs-gcluster; then
      make gcluster
    else
      echo "[INFO] Skipping upfront make gcluster (blueprint_reexpand inactive for selected cases)."
    fi
    timeout --signal=TERM --kill-after=30s 3300s python3 -u tools/run_eval.py \
      "${TARGET_ARGS[@]}" \
      --live \
      --agent gemini \
      --project "$PROJECT_ID" \
      --cases "${EVAL_CASES}" \
      --concurrency "${_EVAL_CONCURRENCY}" \
      --retries "${_EVAL_RETRIES}" \
      --timeout 600 \
      --live-logs /workspace/live-logs \
      "${COMPARE_ARGS[@]}" \
      --json-output /workspace/live-eval-results.json \
      --markdown-output /workspace/live-eval-summary.md
substitutions:
  _BASE_BRANCH: "develop"
  _EVAL_CASES: "smoke"
  _EVAL_SKILL: ""
  _EVAL_CONCURRENCY: "4"
  _EVAL_RETRIES: "1"
  _GEMINI_MODEL: "gemini-3.1-pro-preview"
  _COMPARE_REF: ""
  _ARTIFACTS_BUCKET: ""
timeout: 3600s
options:
  machineType: N1_HIGHCPU_8
  automapSubstitutions: true
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
