# Shared Cloud Build workflow for PR-skills-smoke-eval (automatic live smoke
# gate on skill/eval PRs) and PR-test-skills-full-eval (on-demand
# approval-gated full evaluation suite across all skills on any PR).

---

steps:
- id: git-prepare-workspace
  name: gcr.io/cloud-builders/git
  entrypoint: bash
  args:
  - -ceu
  - |
    cd /workspace
    if [ -d .git ]; then
      if [ -f .git/shallow ]; then
        git fetch --unshallow
      fi
    else
      rm -f .git
      git init -b main
      git config user.email "ci@cluster-toolkit.local"
      git config user.name "CTK Eval CI"
      git add -A
      git commit -q -m "ci workspace snapshot"
    fi
    git remote get-url origin >/dev/null 2>&1 || git remote add origin \
      https://github.com/GoogleCloudPlatform/cluster-toolkit.git
    BASE_REF="${_BASE_BRANCH}"
    [ -n "$${BASE_REF}" ] || BASE_REF="develop"
    git fetch --no-tags origin \
      "+refs/heads/$${BASE_REF}:refs/remotes/origin/$${BASE_REF}" 2>/dev/null || true
    if [ -n "${_COMPARE_REF}" ]; then
      git fetch --no-tags origin \
        "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
      REF="${_COMPARE_REF}"
      git rev-parse --verify "$${REF}^{commit}" >/dev/null 2>&1 \
        || git fetch --no-tags origin "$${REF#origin/}" || true
    fi
- id: skills-live-eval
  waitFor: [git-prepare-workspace]
  name: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner
  automapSubstitutions: true
  env:
  - 'GOOGLE_GENAI_USE_VERTEXAI=true'
  - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
  - 'GOOGLE_CLOUD_LOCATION=global'
  - 'GEMINI_CLI_TRUST_WORKSPACE=true'
  script: |
    #!/usr/bin/env bash
    set -euo pipefail
    cd /workspace
    archive_artifacts() {
      if [ -n "${_ARTIFACTS_BUCKET}" ]; then
        DEST="gs://${_ARTIFACTS_BUCKET}/skills-eval/${BUILD_ID:-manual}"
        gsutil -m cp -r /workspace/live-eval-results.json \
          /workspace/live-eval-summary.md /workspace/live-logs \
          "${DEST}/" 2>/dev/null || true
      fi
    }
    trap archive_artifacts EXIT
    # Transitional bootstrap until DAILY-image-build-test-runner rebuilds
    # test-runner post-merge with pyyaml, nodejs, and @google/gemini-cli.
    python3 -c "import yaml" 2>/dev/null \
      || pip install --no-cache-dir pyyaml
    # Subshells may invoke system /usr/bin/python3 directly instead of
    # /opt/venv/bin/python3.
    if ! /usr/bin/python3 -c "import yaml" 2>/dev/null; then
      apt-get -y update && apt-get -y install python3-yaml
    fi
    if ! command -v npm >/dev/null 2>&1; then
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      apt-get -y update && apt-get -y install nodejs
    fi
    if ! gemini --version 2>/dev/null | grep -qx '0\.68\.0'; then
      npm install -g @google/gemini-cli@0.68.0
    fi
    for gdir in "$HOME/.gemini" "/root/.gemini"; do
      mkdir -p "$gdir/policies"
      cat > "$gdir/settings.json" <<EOF
    {
      "security": {"auth": {"selectedType": "vertex-ai"}},
      "model": {"name": "${_GEMINI_MODEL}"},
      "tools": {"exclude": ["activate_skill"]}
    }
    EOF
      cat > "$gdir/trustedFolders.json" <<'EOF'
    {
      "/tmp": "TRUST_FOLDER",
      "/workspace": "TRUST_FOLDER"
    }
    EOF
      cat > "$gdir/policies/allow-yolo-shell.toml" <<'EOF'
    [[rule]]
    toolName = "run_shell_command"
    decision = "allow"
    priority = 999
    allowRedirection = true
    EOF
    done
    python3 tools/run_eval.py --all
    make gcluster
    COMPARE_ARGS=()
    if [ -n "${_COMPARE_REF}" ]; then
      COMPARE_ARGS=(--compare "${_COMPARE_REF}")
    fi
    # Backward-compatible translation if the provisioned trigger still passes
    # the legacy 5-case list before Terraform apply updates it:
    if [ "${_EVAL_CASES}" = "case_1,case_4,case_6,case_15,case_16" ]; then
      EVAL_CASES="smoke"
    else
      EVAL_CASES="${_EVAL_CASES}"
    fi
    if [ -n "${_EVAL_SKILL}" ]; then
      SKILL_ARGS=(--skill "${_EVAL_SKILL}")
    elif [ "${EVAL_CASES}" = "all" ]; then
      SKILL_ARGS=(--all)
    else
      BASE_REF="origin/${_BASE_BRANCH:-develop}"
      CHANGED_FILES="$(git diff --name-only "${BASE_REF}...HEAD" 2>/dev/null || true)"
      if [ -n "${CHANGED_FILES}" ] && ! echo "${CHANGED_FILES}" | grep -qvE '^skills/[^/]+/'; then
        CHANGED_SKILLS="$(echo "${CHANGED_FILES}" | awk -F/ 'NF>=2 {print "skills/"$2}' | sort -u | while read -r sdir; do if [ -f "${sdir}/SKILL.md" ]; then echo "${sdir}"; fi; done | paste -sd, -)"
        if [ -n "${CHANGED_SKILLS}" ]; then
          SKILL_ARGS=(--skill "${CHANGED_SKILLS}")
        else
          SKILL_ARGS=(--all)
        fi
      else
        SKILL_ARGS=(--all)
      fi
    fi
    python3 -u tools/run_eval.py \
      "${SKILL_ARGS[@]}" \
      --live \
      --agent gemini \
      --project "$PROJECT_ID" \
      --cases "${EVAL_CASES}" \
      --concurrency "${_EVAL_CONCURRENCY}" \
      --retries "${_EVAL_RETRIES}" \
      --timeout 600 \
      --live-logs /workspace/live-logs \
      "${COMPARE_ARGS[@]}" \
      --json-output /workspace/live-eval-results.json \
      --markdown-output /workspace/live-eval-summary.md
substitutions:
  _BASE_BRANCH: "develop"
  _EVAL_CASES: "smoke"
  _EVAL_SKILL: ""
  _EVAL_CONCURRENCY: "4"
  _EVAL_RETRIES: "1"
  _GEMINI_MODEL: "gemini-3.1-pro-preview"
  _COMPARE_REF: ""
  _ARTIFACTS_BUCKET: ""
timeout: 3600s
options:
  machineType: N1_HIGHCPU_8
  automapSubstitutions: true
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
