# Shared Cloud Build workflow for PR-skills-smoke-eval (automatic 5-case smoke gate
# on skill/validator PRs) and PR-test-skills-full-eval (on-demand approval-gated
# full 17-case evaluation suite on any PR).

---

steps:
- id: git-fetch-unshallow
  name: gcr.io/cloud-builders/git
  args: ['fetch', '--unshallow']
- id: skills-live-eval
  waitFor: [git-fetch-unshallow]
  name: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner
  env:
  - 'GOOGLE_GENAI_USE_VERTEXAI=true'
  - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
  - 'GOOGLE_CLOUD_LOCATION=global'
  script: |
    set -euo pipefail
    cd /workspace
    python3 tools/run_eval.py --all
    make gcluster
    if ! command -v gemini >/dev/null 2>&1; then
      npm install -g @google/gemini-cli@0.66.0
    fi
    python3 tools/run_eval.py \
      --skill skills/cluster-blueprint-assistant \
      --live \
      --agent gemini \
      --project "$PROJECT_ID" \
      --cases "${_EVAL_CASES}" \
      --concurrency "${_EVAL_CONCURRENCY}" \
      --json-output /workspace/live-eval-results.json \
      --markdown-output /workspace/live-eval-summary.md
    cat /workspace/live-eval-summary.md
substitutions:
  _EVAL_CASES: "case_1,case_4,case_6,case_10,case_11"
  _EVAL_CONCURRENCY: "3"
timeout: 1800s
options:
  machineType: N1_HIGHCPU_8
