---
timeout: 3600s
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

steps:
- name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  env:
  - "BUILD_ID=${BUILD_ID}"
  - "PROJECT_ID=${PROJECT_ID}"
  - "DRY_RUN=false"
  args:
  - -c
  - |
    set -euo pipefail

    echo "Starting Filestore Cleanup..."

    # Retry with exponential backoff (up to ~34 minutes) if Filestore is in use by active builds.
    attempt=0
    max_retries=10

    while [ "$$attempt" -le "$$max_retries" ]; do
        if [ "$$attempt" -gt 0 ]; then
            wait_time=$$((2 ** attempt))
            echo "Waiting $${wait_time}s before retry $${attempt} of $${max_retries}..."
            sleep "$$wait_time"
        fi

        rc=0
        /workspace/tools/clean-filestore-limit.sh || rc=$$?

        case "$$rc" in
            0)
                echo "Filestore cleanup and limit reset completed successfully."
                exit 0
                ;;
            2)
                echo "Filestore is currently in use; retrying with backoff..."
                ;;
            *)
                echo "Cleanup script encountered an error (exit code: $${rc}); retrying..."
                ;;
        esac

        attempt=$$((attempt + 1))
    done

    echo "ERROR: Filestore cleanup could not complete after $${max_retries} retries."
    exit 1
