---
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

steps:
- name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  env:
  - "BUILD_ID=${BUILD_ID}"
  - "PROJECT_ID=${PROJECT_ID}"
  - "DRY_RUN=false"
  args:
  - -c
  - |
    set -euo pipefail

    echo "Starting Filestore Cleanup..."

    # Retry the cleanup script up to 3 times to handle transient gcloud API errors.
    attempt=1
    max_retries=3

    while [ "$attempt" -le "$max_retries" ]; do
        echo "Execution attempt ${attempt} of ${max_retries}..."

        if /workspace/tools/clean-filestore-limit.sh; then
            echo "Filestore cleanup completed successfully."
            exit 0
        fi

        echo "Cleanup script failed on attempt ${attempt}."
        if [ "$attempt" -lt "$max_retries" ]; then
            echo "Waiting 15 seconds before retrying..."
            sleep 15
        fi
        attempt=$((attempt + 1))
    done

    echo "ERROR: Cleanup failed after ${max_retries} attempts."
    exit 1
