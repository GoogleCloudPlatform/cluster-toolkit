---
tags:
- slurm6
- m.schedmd-slurm-gcp-v6-controller
- m.schedmd-slurm-gcp-v6-login
- m.schedmd-slurm-gcp-v6-nodeset
- m.schedmd-slurm-gcp-v6-partition
- m.startup-script
- m.vpc
- m.cloud-storage-bucket
- m.gpu-rdma-vpc
- m.pre-existing-network-storage
- m.managed-lustre
- m.private-service-access

substitutions:
  _TEST_PREFIX: "" # Default to no prefix

timeout: 86400s
queueTtl: 86400s  # 24hr
logsBucket: "gs://$PROJECT_NUMBER.cloudbuild-logs.googleusercontent.com"
steps:
# 1. Build and push workspace container containing the current code layer
- id: build-workspace-image
  name: gcr.io/cloud-builders/docker
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -eo pipefail
    docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID -f- . <<EOF
    FROM us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:latest
    COPY . /workspace
    WORKDIR /workspace
    EOF

    MAX_RETRIES=3
    for i in $$(seq 1 $$MAX_RETRIES); do
      echo "Push attempt $$i of $$MAX_RETRIES..."
      if docker push us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID; then
        echo "The image pushed successfully!"
        break
      fi

      if [ "$$i" -eq "$$MAX_RETRIES" ]; then
        echo "The image push failed after $$MAX_RETRIES attempts. (Check https://status.cloud.google.com/ for server outages)"
        exit 1
      fi

      echo "The image push failed, retrying in 10 seconds..."
      sleep 10
    done

# 2. Retrieve GCS Bucket name from Secret Manager and generate Job YAML
- id: generate-job-manifest
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  secretEnv: ['SA_EMAIL', 'GCLUSTER_GCS_PATH', 'CHS_REPO', 'TRIAGE_GCS_BUCKET', 'TRIAGE_PROJECT_NUMBER', 'TRIAGE_INVOKER_SA', 'TRIAGE_CLOUD_RUN_URL']
  args:
  - -c
  - |
    set -eo pipefail
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)

    # Determine the priority class based on the test prefix.
    if [ "${_TEST_PREFIX}" == "hotfix-" ]; then
      PRIORITY_LINE="priorityClassName: emergency-hotfix-priority"
    else
      PRIORITY_LINE=""
    fi

    SA_UNIQUE_ID=$(gcloud iam service-accounts describe "$$SA_EMAIL" --project="$PROJECT_ID" --format="value(uniqueId)")
    OSLOGIN_USER="sa_$${SA_UNIQUE_ID}"

    cat <<EOF > job.yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ml-a4x-highgpu-slurm-$$BUILD_ID_SHORT
      namespace: default
      labels:
        kueue.x-k8s.io/queue-name: local-queue-test-locks
        build-id: "$BUILD_ID"
    spec:
      suspend: true # Required for Kueue: the job must be created in suspended state for Kueue to manage it
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          annotations:
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        spec:
          $$PRIORITY_LINE
          terminationGracePeriodSeconds: 1800 # Grants 30 minutes for terraform destroy to finish gracefully if cancelled
          serviceAccountName: test-kueue-cluster-runner-ksa
          restartPolicy: Never
          containers:
          - name: runner
            image: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID
            env:
            - name: ANSIBLE_HOST_KEY_CHECKING
              value: "false"
            - name: ANSIBLE_CONFIG
              value: "/workspace/tools/cloud-build/ansible.cfg"
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: _TEST_PREFIX
              value: "${_TEST_PREFIX}"
            - name: GCLUSTER_GCS_PATH
              value: "$$GCLUSTER_GCS_PATH"
            - name: TRIAGE_GCS_BUCKET
              value: "$$TRIAGE_GCS_BUCKET"
            - name: TRIAGE_PROJECT_NUMBER
              value: "$$TRIAGE_PROJECT_NUMBER"
            - name: TRIAGE_INVOKER_SA
              value: "$$TRIAGE_INVOKER_SA"
            - name: TRIAGE_CLOUD_RUN_URL
              value: "$$TRIAGE_CLOUD_RUN_URL"
            - name: CHS_REPO
              value: "$$CHS_REPO"
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -x -e
              echo "\"test_file_path\": tools/cloud-build/daily-tests/builds/ml-a4x-highgpu-slurm.yaml"
              cd /workspace

              DEPLOYMENT_NAME="a4x-$$BUILD_ID_SHORT"

              # Force clear any leaked Terraform state locks from previously preempted attempts of this test run.
              echo "Checking for and clearing leaked Terraform state locks..."
              gsutil rm "gs://daily-tests-tf-state/*/\$$DEPLOYMENT_NAME/**.tflock" 2>/dev/null || true

              RUN_CLEANUP=true
              source /workspace/tools/cloud-build/kueue_cleanup_pod.sh
              trap cleanup_pod EXIT SIGTERM SIGINT

              bash tools/get_binary.sh "${_TEST_PREFIX}"
              REGION=us-central1
              ZONE=us-central1-b

              BLUEPRINT="/workspace/examples/machine-learning/a4x-highgpu-4g/a4xhigh-slurm-blueprint.yaml"

              bash tools/add_ttl_label.sh \$$BLUEPRINT
              python3 tools/fix_vpc_name.py \$$BLUEPRINT "${_TEST_PREFIX}"

              sed -i -e '/deletion_protection:/{n;s/enabled: true/enabled: false/}' \$$BLUEPRINT
              sed -i -e '/reason:/d' \$$BLUEPRINT

              ansible-playbook tools/cloud-build/daily-tests/ansible_playbooks/slurm-integration-test.yml \
                --extra-vars="test_prefix=${_TEST_PREFIX}" --extra-vars="use_fixed_vpc=true" \
                --user="$$OSLOGIN_USER" \
                --extra-vars="project=$PROJECT_ID build=$$BUILD_ID_SHORT full_build_id=$BUILD_ID chs_repo=\$$CHS_REPO" \
                --extra-vars="region=\$$REGION zone=\$$ZONE" \
                --extra-vars="@tools/cloud-build/daily-tests/tests/ml-a4x-highgpu-slurm.yml" \
                --extra-vars="triage_gcs_bucket_override=$$TRIAGE_GCS_BUCKET" \
                --extra-vars="triage_project_number_override=$$TRIAGE_PROJECT_NUMBER" \
                --extra-vars="triage_invoker_sa_override=$$TRIAGE_INVOKER_SA" \
                --extra-vars="triage_cloud_run_url_override=$$TRIAGE_CLOUD_RUN_URL" &
              ANSIBLE_PID=\$$!

              wait \$$ANSIBLE_PID
              RUN_CLEANUP=false
            resources:
              requests:
                cpu: 200m
                memory: "2Gi"
                test-locks/slurm: 1
                test-locks/ml-a4x-highgpu-slurm: 1
                test-locks/a4x: 1
              limits:
                cpu: 1
                memory: "2Gi"
                test-locks/slurm: 1
                test-locks/ml-a4x-highgpu-slurm: 1
                test-locks/a4x: 1
    EOF

# 3. Submit and Monitor GKE Kueue Job with Retry
- id: submit-and-monitor-gke-job
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - tools/cloud-build/submit_and_monitor_kueue_job.sh
  - ml-a4x-highgpu-slurm
  - $BUILD_ID

# 4. Cleanup the built image from Registry to save costs
- id: cleanup-image
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  allowFailure: true
  env:
  - 'PROJECT_ID=$PROJECT_ID'
  - 'BUILD_ID=$BUILD_ID'
  args:
  - tools/cloud-build/image_cleanup.sh


availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/sa-email/versions/latest
    env: 'SA_EMAIL'
  - versionName: projects/${PROJECT_ID}/secrets/gcluster-develop-release-bucket/versions/latest
    env: 'GCLUSTER_GCS_PATH'
  - versionName: projects/${PROJECT_ID}/secrets/triage-gcs-bucket/versions/latest
    env: 'TRIAGE_GCS_BUCKET'
  - versionName: projects/${PROJECT_ID}/secrets/triage-project-number/versions/latest
    env: 'TRIAGE_PROJECT_NUMBER'
  - versionName: projects/${PROJECT_ID}/secrets/triage-invoker-sa/versions/latest
    env: 'TRIAGE_INVOKER_SA'
  - versionName: projects/${PROJECT_ID}/secrets/triage-cloud-run-url/versions/latest
    env: 'TRIAGE_CLOUD_RUN_URL'
  - versionName: projects/${PROJECT_ID}/secrets/cluster-health-scanner/versions/latest
    env: 'CHS_REPO'
