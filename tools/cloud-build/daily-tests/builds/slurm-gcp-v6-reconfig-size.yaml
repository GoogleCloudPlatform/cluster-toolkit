---
tags:
- m.pre-existing-vpc
- m.schedmd-slurm-gcp-v6-controller
- m.schedmd-slurm-gcp-v6-login
- m.schedmd-slurm-gcp-v6-nodeset
- m.schedmd-slurm-gcp-v6-partition
- slurm6

substitutions:
  _TEST_PREFIX: "" # Default to no prefix

timeout: 86400s
queueTtl: 86400s  # 24hr
logsBucket: "gs://$PROJECT_NUMBER.cloudbuild-logs.googleusercontent.com"
steps:
# 1. Build and push workspace container containing the current code layer
- id: build-workspace-image
  name: gcr.io/cloud-builders/docker
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -eo pipefail
    docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID -f- . <<EOF
    FROM us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:latest
    COPY . /workspace
    WORKDIR /workspace
    EOF

    MAX_RETRIES=3
    for i in $$(seq 1 $$MAX_RETRIES); do
      echo "Push attempt $$i of $$MAX_RETRIES..."
      if docker push us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID; then
        echo "The image pushed successfully!"
        break
      fi

      if [ "$$i" -eq "$$MAX_RETRIES" ]; then
        echo "The image push failed after $$MAX_RETRIES attempts. (Check https://status.cloud.google.com/ for server outages)"
        exit 1
      fi

      echo "The image push failed, retrying in 10 seconds..."
      sleep 10
    done

# 2. Retrieve GCS Bucket name from Secret Manager and generate Job YAML
- id: generate-job-manifest
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -eo pipefail
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)

    # Determine the priority class based on the test prefix.
    if [ "${_TEST_PREFIX}" == "hotfix-" ]; then
      PRIORITY_LINE="priorityClassName: emergency-hotfix-priority"
    else
      PRIORITY_LINE=""
    fi

    cat <<EOF > job.yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: slurm-gcp-v6-reconfig-size-$$BUILD_ID_SHORT
      namespace: default
      labels:
        kueue.x-k8s.io/queue-name: local-queue-test-locks
        build-id: "$BUILD_ID"
    spec:
      suspend: true # Required for Kueue: the job must be created in suspended state for Kueue to manage it
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          annotations:
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        spec:
          $$PRIORITY_LINE
          terminationGracePeriodSeconds: 1800 # Grants 30 minutes for terraform destroy to finish gracefully if cancelled
          serviceAccountName: test-kueue-cluster-runner-ksa
          restartPolicy: Never
          containers:
          - name: runner
            image: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID
            env:
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -x -e
              echo "\"test_file_path\": tools/cloud-build/daily-tests/builds/slurm-gcp-v6-reconfig-size.yaml"
              cd /workspace

              DEPLOYMENT_NAME="$$BUILD_ID_SHORT-slurm-reconfig"

              # Force clear any leaked Terraform state locks from previously preempted attempts of this test run.
              echo "Checking for and clearing leaked Terraform state locks..."
              gsutil rm "gs://daily-tests-tf-state/*/\$$DEPLOYMENT_NAME/**.tflock" 2>/dev/null || true

              RUN_CLEANUP=true
              source /workspace/tools/cloud-build/kueue_cleanup_pod.sh
              trap cleanup_pod EXIT SIGTERM SIGINT

              bash tools/get_binary.sh "" "true"

              BP_BEFORE="tools/python-integration-tests/blueprints/slurm-reconfig-before.yaml"
              BP_AFTER="tools/python-integration-tests/blueprints/slurm-reconfig-after.yaml"

              # 2. Run the TTL script on both files
              bash tools/add_ttl_label.sh \$$BP_BEFORE
              bash tools/add_ttl_label.sh \$$BP_AFTER

              python3 tools/python-integration-tests/slurm_reconfig_size.py

              RUN_CLEANUP=false
            resources:
              requests:
                cpu: 200m
                memory: "2Gi"
                test-locks/slurm-gcp-v6-reconfig-size: 1
              limits:
                cpu: 1
                memory: "2Gi"
                test-locks/slurm-gcp-v6-reconfig-size: 1
    EOF

# 3. Submit and Monitor GKE Kueue Job with Retry
- id: submit-and-monitor-gke-job
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - tools/cloud-build/submit_and_monitor_kueue_job.sh
  - slurm-gcp-v6-reconfig-size
  - $BUILD_ID

# 4. Cleanup the built image from Registry to save costs
- id: cleanup-image
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  allowFailure: true
  env:
  - 'PROJECT_ID=$PROJECT_ID'
  - 'BUILD_ID=$BUILD_ID'
  args:
  - tools/cloud-build/image_cleanup.sh
