---
tags:
- vm
- m.filestore
- m.startup-script
- m.vpc
- m.vm-instance
- m.wait-for-startup

substitutions:
  _PROVISIONING_MODEL: ""
  _TEST_PREFIX: "" # Default to no prefix

timeout: 86400s
queueTtl: 86400s  # 24hr
logsBucket: "gs://$PROJECT_NUMBER.cloudbuild-logs.googleusercontent.com"
steps:
# 1. Build and push workspace container containing the current code layer
- id: build-workspace-image
  name: gcr.io/cloud-builders/docker
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -eo pipefail
    docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID -f- . <<EOF
    FROM us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:latest
    COPY . /workspace
    WORKDIR /workspace
    EOF
    docker push us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID

# 2. Retrieve GCS Bucket name from Secret Manager and generate Job YAML
- id: generate-job-manifest
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  secretEnv: ['SA_EMAIL', 'GCLUSTER_GCS_PATH']
  args:
  - -c
  - |
    set -eo pipefail
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)
    OPTIONS_BUCKET="hpc-ctk1357"

    # Determine the priority class based on the test prefix.
    if [ "${_TEST_PREFIX}" == "hotfix-" ]; then
      PRIORITY_LINE="priorityClassName: emergency-hotfix-priority"
    else
      PRIORITY_LINE=""
    fi

    SA_UNIQUE_ID=$(gcloud iam service-accounts describe "$$SA_EMAIL" --project="$PROJECT_ID" --format="value(uniqueId)")
    OSLOGIN_USER="sa_$${SA_UNIQUE_ID}"

    cat <<EOF > job.yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: h4d-vm-$$BUILD_ID_SHORT
      namespace: default
      labels:
        kueue.x-k8s.io/queue-name: local-queue-test-locks
        build-id: "$BUILD_ID"
    spec:
      suspend: true # Required for Kueue: the job must be created in suspended state for Kueue to manage it
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          annotations:
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        spec:
          $$PRIORITY_LINE
          terminationGracePeriodSeconds: 1800 # Grants 30 minutes for terraform destroy to finish gracefully if cancelled
          serviceAccountName: test-kueue-cluster-runner-ksa
          restartPolicy: Never
          containers:
          - name: runner
            image: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID
            env:
            - name: CHECK_FILESTORE
              value: "true"
            - name: REQUIRED_FILESTORE_TIER
              value: "BASIC_SSD"
            - name: REQUIRED_FILESTORE_GB
              value: "2560"
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: PROVISIONING_MODEL
              value: "$_PROVISIONING_MODEL"
            - name: ANSIBLE_HOST_KEY_CHECKING
              value: "false"
            - name: ANSIBLE_CONFIG
              value: "/workspace/tools/cloud-build/ansible.cfg"
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            - name: NUM_NODES
              value: "4"
            - name: MACHINE_TYPE
              value: "h4d-highmem-192-lssd"
            - name: INSTANCE_PREFIX
              value: "h4dsp"
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: OPTIONS_GCS_PATH
              value: "gs://$${OPTIONS_BUCKET}/h4doptions.txt"
            - name: ENABLE_SPOT_FALLBACK
              value: "true"
            - name: _TEST_PREFIX
              value: "${_TEST_PREFIX}"
            - name: GCLUSTER_GCS_PATH
              value: "$$GCLUSTER_GCS_PATH"
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -e -u -o pipefail
              echo "\"test_file_path\": tools/cloud-build/daily-tests/builds/h4d-vm.yaml"
              echo "Sourcing find_available_zone.sh to determine zone."
              source /workspace/tools/cloud-build/wait_for_available_zone.sh
              if [ -z "\$${ZONE:-}" ]; then
                echo "ERROR: ZONE not found" >&2
                exit 1
              fi
              set -x
              echo "\"test_file_path\": tools/cloud-build/daily-tests/builds/h4d-vm.yaml"
              cd /workspace

              DEPLOYMENT_NAME="h4d-jbvms-$$BUILD_ID_SHORT"

              # Force clear any leaked Terraform state locks from previously preempted attempts of this test run.
              echo "Checking for and clearing leaked Terraform state locks..."
              gsutil rm "gs://daily-tests-tf-state/*/\$$DEPLOYMENT_NAME/**.tflock" 2>/dev/null || true

              RUN_CLEANUP=true
              source /workspace/tools/cloud-build/kueue_cleanup_pod.sh
              trap cleanup_pod EXIT SIGTERM SIGINT

              bash tools/get_binary.sh "${_TEST_PREFIX}"
              REGION="\$${ZONE%-*}"
              BLUEPRINT="/workspace/examples/h4d-vm.yaml"
              sed -i -e '/deletion_protection:/{n;s/enabled: true/enabled: false/}' \$$BLUEPRINT
              sed -i -e '/reason:/d' \$$BLUEPRINT
              sed -i '/  - id: h4d-vms/,/  - id: wait-for-vms/ s/    settings:/    settings:\n      provisioning_model: "'"\$$PROVISIONING_MODEL"'"/' \$$BLUEPRINT

              ENABLE_SPOT="true"
              H4D_VARS_FILE="tools/cloud-build/daily-tests/tests/h4d-vm.yml"
              if [[ "\$$PROVISIONING_MODEL" == "STANDARD" ]]; then
                ENABLE_SPOT="false"
                sed -i '/instance_labels:/,+1d' "\$$H4D_VARS_FILE"
                sed -i '/enable_spot: true/d' "\$$H4D_VARS_FILE"
              else
                echo "INFO: Using \$$H4D_VARS_FILE as it is for SPOT provisioning."
              fi
              bash tools/add_ttl_label.sh \$$BLUEPRINT
              python3 tools/fix_vpc_name.py \$$BLUEPRINT "${_TEST_PREFIX}"

              ansible-playbook tools/cloud-build/daily-tests/ansible_playbooks/base-integration-test.yml \
                --extra-vars="test_prefix=${_TEST_PREFIX}" --extra-vars="use_fixed_vpc=true" \
                --user="$$OSLOGIN_USER" \
                --extra-vars="project=\$$PROJECT_ID build=$$BUILD_ID_SHORT full_build_id=$BUILD_ID" \
                --extra-vars="region=\$$REGION zone=\$$ZONE" \
                --extra-vars="enable_spot=\$$ENABLE_SPOT" \
                --extra-vars="@\$$H4D_VARS_FILE" &
              ANSIBLE_PID=\$$!

              wait \$$ANSIBLE_PID
              RUN_CLEANUP=false
            resources:
              requests:
                cpu: 200m
                memory: "2Gi"
                test-locks/h4d: 1
                test-locks/h4d-vm: 1
              limits:
                cpu: 1
                memory: "2Gi"
                test-locks/h4d: 1
                test-locks/h4d-vm: 1
    EOF

# 3. Submit and Monitor GKE Kueue Job with Retry
- id: submit-and-monitor-gke-job
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - tools/cloud-build/submit_and_monitor_kueue_job.sh
  - h4d-vm
  - $BUILD_ID

# 4. Cleanup the built image from Registry to save costs
- id: cleanup-image
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  allowFailure: true
  args:
  - -c
  - |
    set -eo pipefail
    IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID"
    MAX_RETRIES=5
    RETRY_DELAY=10
    ATTEMPT=1

    echo "Starting cleanup for image: $$IMAGE"

    while [ "$$ATTEMPT" -le "$$MAX_RETRIES" ]; do
      echo "Attempt $$ATTEMPT of $$MAX_RETRIES..."

      if gcloud artifacts docker images delete "$$IMAGE" --quiet; then
        echo "Image successfully deleted."
        exit 0
      fi

      if [ "$$ATTEMPT" -lt "$$MAX_RETRIES" ]; then
        echo "Deletion failed. Retrying in $$RETRY_DELAY seconds..."
        sleep $$RETRY_DELAY
      fi

      ATTEMPT=$$((ATTEMPT + 1))
    done

    echo "Failed to delete image after $$MAX_RETRIES attempts."
    echo "Image will be handled by Artifact Registry background cleanup policies."
    exit 1

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/sa-email/versions/latest
    env: 'SA_EMAIL'
  - versionName: projects/${PROJECT_ID}/secrets/gcluster-develop-release-bucket/versions/latest
    env: 'GCLUSTER_GCS_PATH'
