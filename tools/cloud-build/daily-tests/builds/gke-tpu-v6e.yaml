---
tags:
- m.vpc
- m.service-account
- m.gke-cluster
- m.gke-node-pool
- m.kubectl-apply
- gke

substitutions:
  _PROVISIONING_MODEL: ""
  _TEST_PREFIX: "" # Default to no prefix

timeout: 86400s
queueTtl: 86400s

logsBucket: "gs://$PROJECT_NUMBER.cloudbuild-logs.googleusercontent.com"
steps:
# 1. Build and push workspace container containing the current code layer
- id: build-workspace-image
  name: gcr.io/cloud-builders/docker
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -eo pipefail
    docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID -f- . <<INNEREOF
    FROM us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:latest
    COPY . /workspace
    WORKDIR /workspace
    INNEREOF

    MAX_RETRIES=3
    for i in $$(seq 1 $$MAX_RETRIES); do
      echo "Push attempt $$i of $$MAX_RETRIES..."
      if docker push us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID; then
        echo "The image pushed successfully!"
        break
      fi

      if [ "$$i" -eq "$$MAX_RETRIES" ]; then
        echo "The image push failed after $$MAX_RETRIES attempts. (Check https://status.cloud.google.com/ for server outages)"
        exit 1
      fi

      echo "The image push failed, retrying in 10 seconds..."
      sleep 10
    done

# 2. Retrieve GCS Bucket name from Secret Manager and generate Job YAML
- id: generate-job-manifest
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  secretEnv: ['SA_EMAIL', 'GCLUSTER_GCS_PATH', 'CHS_REPO']
  args:
  - -c
  - |
    set -eo pipefail
    BUILD_ID_SHORT=$$(echo "$BUILD_ID" | cut -c1-6)
    OPTIONS_BUCKET="hpc-ctk1357"

    # Determine the priority class based on the test prefix.
    if [ "${_TEST_PREFIX}" == "hotfix-" ]; then
      PRIORITY_LINE="priorityClassName: emergency-hotfix-priority"
    else
      PRIORITY_LINE=""
    fi

    SA_UNIQUE_ID=$(gcloud iam service-accounts describe "$$SA_EMAIL" --project="$PROJECT_ID" --format="value(uniqueId)")
    OSLOGIN_USER="sa_$${SA_UNIQUE_ID}"

    cat <<INNEREOF > job.yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: gke-tpu-v6e-$$BUILD_ID_SHORT
      namespace: default
      labels:
        kueue.x-k8s.io/queue-name: local-queue-test-locks
        build-id: "$BUILD_ID"
    spec:
      suspend: true
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          annotations:
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        spec:
          $$PRIORITY_LINE
          terminationGracePeriodSeconds: 1800
          serviceAccountName: test-kueue-cluster-runner-ksa
          restartPolicy: Never
          containers:
          - name: runner
            image: us-central1-docker.pkg.dev/$PROJECT_ID/hpc-toolkit-repo/test-runner:$BUILD_ID
            env:
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: ANSIBLE_HOST_KEY_CHECKING
              value: "false"
            - name: ANSIBLE_CONFIG
              value: "/workspace/tools/cloud-build/ansible.cfg"
            - name: _TEST_PREFIX
              value: "${_TEST_PREFIX}"
            - name: PROVISIONING_MODEL
              value: "$_PROVISIONING_MODEL"
            - name: MACHINE_TYPE
              value: "tpu"
            - name: TPU_RUNTIME_VERSION
              value: "v2-alpha-tpuv6e"
            - name: ACCELERATOR_TYPE
              value: "v6e-16"
            - name: PROJECT_ID
              value: "$PROJECT_ID"
            - name: NUM_NODES
              value: "2"
            - name: INSTANCE_PREFIX
              value: "v6esp"
            - name: BUILD_ID
              value: "$BUILD_ID"
            - name: OPTIONS_GCS_PATH
              value: "gs://$${OPTIONS_BUCKET}/tpuv6eoptions.txt"
            - name: ENABLE_SPOT_FALLBACK
              value: "true"
            - name: GCLUSTER_GCS_PATH
              value: "$$GCLUSTER_GCS_PATH"
            - name: CHS_REPO
              value: "$$CHS_REPO"
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -x -e
              echo "\"test_file_path\": tools/cloud-build/daily-tests/builds/gke-tpu-v6e.yaml"
              cd /workspace

              DEPLOYMENT_NAME="gke-tpu-v6e-$$BUILD_ID_SHORT"

              # Force clear any leaked Terraform state locks from previously preempted attempts of this test run.
              echo "Checking for and clearing leaked Terraform state locks..."
              gsutil rm "gs://daily-tests-tf-state/*/\$$DEPLOYMENT_NAME/**.tflock" 2>/dev/null || true

              RUN_CLEANUP=true
              source /workspace/tools/cloud-build/kueue_cleanup_pod.sh
              trap cleanup_pod EXIT SIGTERM SIGINT

              echo "Sourcing find_available_zone.sh to determine zone."
              source /workspace/tools/cloud-build/wait_for_available_zone.sh
              if [ -z "\$${ZONE:-}" ]; then
                echo "ERROR: ZONE not found" >&2
                exit 1
              fi
              set -x
              cd /workspace
              bash tools/get_binary.sh "${_TEST_PREFIX}"
              REGION="\$${ZONE%-*}"

              EXAMPLE_BP=examples/gke-tpu-v6e/gke-tpu-v6e.yaml
              # adding vm to act as remote node
              echo '  - id: remote-node'                                                            >> \$$EXAMPLE_BP
              echo '    source: modules/compute/vm-instance'                                        >> \$$EXAMPLE_BP
              echo '    use: [gke-tpu-v6e-net-0]'                                                    >> \$$EXAMPLE_BP
              echo '    settings:'                                                                  >> \$$EXAMPLE_BP
              echo '      machine_type: n2-standard-2'                                              >> \$$EXAMPLE_BP
              echo '      name_prefix: remote-node'                                                 >> \$$EXAMPLE_BP
              echo '      add_deployment_name_before_prefix: true'                                  >> \$$EXAMPLE_BP
              echo ''
              echo '  - id: job_template_hostname'                                                   >> \$$EXAMPLE_BP
              echo '    source: modules/compute/gke-job-template'                                    >> \$$EXAMPLE_BP
              echo '    use: [gke-tpu-v6e-pool]'                                                      >> \$$EXAMPLE_BP
              echo '    settings:'                                                                   >> \$$EXAMPLE_BP
              echo '      image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest'         >> \$$EXAMPLE_BP
              echo '      command:'                                                                  >> \$$EXAMPLE_BP
              echo '      - /bin/bash'                                                               >> \$$EXAMPLE_BP
              echo '      - -c'                                                                      >> \$$EXAMPLE_BP
              echo '      - python -c '\''import warnings; warnings.filterwarnings("ignore"); import jax; print(jax.device_count(), "TPU cores")'\'''    >> \$$EXAMPLE_BP
              echo '      node_count: 1'                                                             >> \$$EXAMPLE_BP
              echo '    outputs: [instructions]'                                                     >> \$$EXAMPLE_BP

              ENABLE_SPOT="true"
              GKE_VARS_FILE="tools/cloud-build/daily-tests/tests/gke-tpu-v6e.yml"
              if [[ "\$$PROVISIONING_MODEL" == "STANDARD" ]]; then
                ENABLE_SPOT="false"
                sed -i '/instance_labels:/,+1d' "\$$GKE_VARS_FILE"
                sed -i '/enable_spot: true/d' "\$$GKE_VARS_FILE"
              else
                echo "INFO: Using \$$GKE_VARS_FILE as it is for SPOT provisioning."
              fi

              sed -i -e '/reservation_affinity:/,+3c\      spot: '"\$$ENABLE_SPOT"'' \$$EXAMPLE_BP
              sed -i '/reservation/d' \$$EXAMPLE_BP
              bash tools/add_ttl_label.sh "\$$EXAMPLE_BP"

              ansible-playbook tools/cloud-build/daily-tests/ansible_playbooks/base-integration-test.yml \
                  --user="$$OSLOGIN_USER" --extra-vars="project=$PROJECT_ID build=$$BUILD_ID_SHORT full_build_id=$BUILD_ID chs_repo=\$$CHS_REPO" \
                  --extra-vars="region=\$$REGION zone=\$$ZONE" \
                  --extra-vars="enable_spot=\$$ENABLE_SPOT" \
                  --extra-vars="@\$$GKE_VARS_FILE" &
              ANSIBLE_PID=\$$!

              wait \$$ANSIBLE_PID
              RUN_CLEANUP=false
            resources:
              requests:
                cpu: 200m
                memory: "2Gi"
                test-locks/tpu-v6e: 1
                test-locks/gke-tpu-v6e: 1
              limits:
                cpu: 1
                memory: "2Gi"
                test-locks/tpu-v6e: 1
                test-locks/gke-tpu-v6e: 1
    INNEREOF

# 3. Submit and Monitor GKE Kueue Job with Retry
- id: submit-and-monitor-gke-job
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  args:
  - tools/cloud-build/submit_and_monitor_kueue_job.sh
  - gke-tpu-v6e
  - $BUILD_ID

# 4. Cleanup the built image from Registry to save costs
- id: cleanup-image
  name: gcr.io/cloud-builders/gcloud
  entrypoint: /bin/bash
  allowFailure: true
  env:
  - 'PROJECT_ID=$PROJECT_ID'
  - 'BUILD_ID=$BUILD_ID'
  args:
  - tools/cloud-build/image_cleanup.sh
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/sa-email/versions/latest
    env: 'SA_EMAIL'
  - versionName: projects/${PROJECT_ID}/secrets/gcluster-develop-release-bucket/versions/latest
    env: 'GCLUSTER_GCS_PATH'
  - versionName: projects/${PROJECT_ID}/secrets/cluster-health-scanner/versions/latest
    env: 'CHS_REPO'
