---
# Proves that community/modules/iam/service-account-profiles is least
# privilege, not merely that the cluster comes up: (1) a job still forces the
# controller to resume and suspend a real node under the custom role, and (2)
# the controller's granted roles contain neither a broad predefined role nor a
# project-level actAs grant.
#
# Shared by every daily test whose blueprint uses this module for its Slurm
# identities. Each test describes its own blueprint's identities through
# custom_vars.service_account_profiles in its tests/*.yml file:
#
#   extra_controller_permissions: controller custom-role permissions beyond the
#     always-on slurm-controller set below, i.e. the capability flags that
#     blueprint enables (enable_placement_policies, enable_tpu, ...).
#   controller_actas_identities: service-account names (the module's `name`
#     setting) the controller attaches to nodes it creates; each must grant
#     the controller roles/iam.serviceAccountUser on itself.
#   no_actas_identities: service-account names the controller must NOT be able
#     to act as (e.g. login, whose VMs Terraform creates, not the controller).
#   controller_role_stage: expected launch stage of the controller's custom
#     role (custom_role_stage); defaults to the provider default, GA.
#   srun_check: run the bounded srun resume check below on partitions[0];
#     defaults to true. Set false when the test already exercises node resume
#     itself (e.g. slurm-v6-tpu's JAX job, which also retries on capacity).
#
# The exact-allowlist checks below (expected_baseline_project_roles,
# expected_controller_custom_permissions) are intentionally coupled to
# the profile catalogue, locals.profiles, in
# community/modules/iam/service-account-profiles/main.tf. Update them, and each test's
# extra_controller_permissions, to match main.tf whenever a blueprint's
# service-account settings change -- that coupling is the point: an
# unreviewed permission addition should break these tests.

- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
    - custom_vars.partitions is defined
    - custom_vars.service_account_profiles is defined
    - custom_vars.service_account_profiles.extra_controller_permissions is defined
    - custom_vars.service_account_profiles.controller_actas_identities is defined
    - custom_vars.service_account_profiles.no_actas_identities is defined
    - deployment_name is defined
    - slurm_cluster_name is defined
    - project is defined

- name: "Security check: define the controller's exact IAM principal"
  ansible.builtin.set_fact:
    controller_principal: "serviceAccount:{{ deployment_name }}-controller@{{ project }}.iam.gserviceaccount.com"

- name: "Security check: define expected baseline project roles (all profiles)"
  ansible.builtin.set_fact:
    expected_baseline_project_roles:
    - roles/logging.logWriter
    - roles/monitoring.metricWriter

# The always-on slurm-controller set (main.tf locals.profiles,
# before any capability flag), plus whatever the test's blueprint enables.
- name: "Security check: define the controller's expected custom-role permissions"
  ansible.builtin.set_fact:
    expected_controller_custom_permissions: "{{ base_controller_permissions + custom_vars.service_account_profiles.extra_controller_permissions }}"
  vars:
    base_controller_permissions:
    - compute.instances.create
    - compute.instances.delete
    - compute.instances.get
    - compute.instances.list
    - compute.instances.setLabels
    - compute.instances.setServiceAccount
    - compute.instances.setTags
    - compute.instances.start
    - compute.instances.use
    - compute.instanceTemplates.get
    - compute.instanceTemplates.useReadOnly
    - compute.images.useReadOnly
    - compute.disks.create
    - compute.disks.setLabels
    - compute.disks.use
    - compute.subnetworks.use
    - compute.networks.use
    - compute.networks.get
    - compute.machineTypes.get
    - compute.machineTypes.list
    - compute.zones.get
    - compute.zones.list
    - compute.regions.get
    - compute.regions.list
    - compute.projects.get
    - compute.acceleratorTypes.get
    - compute.acceleratorTypes.list
    - compute.zoneOperations.get
    - compute.zoneOperations.list
    - compute.regionOperations.get
    - compute.regionOperations.list
    - compute.globalOperations.get
    - compute.globalOperations.list
    - compute.reservations.get
    - compute.reservations.list
    - compute.futureReservations.get
    - compute.resourcePolicies.list
    - compute.resourcePolicies.delete

# compute.instances.setMetadata is not in base_controller_permissions: the
# module grants it through its name-scoped role (checked below). bulkInsert
# needs it.
- name: "Security check: define the controller's expected name-scoped permissions"
  ansible.builtin.set_fact:
    expected_controller_scoped_permissions:
    - compute.instances.setMetadata

# Bound srun so a controller that cannot resume a node fails the test instead
# of waiting for Cloud Build's 24h timeout. A resume takes single-digit
# minutes, so 900s is generous; the job is cancelled by name either way.
- name: "Functional check: force a node resume/suspend cycle via srun"
  when: custom_vars.service_account_profiles.srun_check | default(true) | bool
  block:
  # --kill-after sends SIGKILL if srun ignores the SIGTERM at 900s, so the task
  # cannot hang past the deadline.
  - name: "Functional check: run a bounded srun job"
    register: srun_hostname
    changed_when: srun_hostname.rc == 0
    ansible.builtin.command: >-
      timeout --kill-after=60s 900s
      srun -N 1 -p {{ custom_vars.partitions[0] }}
      --job-name=service-account-profiles-check hostname

  - name: "Functional check: fail if srun did not run on a resumed node"
    ansible.builtin.fail:
      msg: "srun -p {{ custom_vars.partitions[0] }} hostname produced no output"
    when: srun_hostname.stdout | trim | length == 0

  rescue:
  # timeout(1) exits 124 on SIGTERM at the deadline and 137 on SIGKILL after
  # --kill-after; anything else is srun itself failing, which is a different
  # problem (authentication, a bad partition name, a rejected job) and should
  # not be reported as a resume timeout.
  - name: "Functional check: fail after cancelling the job"
    ansible.builtin.fail:
      msg: >-
        {% if srun_hostname.rc | default(0) in [124, 137] %}
        srun -N 1 -p {{ custom_vars.partitions[0] }} did not complete within 900s.
        The controller most likely could not resume a node under its custom role --
        check /var/log/slurm/resume.log on the controller for PERMISSION_DENIED.
        {% else %}
        srun -N 1 -p {{ custom_vars.partitions[0] }} failed before the timeout
        (rc={{ srun_hostname.rc | default('n/a') }}):
        {{ srun_hostname.stderr | default('no stderr captured') }}
        {% endif %}

  always:
  - name: "Functional check: cancel the check job if it is still queued"
    changed_when: false
    failed_when: false
    ansible.builtin.command: "scancel --name=service-account-profiles-check"

- name: "Security check: read the controller service account's granted roles"
  delegate_to: localhost
  register: controller_roles
  changed_when: false
  ansible.builtin.command: >-
    gcloud projects get-iam-policy {{ project }}
    --flatten=bindings[].members
    --filter=bindings.members:serviceAccount:{{ deployment_name }}-controller@{{ project }}.iam.gserviceaccount.com
    --format=value(bindings.role)

- name: "Security check: print the controller service account's granted roles"
  ansible.builtin.debug:
    var: controller_roles.stdout_lines

- name: "Security check: fail if the controller was granted the broad predefined role it replaces"
  ansible.builtin.fail:
    msg: >-
      Controller service account has roles/compute.instanceAdmin.v1
      project-wide; community/modules/iam/service-account-profiles is supposed to
      replace it with a narrower custom role.
  when: '"roles/compute.instanceAdmin.v1" in controller_roles.stdout_lines'

- name: "Security check: fail if the controller was granted project-level actAs"
  ansible.builtin.fail:
    msg: >-
      Controller service account has roles/iam.serviceAccountUser
      project-wide; it should be granted only on the service accounts the
      controller attaches to the nodes it creates.
  when: '"roles/iam.serviceAccountUser" in controller_roles.stdout_lines'

- name: "Security check: fail if no project-scoped custom role was granted"
  ansible.builtin.fail:
    msg: >-
      Controller service account has no projects/{{ project }}/roles/...
      custom role bound; community/modules/iam/service-account-profiles should have
      created and bound one.
  when: controller_roles.stdout_lines | select('match', '^projects/' + project + '/roles/') | list | length == 0

# The controller gets two project-scoped custom roles: the main one (this
# blueprint's permission set) and a second, name-scoped one holding only
# compute.instances.setMetadata, whose role id always ends in ".scoped" -- see
# main.tf's google_project_iam_custom_role.scoped.
- name: "Security check: extract the controller's custom role ids"
  ansible.builtin.set_fact:
    controller_project_role_ids: >-
      {{
        controller_roles.stdout_lines
        | select('match', '^projects/' + project + '/roles/')
        | list
        | map('regex_replace', '^projects/' + project + '/roles/', '')
        | list
      }}

- name: "Security check: split the controller's main role from its name-scoped role"
  ansible.builtin.set_fact:
    controller_custom_role_id: "{{ controller_project_role_ids | reject('match', '.*[.]scoped$') | list | first }}"
    controller_scoped_role_id: "{{ controller_project_role_ids | select('match', '.*[.]scoped$') | list | first }}"

- name: "Security check: fail if the controller has no name-scoped custom role"
  ansible.builtin.fail:
    msg: >-
      Controller service account has no "*.scoped" custom role bound;
      compute.instances.setMetadata should be granted only through that
      name-scoped, IAM-conditioned role, never through the main custom
      role or a project-wide binding.
  when: controller_project_role_ids | select('match', '.*[.]scoped$') | list | length == 0

- name: "Security check: isolate the controller's predefined project-level roles"
  ansible.builtin.set_fact:
    controller_predefined_roles: >-
      {{
        controller_roles.stdout_lines
        | reject('equalto', 'projects/' + project + '/roles/' + controller_custom_role_id)
        | reject('equalto', 'projects/' + project + '/roles/' + controller_scoped_role_id)
        | list
      }}

# Compared in both directions: an extra role is an over-grant, and a missing
# baseline role means the module stopped granting something the workload needs
# (a one-directional actual-minus-expected check would pass on that).
- name: "Security check: fail if the controller's predefined project-level roles are not exactly the expected baseline"
  ansible.builtin.fail:
    msg: >-
      Controller service account's predefined project-level roles do not match the
      expected baseline. Unexpected:
      {{ controller_predefined_roles | difference(expected_baseline_project_roles) }}.
      Missing:
      {{ expected_baseline_project_roles | difference(controller_predefined_roles) }}.
  when: >-
    (controller_predefined_roles | difference(expected_baseline_project_roles) | length > 0) or
    (expected_baseline_project_roles | difference(controller_predefined_roles) | length > 0)

- name: "Security check: read the controller's custom role permissions"
  delegate_to: localhost
  register: controller_custom_role
  changed_when: false
  ansible.builtin.command: >-
    gcloud iam roles describe {{ controller_custom_role_id }}
    --project={{ project }}
    --format=value(includedPermissions)

- name: "Security check: parse the controller's custom role permissions"
  ansible.builtin.set_fact:
    controller_custom_role_permissions: "{{ controller_custom_role.stdout.split(';') }}"

- name: "Security check: fail if the controller's custom role does not exactly match the expected permission allowlist"
  ansible.builtin.fail:
    msg: >-
      Controller custom role {{ controller_custom_role_id }} does not match
      the expected permission allowlist. Extra permissions:
      {{ controller_custom_role_permissions | difference(expected_controller_custom_permissions) }}.
      Missing permissions:
      {{ expected_controller_custom_permissions | difference(controller_custom_role_permissions) }}.
  when: >-
    (controller_custom_role_permissions | difference(expected_controller_custom_permissions) | length > 0) or
    (expected_controller_custom_permissions | difference(controller_custom_role_permissions) | length > 0)

- name: "Security check: read the controller's name-scoped role permissions"
  delegate_to: localhost
  register: controller_scoped_role
  changed_when: false
  ansible.builtin.command: >-
    gcloud iam roles describe {{ controller_scoped_role_id }}
    --project={{ project }}
    --format=value(includedPermissions)

- name: "Security check: parse the controller's name-scoped role permissions"
  ansible.builtin.set_fact:
    controller_scoped_role_permissions: "{{ controller_scoped_role.stdout.split(';') }}"

- name: "Security check: fail if the controller's name-scoped role does not exactly match the expected permission allowlist"
  ansible.builtin.fail:
    msg: >-
      Controller name-scoped role {{ controller_scoped_role_id }} does
      not match the expected permission allowlist. Extra permissions:
      {{ controller_scoped_role_permissions | difference(expected_controller_scoped_permissions) }}.
      Missing permissions:
      {{ expected_controller_scoped_permissions | difference(controller_scoped_role_permissions) }}.
  when: >-
    (controller_scoped_role_permissions | difference(expected_controller_scoped_permissions) | length > 0) or
    (expected_controller_scoped_permissions | difference(controller_scoped_role_permissions) | length > 0)

- name: "Security check: read the controller's name-scoped role binding condition"
  delegate_to: localhost
  register: controller_scoped_binding
  changed_when: false
  ansible.builtin.command: >-
    gcloud projects get-iam-policy {{ project }}
    --flatten=bindings[]
    --filter=bindings.role=projects/{{ project }}/roles/{{ controller_scoped_role_id }}
    --format=json

# The condition matches instance names by prefix. A prefix that matches none
# of this cluster's VMs would make the grant useless or break node creation, so
# assert the expression names the cluster's real prefix: Slurm names every VM
# <slurm_cluster_name>-...
- name: "Security check: extract the name-scoped role binding's condition expressions"
  ansible.builtin.set_fact:
    controller_scoped_conditions: >-
      {{
        controller_scoped_binding.stdout | from_json
        | map(attribute='bindings.condition.expression', default='')
        | list
      }}

- name: "Security check: fail if the name-scoped role has no IAM condition covering this cluster's instance names"
  ansible.builtin.fail:
    msg: >-
      Controller's name-scoped role {{ controller_scoped_role_id }} is
      not bound with an IAM condition built from
      resource.name.extract("/instances/{{ slurm_cluster_name }}-{name}"), so
      it would apply to every instance in the project or to none of this
      cluster's VMs. Conditions seen: {{ controller_scoped_conditions }}
  when: >-
    (controller_scoped_conditions
      | select('search', '/instances/' ~ slurm_cluster_name ~ '-[{]name[}]')
      | list | length) == 0

- name: "Security check: fail if the scoped condition uses a function IAM Conditions does not support for resource.name"
  ansible.builtin.fail:
    msg: >-
      IAM Conditions supports only startsWith, endsWith, extract, == and != on
      resource.name; found {{ controller_scoped_conditions }}
  when: controller_scoped_conditions | select('search', '[.]matches[(]|[.]contains[(]') | list | length > 0

- name: "Security check: read the controller's custom role launch stage"
  delegate_to: localhost
  register: controller_custom_role_stage
  changed_when: false
  ansible.builtin.command: >-
    gcloud iam roles describe {{ controller_custom_role_id }}
    --project={{ project }}
    --format=value(stage)

- name: "Security check: fail if the controller's custom role is not at the expected launch stage"
  ansible.builtin.fail:
    msg: >-
      Controller custom role {{ controller_custom_role_id }} is at launch stage
      "{{ controller_custom_role_stage.stdout | trim }}", expected
      "{{ custom_vars.service_account_profiles.controller_role_stage | default('GA') }}"
      (custom_role_stage on the blueprint's controller service account).
  when: >-
    (controller_custom_role_stage.stdout | trim) !=
    (custom_vars.service_account_profiles.controller_role_stage | default('GA'))

- name: "Security check: read the other service accounts' granted project-level roles"
  delegate_to: localhost
  register: identity_roles
  changed_when: false
  loop: "{{ custom_vars.service_account_profiles.controller_actas_identities + custom_vars.service_account_profiles.no_actas_identities }}"
  loop_control:
    loop_var: identity
  ansible.builtin.command: >-
    gcloud projects get-iam-policy {{ project }}
    --flatten=bindings[].members
    --filter=bindings.members:serviceAccount:{{ deployment_name }}-{{ identity }}@{{ project }}.iam.gserviceaccount.com
    --format=value(bindings.role)

- name: "Security check: fail if another service account's roles are not exactly the expected baseline"
  ansible.builtin.fail:
    msg: >-
      {{ item.identity }} service account's project-level roles do not match the
      expected baseline. Unexpected:
      {{ item.stdout_lines | difference(expected_baseline_project_roles) }}.
      Missing:
      {{ expected_baseline_project_roles | difference(item.stdout_lines) }}.
      slurm-login and slurm-compute are empty profiles -- baseline
      logging/monitoring roles only, no custom role.
  loop: "{{ identity_roles.results }}"
  when: >-
    (item.stdout_lines | difference(expected_baseline_project_roles) | length > 0) or
    (expected_baseline_project_roles | difference(item.stdout_lines) | length > 0)

- name: "Security check: read each controller-attached service account's own IAM policy"
  delegate_to: localhost
  register: actas_sa_policies
  changed_when: false
  loop: "{{ custom_vars.service_account_profiles.controller_actas_identities }}"
  loop_control:
    loop_var: identity
  ansible.builtin.command: >-
    gcloud iam service-accounts get-iam-policy
    {{ deployment_name }}-{{ identity }}@{{ project }}.iam.gserviceaccount.com
    --format=json

# One per-identity fail task (rather than a single aggregate one) so a
# missing actAs grant on any one account names exactly which one in the
# failure message.
- name: "Security check: fail if the controller cannot actAs a service account it attaches to nodes"
  ansible.builtin.fail:
    msg: >-
      Expected roles/iam.serviceAccountUser on the {{ item.identity }}
      service account itself, granted to the controller service account, so
      the controller can attach it to new nodes without a project-wide grant.
  loop: "{{ actas_sa_policies.results }}"
  when: >-
    (item.stdout | from_json).bindings
    | default([])
    | selectattr('role', 'equalto', 'roles/iam.serviceAccountUser')
    | map(attribute='members')
    | flatten
    | select('equalto', controller_principal)
    | list
    | length == 0

- name: "Security check: read each non-attached service account's own IAM policy"
  delegate_to: localhost
  register: no_actas_sa_policies
  changed_when: false
  loop: "{{ custom_vars.service_account_profiles.no_actas_identities }}"
  loop_control:
    loop_var: identity
  ansible.builtin.command: >-
    gcloud iam service-accounts get-iam-policy
    {{ deployment_name }}-{{ identity }}@{{ project }}.iam.gserviceaccount.com
    --format=json

# The controller only attaches identities to VMs it creates itself. Login VMs
# are created by Terraform under the deploying principal, so an actAs grant on
# the login account would be an over-grant.
- name: "Security check: fail if the controller was granted actAs on a service account it never attaches"
  ansible.builtin.fail:
    msg: >-
      Controller service account has roles/iam.serviceAccountUser on the
      {{ item.identity }} service account. The controller never creates VMs
      under that identity -- Terraform does, under the deploying principal --
      so this grant is unnecessary.
  loop: "{{ no_actas_sa_policies.results }}"
  when: >-
    (item.stdout | from_json).bindings
    | default([])
    | selectattr('role', 'equalto', 'roles/iam.serviceAccountUser')
    | map(attribute='members')
    | flatten
    | select('equalto', controller_principal)
    | list
    | length > 0
