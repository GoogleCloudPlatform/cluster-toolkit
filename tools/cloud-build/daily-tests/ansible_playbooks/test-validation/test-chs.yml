---

- name: CHS Test Standard Suite
  delegate_to: "{{ 'localhost' if scheduler == 'gke' else inventory_hostname }}"
  vars:
    ansible_async_dir: "/tmp/.ansible_async_user"
    ansible_async_dir_root: "/tmp/.ansible_async_root"
    chs_bucket: "chs-results"
  block:
  - name: Ensure async directories exist
    block:
    - name: Ensure user async directory exists
      ansible.builtin.file:
        path: "{{ ansible_async_dir }}"
        state: directory
        mode: '0700'

    - name: Ensure root async directory exists
      ansible.builtin.file:
        path: "{{ ansible_async_dir_root }}"
        state: directory
        mode: '0700'
      become: true

  - name: Setup environment for CHS
    become: true
    vars:
      ansible_async_dir: "{{ ansible_async_dir_root }}"
    block:
    - name: Set variables for CHS setup
      ansible.builtin.set_fact:
        chs_venv_path: "/opt/chs_venv"

    - name: Create Python Virtual Environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ chs_venv_path }}"
        creates: "{{ chs_venv_path }}/bin/python"
      async: 120
      poll: 10

  - name: Install and Setup CHS
    block:
    - name: Create temporary directory for CHS clone
      ansible.builtin.tempfile:
        state: directory
        suffix: chs_clone
      register: chs_temp_dir

    - name: Get GCP access token for Git authentication
      ansible.builtin.command: gcloud auth print-access-token
      register: gcp_access_token
      changed_when: false
      no_log: true

    - name: Clone CHS repository
      ansible.builtin.git:
        repo: "{{ chs_repo }}"
        dest: "{{ chs_temp_dir.path }}"
        version: "{{ chs_version | default('release') }}"
        refspec: "{{ chs_refspec | default(('+refs/changes/*:refs/changes/*' if (chs_version | default('') is search('refs/changes/')) else omit)) }}"
        accept_hostkey: true
      environment:
        GIT_HTTP_EXTRAHEADER: "Authorization: Bearer {{ gcp_access_token.stdout | trim }}"
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: "http.https://cluster-toolkit.googlesource.com.extraHeader"
        GIT_CONFIG_VALUE_0: "Authorization: Bearer {{ gcp_access_token.stdout | trim }}"
      no_log: true
      async: 120
      poll: 10

    - name: Install CHS into venv
      ansible.builtin.pip:
        name: "{{ chs_temp_dir.path }}"
        virtualenv: "{{ chs_venv_path }}"
      async: 300
      poll: 10
      become: true
      vars:
        ansible_async_dir: "{{ ansible_async_dir_root }}"

  - name: Perform CHS Operations
    environment:
      PATH: "{{ chs_venv_path }}/bin:{{ lookup('env', 'PATH') }}"
    block:
    - name: Configure bucket for CHS
      ansible.builtin.shell: |
        set -e -u
        chs configure storage gcs {{ chs_bucket }}
      async: 120
      poll: 10
      changed_when: false

    - name: "Run CHS suite"
      ansible.builtin.shell: |
        set -e -u
        chs run -y --suite {{ chs_suite | default((chs_suites | first) if chs_suites is defined else 'standard') }} {{ chs_target }}
      register: chs_run
      async: 3000
      poll: 10
      changed_when: false
      vars:
        target_flag: "{{ '--nodepools' if scheduler == 'gke' else ('--partitions' if scheduler == 'slurm' else '') }}"
        target_val: "{{ (chs_nodepools if scheduler == 'gke' else (chs_partitions if scheduler == 'slurm' else '')) | default('') }}"
        chs_target: "{{ target_flag + ' ' + target_val if (target_flag and target_val) else '' }}"

    - name: CHS run output
      ansible.builtin.debug:
        msg: "{{ chs_run.stdout }}"

    # `chs run` exits 0 even when health checks fail; the verdict lives in the
    # Bill of Health (BoH) that CHS uploads to
    # gs://<bucket>/bills_of_health/<timestamp>_<run_id>.json (report_id).
    - name: Extract CHS run ID
      ansible.builtin.set_fact:
        chs_run_id: "{{ (chs_run.stdout | regex_search('Run ID:\\s+(\\S+)', '\\1') | default([])) | first | default('') }}"

    - name: Assert a run ID was found
      ansible.builtin.assert:
        that: chs_run_id | length > 0
        fail_msg: "Could not determine CHS run ID from `chs run` output: {{ chs_run.stdout }}"

    - name: Download CHS Bill of Health by report ID
      ansible.builtin.shell: |
        set -e -u
        gcloud storage cp "gs://{{ chs_bucket }}/bills_of_health/*_{{ chs_run_id }}.json" "{{ chs_temp_dir.path }}/boh_{{ chs_run_id }}.json"
      changed_when: false

    - name: Validate CHS Bill of Health
      ansible.builtin.script: "{{ playbook_dir }}/../validate_chs_boh.py --bucket {{ chs_bucket }} {{ chs_temp_dir.path }}/boh_{{ chs_run_id }}.json"
      register: chs_boh_validation
      failed_when: false
      changed_when: false

    - name: CHS Bill of Health summary
      ansible.builtin.debug:
        msg: "{{ chs_boh_validation.stdout }}"

    - name: Fail on CHS Bill of Health non-success results
      ansible.builtin.fail:
        msg: "CHS reported non-success results for run: {{ chs_run_id }}"
      when: chs_boh_validation.rc != 0

  rescue:
  - name: CHS Test Failure
    ansible.builtin.debug:
      msg: "CHS tests failed or timed out. Continuing playbook execution."
    ignore_errors: true

  always:
  - name: Cleanup Kubernetes resources
    delegate_to: localhost
    ansible.builtin.shell: |
      kubectl delete jobset --all --ignore-not-found
      kubectl delete job --all --ignore-not-found
      kubectl delete pod --all --ignore-not-found
    async: 300
    poll: 10
    ignore_errors: true
    when: scheduler == 'gke'

  - name: Cleanup Slurm resources
    ansible.builtin.shell: |
      scancel -u $(whoami)
    async: 300
    poll: 10
    when: scheduler == 'slurm'
    ignore_errors: true

  - name: Cleanup temporary directory
    ansible.builtin.file:
      path: "{{ chs_temp_dir.path }}"
      state: absent
    become: true
    ignore_errors: true
    when: chs_temp_dir.path is defined
