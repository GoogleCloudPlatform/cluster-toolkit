---
- name: Assert TPU Slurm test variables are defined
  ansible.builtin.assert:
    that:
    - custom_vars.tpu_partition is defined
    - custom_vars.tpu_dyn_partition is defined
    - custom_vars.tpu_type is defined
    - custom_vars.tpu_topology is defined
    - custom_vars.expected_tpu_chips is defined
    - custom_vars.expected_tpu_cores is defined

- name: Verify Slurm TPU plugins and GRES in scontrol show config
  ansible.builtin.shell: |
    set -e
    scontrol show config | grep -E "GresTypes\s*=.*tpu"
    scontrol show config | grep -E "JobSubmitPlugins\s*=.*tpu"
    scontrol show config | grep -E "CliFilterPlugins\s*=.*tpu"
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify Static TPU partition (tpu-block-topo, PowerDownOnIdle=NO)
  ansible.builtin.shell: |
    set -e
    scontrol show partition {{ custom_vars.tpu_partition }} | grep -E "Exclusive=NODE|OverSubscribe=EXCLUSIVE"
    scontrol show partition {{ custom_vars.tpu_partition }} | grep -E "Topology=tpu-block-topo"
    scontrol show partition {{ custom_vars.tpu_partition }} | grep -E "PowerDownOnIdle=NO"
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify Dynamic TPU partition (topology/tree, PowerDownOnIdle=YES)
  ansible.builtin.shell: |
    set -e
    scontrol show partition {{ custom_vars.tpu_dyn_partition }} | grep -E "Exclusive=NODE|OverSubscribe=EXCLUSIVE"
    scontrol show partition {{ custom_vars.tpu_dyn_partition }} | grep -E "PowerDownOnIdle=YES"
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify Static and Dynamic TPU node GRES and Features in scontrol show node
  ansible.builtin.shell: |
    set -e
    scontrol show node | grep -E "Gres=tpu:{{ custom_vars.tpu_type }}:{{ custom_vars.expected_tpu_chips }}"
    scontrol show node | grep -E "AvailableFeatures=.*{{ custom_vars.tpu_type }}_{{ custom_vars.tpu_topology }}"
    scontrol show node | grep -E "AvailableFeatures=.*tpu_dynamic"
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify srun on Static TPU partition (cgroup ConstrainDevices=no and VFIO devices)
  ansible.builtin.command: >
    srun -N {{ custom_vars.num_slurm_nodes | default(1) }}
    -p {{ custom_vars.tpu_partition }}
    --gres=tpu:{{ custom_vars.tpu_type }}:{{ custom_vars.expected_tpu_chips }}
    --layout={{ custom_vars.tpu_type }}={{ custom_vars.tpu_topology }}
    bash -c '
    set -e
    grep -q "^ConstrainDevices=no" /usr/local/etc/slurm/cgroup.conf
    VFIO_COUNT=$(ls -1 /dev/vfio/devices/vfio* | wc -l)
    echo "Static partition $(hostname): Found ${VFIO_COUNT} VFIO TPU devices"
    test "${VFIO_COUNT}" -eq {{ custom_vars.expected_tpu_cores }}
    '
  register: srun_static_result
  failed_when: srun_static_result.rc != 0

