- name: Install shared JAX TPU virtualenv on /home
  ansible.builtin.shell: |
    set -e
    python3 -m venv ~/jax-env
    ~/jax-env/bin/pip install -q -U pip "jax[tpu]" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
  args:
    executable: /bin/bash

- name: Create sbatch test script for TPU batch job verification
  ansible.builtin.copy:
    dest: /tmp/test_tpu_sbatch.sh
    mode: "0755"
    content: |
      #!/bin/bash
      #SBATCH --job-name=tpu7x-sbatch-test
      #SBATCH --partition={{ custom_vars.tpu_partition }}
      #SBATCH --nodes={{ custom_vars.num_slurm_nodes | default(1) }}
      #SBATCH --gres=tpu:{{ custom_vars.tpu_type }}:{{ custom_vars.expected_tpu_chips }}
      #SBATCH --layout={{ custom_vars.tpu_type }}={{ custom_vars.tpu_topology }}
      #SBATCH --output=%x_%j.out
      #SBATCH --error=%x_%j.err
      set -e

      echo "Running on node: $(hostname), Job ID: ${SLURM_JOB_ID}"
      ~/jax-env/bin/python3 -c "
      import jax

      want_cores = {{ custom_vars.expected_tpu_cores }}
      got_cores = jax.device_count('tpu')
      local_cores = jax.local_device_count('tpu')
      print(f'global TPU cores: {got_cores}, local TPU cores: {local_cores}')
      assert got_cores == want_cores, f'Expected {want_cores} TPU cores, got {got_cores}'

      xs = jax.numpy.ones(local_cores)
      r = jax.pmap(lambda x: jax.lax.psum(x, 'i'), axis_name='i')(xs)
      print('pmap psum result:', r)
      assert jax.numpy.allclose(r, jax.numpy.full(local_cores, float(got_cores)))
      "
      echo "TPU_SBATCH_SUCCESS"

- name: Submit and wait for sbatch TPU job to complete
  ansible.builtin.command: sbatch --parsable --wait /tmp/test_tpu_sbatch.sh
  register: sbatch_job
  failed_when: sbatch_job.rc != 0
  retries: 2
  delay: 30

- name: Verify sbatch job output on shared /home filesystem
  ansible.builtin.command: "cat tpu7x-sbatch-test_{{ sbatch_job.stdout | trim }}.out"
  register: sbatch_output
  failed_when: "'TPU_SBATCH_SUCCESS' not in sbatch_output.stdout"

- name: Print sbatch JAX TPU output
  ansible.builtin.debug:
    msg: "{{ sbatch_output.stdout_lines }}"
