---

- name: Assert variables are defined
  ansible.builtin.assert:
    that:
    - region is defined
    - custom_vars.project is defined
    - custom_vars.gcs_bucket is defined
    - custom_vars.tpu_type is defined
    - custom_vars.num_slices is defined

- name: Get cluster credentials for GCluster SPS operations
  delegate_to: localhost
  ansible.builtin.command: gcloud container clusters get-credentials {{ deployment_name }} --region {{ region }} --project {{ custom_vars.project }} --verbosity=debug

- name: Set SPS test local facts
  ansible.builtin.set_fact:
    sps_job_name: "sps-{{ build | default('test') }}"
    sps_dry_run_file: "/tmp/{{ deployment_name }}-sps-dry-run.yaml"

- name: Check if ML Diagnostics GCS bucket exists
  delegate_to: localhost
  ansible.builtin.command: gcloud storage buckets describe gs://{{ custom_vars.gcs_bucket }} --project {{ custom_vars.project }}
  register: bucket_check
  failed_when: false
  changed_when: false

- name: Create ML Diagnostics GCS bucket
  delegate_to: localhost
  ansible.builtin.command: gcloud storage buckets create gs://{{ custom_vars.gcs_bucket }} --project {{ custom_vars.project }} --location {{ region | default('us-central1') }}
  when: bucket_check.rc != 0

- name: Configure Docker authentication for GCR registry checks
  delegate_to: localhost
  ansible.builtin.command: gcloud auth configure-docker gcr.io --quiet
  changed_when: false

- name: Configure Docker authentication for regional Artifact Registry checks
  delegate_to: localhost
  ansible.builtin.command: gcloud auth configure-docker {{ region }}-docker.pkg.dev --quiet
  changed_when: false

# ==========================================
# WORKFLOW 1: SPS Instance Dry-Run Validation (--pathways-deploy-sps)
# ==========================================

- name: Build GCluster SPS Deploy Dry-Run command arguments
  ansible.builtin.set_fact:
    sps_dry_run_argv:
    - "{{ workspace }}/gcluster"
    - job
    - submit
    - --pathways
    - --pathways-deploy-sps
    - --name
    - "{{ sps_job_name }}"
    - --num-slices
    - "{{ custom_vars.num_slices | string }}"
    - --compute-type
    - "{{ custom_vars.tpu_type }}"
    - --project
    - "{{ custom_vars.project }}"
    - --location
    - "{{ region }}"
    - --cluster
    - "{{ deployment_name }}"
    - --service-account
    - "{{ custom_vars.k8s_service_account }}"
    - --pathways-gcs-location
    - "gs://{{ custom_vars.gcs_bucket }}/sps-tests-{{ deployment_name }}"
    - --pathways-server-env
    - TEST_SERVER_VAR=server_val
    - --pathways-worker-env
    - TEST_WORKER_VAR=worker_val
    - --dry-run-out
    - "{{ sps_dry_run_file }}"

- name: Execute GCluster SPS Deploy Dry-Run
  delegate_to: localhost
  ansible.builtin.command:
    argv: "{{ sps_dry_run_argv }}"
  changed_when: false

- name: Read generated SPS Dry-Run manifest
  delegate_to: localhost
  ansible.builtin.slurp:
    src: "{{ sps_dry_run_file }}"
  register: sps_dry_run_content

- name: Parse SPS Dry-Run manifest content
  ansible.builtin.set_fact:
    sps_dry_run_yaml: "{{ sps_dry_run_content.content | b64decode | from_yaml }}"

- name: Validate SPS instance dry-run manifest structure and defaults
  ansible.builtin.assert:
    that:
    - sps_dry_run_yaml.kind == "JobSet"
    - sps_dry_run_yaml.spec.failurePolicy.maxRestarts == 30
    - >
      sps_dry_run_yaml.spec.replicatedJobs
      | selectattr('name', 'equalto', 'pathways-head') | map(attribute='template.spec.template.spec.containers') | flatten
      | selectattr('name', 'equalto', 'pathways-rm') | map(attribute='env') | flatten
      | selectattr('name', 'equalto', 'TEST_SERVER_VAR') | selectattr('value', 'equalto', 'server_val') | list | length > 0
    - >
      sps_dry_run_yaml.spec.replicatedJobs
      | selectattr('name', 'equalto', 'pathways-head') | map(attribute='template.spec.template.spec.containers') | flatten
      | selectattr('name', 'in', ['pathways-proxy', 'workload-container']) | list | length == 0
    - >
      sps_dry_run_yaml.spec.replicatedJobs
      | selectattr('name', 'equalto', 'worker') | map(attribute='template.spec.template.spec.containers') | flatten
      | selectattr('name', 'equalto', 'pathways-worker') | map(attribute='env') | flatten
      | selectattr('name', 'equalto', 'TEST_WORKER_VAR') | selectattr('value', 'equalto', 'worker_val') | list | length > 0
    - >
      (sps_dry_run_yaml.spec.replicatedJobs
      | selectattr('name', 'equalto', 'worker') | map(attribute='template.spec') | first).backoffLimitPerIndex == 1000000
    fail_msg: "SPS instance dry-run manifest did not match expected --pathways-deploy-sps specification"

# ==========================================
# WORKFLOW 2: Deploy SPS Instance (--pathways-deploy-sps) and Inspect (--filter pathways-sps)
# ==========================================

- name: Build GCluster SPS Deploy command arguments
  ansible.builtin.set_fact:
    sps_submit_argv:
    - "{{ workspace }}/gcluster"
    - job
    - submit
    - --pathways
    - --pathways-deploy-sps
    - --name
    - "{{ sps_job_name }}"
    - --num-slices
    - "{{ custom_vars.num_slices | string }}"
    - --compute-type
    - "{{ custom_vars.tpu_type }}"
    - --project
    - "{{ custom_vars.project }}"
    - --location
    - "{{ region }}"
    - --cluster
    - "{{ deployment_name }}"
    - --service-account
    - "{{ custom_vars.k8s_service_account }}"
    - --pathways-gcs-location
    - "gs://{{ custom_vars.gcs_bucket }}/sps-tests-{{ deployment_name }}"

- name: Deploy the SPS instance to GKE
  delegate_to: localhost
  ansible.builtin.command:
    argv: "{{ sps_submit_argv }}"
  changed_when: false

- name: Block to verify SPS readiness and inspect --filter pathways-sps
  block:
  - name: Wait for SPS JobSet resource creation
    delegate_to: localhost
    ansible.builtin.command: kubectl get jobset "{{ sps_job_name }}"
    register: sps_jobset_check
    until: sps_jobset_check.rc == 0
    retries: 12
    delay: 5
    changed_when: false

  - name: Wait for SPS pathways-head and worker pods to reach Ready state
    delegate_to: localhost
    ansible.builtin.command: >
      kubectl wait --for=condition=Ready pod
      -l jobset.sigs.k8s.io/jobset-name={{ sps_job_name }}
      --timeout=600s
    register: sps_pods_ready
    until: sps_pods_ready.rc == 0
    retries: 20
    delay: 5
    changed_when: false

  - name: Wait for SPS Resource Manager to log slice readiness
    delegate_to: localhost
    ansible.builtin.shell: |
      set -eo pipefail
      HEAD_POD=$(kubectl get pod -l jobset.sigs.k8s.io/jobset-name={{ sps_job_name }},jobset.sigs.k8s.io/replicatedjob-name=pathways-head -o jsonpath='{.items[0].metadata.name}')
      kubectl logs "${HEAD_POD}" -c pathways-rm | grep -E "[0-9]+/[0-9]+ Pathways Slices Now Ready"
    args:
      executable: /bin/bash
    register: sps_rm_ready
    until: sps_rm_ready.rc == 0
    retries: 36
    delay: 5
    changed_when: false

  - name: Inspect SPS instance with --filter pathways-sps
    delegate_to: localhost
    ansible.builtin.command: >
      {{ workspace }}/gcluster job inspect
      --filter pathways-sps
      --name "{{ sps_job_name }}"
      --show
      --cluster {{ deployment_name }}
      --location {{ region }}
      --project {{ custom_vars.project }}
    register: sps_inspect_output
    changed_when: false

  - name: Assert SPS inspect summary reports Running status and ready slices
    ansible.builtin.assert:
      that:
      - sps_job_name in sps_inspect_output.stdout
      - sps_inspect_output.stdout is search("Status:\\s+Running")
      - (sps_job_name ~ "-pathways-head-0-0." ~ sps_job_name ~ ":29001") in sps_inspect_output.stdout
      - sps_inspect_output.stdout is search("Slices:.*ready")
      fail_msg: "SPS inspect output did not match expected summary: {{ sps_inspect_output.stdout }}"

  rescue:
  - name: "FAILURE: SPS test failed. Gathering GCluster SPS diagnostic inspection."
    ansible.builtin.debug:
      msg: "SPS deployment or inspection failed. Commencing diagnostics."

  - name: Run GCluster SPS inspection on failure
    delegate_to: localhost
    ansible.builtin.command: >
      {{ workspace }}/gcluster job inspect
      --filter pathways-sps
      --name "{{ sps_job_name }}"
      --show
      --cluster {{ deployment_name }}
      --location {{ region }}
      --project {{ custom_vars.project }}
    register: sps_failure_inspect
    changed_when: false
    ignore_errors: true

  - name: Print GCluster SPS inspection report on failure
    ansible.builtin.debug:
      msg: "{{ sps_failure_inspect.stdout_lines | default('No SPS diagnostic report generated') }}"

  - name: Run GCluster full cluster inspection on failure
    delegate_to: localhost
    ansible.builtin.command: >
      {{ workspace }}/gcluster job inspect
      --name "{{ sps_job_name }}"
      --show
      --cluster {{ deployment_name }}
      --location {{ region }}
      --project {{ custom_vars.project }}
    register: sps_full_inspect
    changed_when: false
    ignore_errors: true

  - name: Print GCluster full inspection report on failure
    ansible.builtin.debug:
      msg: "{{ sps_full_inspect.stdout_lines | default('No full diagnostic report generated') }}"

  - name: Force failure of Ansible run
    ansible.builtin.fail:
      msg: "Integration test failed to verify GCluster Shared Pathways Service (SPS) workflow."

  always:
  - name: Clean up SPS instance
    delegate_to: localhost
    ansible.builtin.command: >
      {{ workspace }}/gcluster job cancel "{{ sps_job_name }}"
      --cluster {{ deployment_name }}
      --location {{ region }}
      --project {{ custom_vars.project }}
    ignore_errors: true
