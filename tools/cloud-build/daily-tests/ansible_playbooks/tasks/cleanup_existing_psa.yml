---
- name: Check for existing PSA address
  register: existing_psa_addr
  changed_when: false
  failed_when: false
  ansible.builtin.command: >-
    gcloud compute addresses list
    --project={{ project }}
    --global
    --filter="network=projects/{{ project }}/global/networks/{{ network }}"
    --format="value(name)"
  when: network is defined and network != "" and project is defined

- name: Clean up existing PSA Peering
  register: psa_deleted
  changed_when: psa_deleted.rc == 0
  failed_when: false
  ansible.builtin.command: >-
    gcloud services vpc-peerings delete
    --service=servicenetworking.googleapis.com
    --network={{ network }}
    --project={{ project }}
    --quiet
  when: >-
    network is defined and network != "" and project is defined and
    existing_psa_addr.rc is defined and existing_psa_addr.rc == 0 and
    existing_psa_addr.stdout is defined and existing_psa_addr.stdout != ""

- name: Clean up existing PSA Address
  register: addr_deleted
  changed_when: addr_deleted.rc == 0
  failed_when: false
  ansible.builtin.command: >-
    gcloud compute addresses delete {{ item }}
    --project={{ project }}
    --global
    --quiet
  loop: "{{ existing_psa_addr.stdout_lines | default([]) }}"
  when: >-
    project is defined and
    existing_psa_addr.rc is defined and existing_psa_addr.rc == 0 and
    existing_psa_addr.stdout is defined and existing_psa_addr.stdout != ""
