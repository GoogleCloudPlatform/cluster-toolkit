---
test_name: agentgateway
workspace: /workspace
blueprint_yaml: "{{ workspace }}/community/examples/agentgateway-gke/agentgateway-gke.yaml"
region: us-central1
agentgateway_namespace: agentgateway-system
vertex_model: gemini-2.5-flash
create_service_accounts: true
node_service_account_email: ""
proxy_service_account_email: ""

# Optional real-provider tests. The setup task file creates the referenced
# Secrets in agentgateway_namespace after the initial deployment.
external_provider_setup_tasks: ""
external_provider_tests: []
# Example entry (no credentials here):
# - provider: openai
#   model: YOUR_OPENAI_MODEL_ID
#   secret_name: openai-secret
#   token_parameter: max_completion_tokens
#   max_output_tokens: 2048
