---

test_name: hpc-slurm-service-account-profiles
deployment_name: "lpsa-{{ build }}"
# schedmd-slurm-gcp-v6-controller derives the Slurm cluster name from
# deployment_name (main.tf:25): lowercased, everything but [a-z0-9] stripped,
# truncated to 10 characters. "lpsa-<6-char build>" therefore becomes
# "lpsa<6-char build>", and node names are built from that, not from
# deployment_name or test_name.
slurm_cluster_name: "lpsa{{ build[0:6] }}"
zone: us-central1-a
cli_deployment_vars:
  network_name: "{{ network }}"
  region: us-central1
  zone: "{{ zone }}"
  # Exercise a non-default custom_role_stage end to end: the srun check below
  # then also proves a BETA-stage controller role still grants its permissions.
  controller_role_stage: BETA
workspace: /workspace
blueprint_yaml: "{{ workspace }}/community/examples/hpc-slurm-service-account-profiles.yaml"
network: "{{ test_name }}-net"

# Note: Pattern matching in gcloud only supports 1 wildcard.
login_node: "{{ slurm_cluster_name }}-slurm-login-*"
controller_node: "{{ slurm_cluster_name }}-controller"
post_deploy_tests:
- test-validation/test-service-account-profiles.yml
custom_vars:
  # debug2 is deployed (second compute identity/nodeset -- see
  # community/examples/hpc-slurm-service-account-profiles.yaml) but not exercised by
  # the srun functional check, which only uses partitions[0]; its compute
  # service account's IAM is still checked by
  # test-validation/test-service-account-profiles.yml.
  partitions:
  - debug
  - debug2
  # See test-validation/test-service-account-profiles.yml for what each key means.
  service_account_profiles:
    # enable_placement_policies: true on controller_sa in the blueprint.
    extra_controller_permissions:
    - compute.resourcePolicies.create
    - compute.resourcePolicies.use
    controller_actas_identities:
    - compute
    - compute2
    no_actas_identities:
    - login
    controller_role_stage: BETA
