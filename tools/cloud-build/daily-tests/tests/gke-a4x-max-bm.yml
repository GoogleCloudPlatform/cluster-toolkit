---
test_name: a4x-max
deployment_name: a4x-max-{{ build }}
workspace: /workspace
blueprint_yaml: "{{ workspace }}/examples/gke-a4x-max-bm/gke-a4x-max-bm.yaml"
region: us-central1
zone: us-central1-b
network: "{{ deployment_name }}-net-0"
remote_node: "{{ deployment_name }}-remote-node-0"
extended_reservation: PLACEHOLDER_RESERVATION_ID # Input actual reservation id once capacity is secured
static_node_count: 2
num_node_pools: 1
instance_type: a4x-max
scheduler: "gke"
chs_nodepools: "a4x-maxgpu-4g-metal-a4x-max-pool"
accelerator_type: nvidia-gb300
num_gpus: 8
k8s_service_account_name: workload-identity-k8s-sa
cli_deployment_vars:
  region: "{{ region }}"
  zone: "{{ zone }}"
  static_node_count: "{{ static_node_count }}"
  reservation: "{{ extended_reservation }}"
  authorized_cidr: "{{ build_ip.stdout }}/32"
  gcp_public_cidrs_access_enabled: true
  k8s_service_account_name: "{{ k8s_service_account_name}}"
  num_node_pools: "{{ num_node_pools }}"
custom_vars:
  project: "{{ project }}"
post_deploy_tests:
- test-validation/test-gcsfuse-mounts.yml
- test-validation/test-gke-job.yml
- test-validation/test-gke-a4x-max-bm.yml
- test-validation/test-gke-a4x-max-bm-kueue-config.yml
- test-validation/test-chs.yml
