---
test_name: gke-tpu-v5p
deployment_name: gke-tpu-v5p-{{ build }}
workspace: /workspace
blueprint_yaml: "{{ workspace }}/examples/gke-tpu-v5p/gke-tpu-v5p.yaml"
network: "{{ deployment_name }}-net"
remote_node: "{{ deployment_name }}-remote-node-0"
machine_type: ct5p-hightpu-4t
num_slices: 1
tpu_topology: 2x2x1
cli_deployment_vars:
  region: "{{ region }}"
  zone: "{{ zone }}"
  num_slices: "{{ num_slices }}"
  machine_type: "{{ machine_type }}"
  tpu_topology: "{{ tpu_topology }}"
  authorized_cidr: "{{ build_ip.stdout }}/32"
custom_vars:
  project: "{{ project }}"
  expected_tpu_count: 4
  gcs_bucket: "ml-diagnostics-test"
  image_tag: "us-central1-docker.pkg.dev/hpc-toolkit-dev/ml-diagnostics-test/sample-diagnostics-job:1.0.0"
  tpu_accelerator: tpu-v5p-slice
  tpu_topology: 2x2x1
  k8s_service_account: workload-identity-k8s-sa
  jobset_name: sample-tpu-jobset
  tpu_type: v5p-8
  num_slices: 1
  workload_image: "us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest"
  workload_command: >-
    pip install pathwaysutils && python -c 'import pathwaysutils; pathwaysutils.initialize(); import jax; dc = jax.device_count(); print("JAX Device count:", dc); assert dc == 4, f"Expected 4 devices, got {dc}"; a = jax.random.normal(jax.random.PRNGKey(0), (2, 2)); print("JAX TPU Result:", a)'
  expected_log_output: "JAX TPU Result:"
instance_type: "tpuv5p"
scheduler: "gke"
post_deploy_tests:
- test-validation/test-gcluster-job-pathways.yml
