---
test_name: tpu-v5p-onspot-slurm
deployment_name: "tpu-v5p-slurm-{{ build }}"
slurm_cluster_name: "v5psl{{ build[0:5] }}"
workspace: /workspace
blueprint_yaml: "{{ workspace }}/examples/machine-learning/tpu-v5e-v5p-v6e/tpu-slurm-blueprint.yaml"
login_node: "{{ slurm_cluster_name }}-slurm-login-*"
controller_node: "{{ slurm_cluster_name }}-controller"
network: "{{ test_name }}-0"
scheduler: "slurm"
instance_type: "ct5p"
post_deploy_tests:
- test-validation/test-mounts.yml
- test-validation/test-default-partition.yml
- test-validation/test-tpu-slurm.yml
custom_vars:
  gpu_partition: tpu
  tpu_partition: tpu
  tpu_dyn_partition: tpu-dyn
  tpu_type: v5p
  tpu_topology: 2x2x1
  num_slurm_nodes: 1
  expected_tpu_chips: 4
  expected_tpu_cores: 4
  partitions:
  - tpu
  mounts:
  - /home
  instance_labels:
    tpu_v5p_onspot: true
  enable_spot: true
cli_deployment_vars:
  test_name: "{{ test_name }}"
  region: "{{ region }}"
  zone: "{{ zone }}"
  slurm_cluster_name: "{{ slurm_cluster_name }}"
  tpu_machine_type: ct5p-hightpu-4t
  tpu_static_nodes: 1
  tpu_dynamic_max_nodes: 1
  tpu_enable_spot_vm: true
