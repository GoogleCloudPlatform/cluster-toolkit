---

test_name: cloudsql-database
deployment_name: "csdb-{{ build }}"
zone: us-central1-a
workspace: /workspace
blueprint_yaml: "{{ workspace }}/tools/cloud-build/daily-tests/blueprints/cloudsql-database.yaml"
# The vpc module's default name, so the playbook's Private Service Access
# cleanup targets this deployment's own network.
network: "{{ deployment_name }}-net"
remote_node: "{{ deployment_name }}-client-0"
post_deploy_tests:
- test-validation/test-cloudsql.yml
custom_vars:
  deployment_group: primary
cli_deployment_vars:
  region: us-central1
  zone: "{{ zone }}"
  # Unique per attempt: a requeued attempt reuses the deployment name, and
  # Cloud SQL keeps a deleted instance's name reserved for up to a week.
  mysql_name_suffix: "{{ now(utc=True).strftime('%y%m%d%H%M%S') }}"
