---

test_name: slurm6-tpu
deployment_name: "v6-tpu-{{ build }}"
# Manually adding the slurm_cluster_name for use in node names, which filters
# non-alphanumeric chars and is capped at 10 chars.
slurm_cluster_name: "v6tpu{{ build[0:5] }}"

cli_deployment_vars:
   region: "{{ region }}"
   zone: "{{ zone }}"

workspace: /workspace
blueprint_yaml: "{{ workspace }}/community/examples/hpc-slurm6-tpu.yaml"
network: "{{ deployment_name }}-net"
# Note: Pattern matching in gcloud only supports 1 wildcard, a*-login-* won't work.
login_node: "{{ slurm_cluster_name }}-slurm-login-*"
controller_node: "{{ slurm_cluster_name }}-controller"
post_deploy_tests:
- test-slurm-v6-tpu.yml
- test-validation/test-service-account-profiles.yml
custom_vars:
   partitions:
   - tpu
   # community/examples/hpc-slurm6-tpu.yaml uses community/modules/iam/service-account-profiles
   # for its identities; see test-validation/test-service-account-profiles.yml.
   service_account_profiles:
      # enable_tpu: true on controller_sa in the blueprint.
      extra_controller_permissions:
      - tpu.acceleratortypes.get
      - tpu.nodes.create
      - tpu.nodes.delete
      - tpu.nodes.get
      - tpu.nodes.list
      - tpu.nodes.start
      - tpu.nodes.stop
      - tpu.operations.get
      - tpu.runtimeversions.get
      controller_actas_identities:
      - tpu
      no_actas_identities:
      - login
      # test-slurm-v6-tpu.yml's JAX job already forces a TPU node resume under
      # these identities, with retries for TPU capacity; a second, unretried
      # srun here would only add flakiness.
      srun_check: false
