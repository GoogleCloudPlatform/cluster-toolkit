---
# region, zone, and enable_spot are provided via --extra-vars in builds/ml-gke-e2e.yaml
test_name: ml-gke-e2e
deployment_name: ml-gke-e2e-{{ build }}
workspace: /workspace
blueprint_yaml: "{{ workspace }}/tools/cloud-build/daily-tests/blueprints/ml-gke-e2e.yaml"
network: "{{ deployment_name }}-net"
remote_node: "{{ deployment_name }}-0"
cli_deployment_vars:
  region: "{{ region }}"
  zones: "[{{ zone }}]"
  gcp_public_cidrs_access_enabled: true
  enable_ray_operator: true
  compute_spot: "{{ enable_spot | default(false) | bool }}"
custom_vars:
  project: "{{ project }}"
  enable_spot: "{{ enable_spot | default(false) | bool }}"
  instance_labels:
    ml_gke_e2e_spot: "true"
post_deploy_tests:
- test-validation/test-ml-gke-e2e-validation.yml
- test-validation/test-gke-ray.yml
