---
test_name: storage-gke
deployment_name: gke-storage-{{ build }}
region: us-central1
zone: us-central1-b  # for remote node
workspace: /workspace
blueprint_yaml: "{{ workspace }}/examples/storage-gke.yaml"
network: "{{ test_name }}-net"
remote_node: "{{ deployment_name }}-0"
post_deploy_tests:
- test-validation/test-zonal-bucket.yml
- test-validation/test-anywhere-cache.yml
- test-validation/test-gke-mtc.yml
- test-validation/test-gke-storage-pool.yml
cli_deployment_vars:
  test_name: "{{ test_name }}"
  region: "{{ region }}"
  zone: "{{ zone }}"
  authorized_cidr: "{{ build_ip.stdout }}/32"
  gcp_public_cidrs_access_enabled: true
  project_id: "{{ project }}"
  hyperdisk_balanced_storage_pool: "projects/{{ project }}/zones/us-central1-b/storagePools/{{ hyperdisk_balanced_pool }}"
  hyperdisk_throughput_storage_pool: "projects/{{ project }}/zones/us-central1-b/storagePools/{{ hyperdisk_throughput_pool }}"
custom_vars:
  project: "{{ project }}"
