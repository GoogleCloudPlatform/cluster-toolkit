apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kueue-reaper-role
  namespace: default
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kueue-reaper-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: kueue-reaper-ksa
  namespace: default
roleRef:
  kind: Role
  name: kueue-reaper-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kueue-reaper-script
  namespace: default
data:
  reaper.sh: |
    #!/bin/bash
    echo "Starting Centralized K8s Reaper Pod..."
    echo "This pod monitors active jobs and cancels them if their Cloud Build is CANCELLED."

    # Explicitly configure the project to prevent silent gcloud failures
    PROJECT_ID=$(curl -s -m 5 -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/project/project-id)
    if [ -n "$PROJECT_ID" ]; then
      gcloud config set project "$PROJECT_ID" 2>/dev/null
    fi

    while true; do
      # Fetch all jobs, checking their Complete and Failed conditions
      kubectl get jobs -l build-id -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.labels.build-id}{"|"}{.status.conditions[?(@.type=="Complete")].status}{"|"}{.status.conditions[?(@.type=="Failed")].status}{"\n"}{end}' | while IFS='|' read -r job_name build_id complete failed; do
        if [ -z "$build_id" ]; then
          continue
        fi

        # If the job has already finished running, skip it to preserve Pod logs for debugging
        if [ "$complete" == "True" ] || [ "$failed" == "True" ]; then
          continue
        fi

        # Check the Cloud Build status. Suppress stderr so we don't spam logs
        status=$(gcloud builds describe "$build_id" --format="value(status)" 2>/dev/null)

        if [ "$status" == "CANCELLED" ] || [ "$status" == "FAILURE" ] || [ "$status" == "TIMEOUT" ]; then
          echo "WARNING: Cloud Build $build_id is $status!"
          echo "Deleting suspended/active Kubernetes Job $job_name to trigger graceful cleanup or remove it from Kueue..."
          kubectl delete job "$job_name"
        fi
      done

      # Poll every 30 seconds
      sleep 30
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kueue-reaper
  namespace: default
  labels:
    app: kueue-reaper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kueue-reaper
  template:
    metadata:
      labels:
        app: kueue-reaper
    spec:
      serviceAccountName: kueue-reaper-ksa
      containers:
      - name: reaper
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:stable
        command: ["/bin/bash", "/scripts/reaper.sh"]
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: kueue-reaper-script
          defaultMode: 0777
