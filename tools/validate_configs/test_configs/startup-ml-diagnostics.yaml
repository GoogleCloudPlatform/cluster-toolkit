---

blueprint_name: startup_ml_diagnostics

vars:
  project_id:  # Set GCP Project ID Here
  deployment_name: startup-ml-diagnostics
  region: us-central1
  zone: us-central1-a

deployment_groups:
- group: primary
  modules:
  - id: network1
    source: modules/network/pre-existing-vpc

  - id: startup
    source: modules/scripts/startup-script
    settings:
      enable_ml_diagnostics_daemon: true
      ml_diagnostics_daemon_version: "1.0.1"
      runners:
      # Verify the automatic ML Diagnostics runner destination does not collide
      # with a custom runner named install_ml_diagnostics_agent.sh in runners_map.
      - type: shell
        destination: "install_ml_diagnostics_agent.sh"
        content: |
          #!/bin/bash
          echo "custom user runner"

  - id: instance-use-startup
    source: modules/compute/vm-instance
    use: [network1, startup]
    settings:
      name_prefix: ml-diag
      machine_type: n2d-standard-4
