---
blueprint_name: service-account-profiles

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: iamsa01
  region: us-central1
  zone: us-central1-c

deployment_groups:
- group: primary
  modules:

  - id: bucket
    source: modules/file-system/cloud-storage-bucket
    settings:
      random_suffix: true

  - id: network
    source: modules/network/vpc

  # Each identity is a modules/project/service-account block, which creates
  # the keyless account, plus a service-account-profiles block, which grants
  # it the profile's permissions.

  - id: controller_account
    source: modules/project/service-account
    settings:
      name: controller
      project_roles: []

  # slurm-controller with every capability flag, and actAs on each compute
  # account it attaches to nodes (one per nodeset) but not on login_sa.
  - id: controller_sa
    source: community/modules/iam/service-account-profiles
    use: [controller_account]
    settings:
      name: controller
      profile: slurm-controller
      enable_placement_policies: true
      enable_public_ips: true
      enable_mig: true
      enable_mig_flex: true
      enable_bigquery_load: true
      enable_tpu: true
      enable_tpu_gce: true
      # Exercises instance_name_prefixes on the controller profile (multi-
      # prefix coverage lives in the local case suite, not here).
      instance_name_prefixes: [iamsa01-]
      iam_propagation_wait: 1m
      act_as_service_accounts:
      - $(compute_sa.service_account_email)
      - $(gpu_compute_sa.service_account_email)

  - id: login_account
    source: modules/project/service-account
    settings:
      name: login
      project_roles: []

  - id: login_sa
    source: community/modules/iam/service-account-profiles
    use: [login_account]
    settings:
      name: login
      profile: slurm-login

  - id: compute_account
    source: modules/project/service-account
    settings:
      name: compute
      project_roles: []

  # slurm-compute with a bucket grant instead of project-wide storage access.
  - id: compute_sa
    source: community/modules/iam/service-account-profiles
    use: [compute_account]
    settings:
      name: compute
      profile: slurm-compute
      bucket_bindings:
        results:
          bucket: $(bucket.gcs_bucket_name)
          role: roles/storage.objectUser

  - id: gpu_compute_account
    source: modules/project/service-account
    settings:
      name: gpu-compute
      project_roles: []

  # A second compute account, for a dedicated GPU nodeset.
  - id: gpu_compute_sa
    source: community/modules/iam/service-account-profiles
    use: [gpu_compute_account]
    settings:
      name: gpu-compute
      profile: slurm-compute
      bucket_bindings:
        results:
          bucket: $(bucket.gcs_bucket_name)
          role: roles/storage.objectUser

  - id: image_builder_account
    source: modules/project/service-account
    settings:
      name: image-builder
      project_roles: []

  - id: image_builder_sa
    source: community/modules/iam/service-account-profiles
    use: [image_builder_account]
    settings:
      name: image-builder
      profile: image-builder
      # Overrides the default ("packer-") to exercise the setting; both cover
      # this profile's real build VM name.
      instance_name_prefixes: [packer-, pkr-]

  - id: frontend_account
    source: modules/project/service-account
    settings:
      name: fe
      project_roles: []

  # The Open Front End web identity as a custom profile: the per-cluster
  # subscription permissions in its custom role, and every
  # resource-scoped binding type.
  - id: frontend_sa
    source: community/modules/iam/service-account-profiles
    use: [frontend_account]
    settings:
      name: fe
      profile: custom
      custom_profile_name: Open Front End
      custom_permissions:
      - pubsub.subscriptions.create
      - pubsub.subscriptions.delete
      - pubsub.subscriptions.get
      - pubsub.subscriptions.getIamPolicy
      - pubsub.subscriptions.setIamPolicy
      bucket_bindings:
        control:
          bucket: $(bucket.gcs_bucket_name)
          role: roles/storage.objectAdmin
      secret_bindings:
        registry:
          secret_id: $(vars.deployment_name)-repo-secret
          role: roles/secretmanager.secretAccessor
      artifact_registry_bindings:
        registry:
          location: us-central1
          repository_id: $(vars.deployment_name)-repo
          role: roles/artifactregistry.reader
      bigquery_dataset_bindings:
        job_data:
          dataset_id: $(vars.deployment_name)_job_data
          role: roles/bigquery.dataViewer
      pubsub_topic_bindings:
        c2:
          topic: $(vars.deployment_name)
          role: roles/pubsub.publisher
      pubsub_subscription_bindings:
        c2resp:
          subscription: $(vars.deployment_name)-c2resp
          role: roles/pubsub.subscriber

  - id: custom_account
    source: modules/project/service-account
    settings:
      name: custom
      project_roles: []

  # custom profile with custom permissions on a role at a non-default launch
  # stage.
  - id: custom_sa
    source: community/modules/iam/service-account-profiles
    use: [custom_account]
    settings:
      name: custom
      profile: custom
      custom_profile_name: Zone reader
      custom_permissions:
      - compute.zones.list
      custom_role_stage: BETA

  - id: existing_role_account
    source: modules/project/service-account
    settings:
      name: existing-role
      project_roles: []

  # custom profile binding an existing custom role alongside a generated one.
  - id: existing_role_sa
    source: community/modules/iam/service-account-profiles
    use: [existing_role_account]
    settings:
      name: existing-role
      profile: custom
      custom_profile_name: Existing role
      custom_roles:
      - projects/$(vars.project_id)/roles/$(vars.deployment_name)_web
      custom_permissions:
      - compute.zones.get

  - id: capability_account
    source: modules/project/service-account
    settings:
      name: capability
      project_roles: []

  # custom profile built from a capability flag, with a Shared VPC-style
  # subnetwork grant.
  - id: capability_sa
    source: community/modules/iam/service-account-profiles
    use: [capability_account]
    settings:
      name: capability
      profile: custom
      custom_profile_name: BigQuery loader
      enable_bigquery_load: true
      subnetwork_bindings:
        primary:
          region: $(vars.region)
          subnetwork: $(network.subnetwork_name)
          role: roles/compute.networkUser

  - id: etl_account
    source: modules/project/service-account
    settings:
      name: etl
      project_roles: []

  # Each extra custom identity is its own module block.
  - id: etl_sa
    source: community/modules/iam/service-account-profiles
    use: [etl_account]
    settings:
      name: etl
      profile: custom
      custom_profile_name: ETL
      enable_bigquery_load: true
      bucket_bindings:
        data:
          bucket: $(bucket.gcs_bucket_name)
          role: roles/storage.objectViewer

  - id: viz_account
    source: modules/project/service-account
    settings:
      name: viz
      project_roles: []

  - id: viz_sa
    source: community/modules/iam/service-account-profiles
    use: [viz_account]
    settings:
      name: viz
      profile: custom
      custom_profile_name: Visualisation
      custom_permissions: [compute.instances.get]
      custom_role_stage: BETA

  - id: backup_account
    source: modules/project/service-account
    settings:
      name: backup
      project_roles: []

  # custom profile with only a resource-scoped binding: no custom_permissions,
  # custom_roles or enable_* flag. Exercises the "at least one of" validator's
  # *_bindings branch.
  - id: backup_sa
    source: community/modules/iam/service-account-profiles
    use: [backup_account]
    settings:
      name: backup
      profile: custom
      custom_profile_name: Backup uploader
      bucket_bindings:
        data:
          bucket: $(bucket.gcs_bucket_name)
          role: roles/storage.objectUser
