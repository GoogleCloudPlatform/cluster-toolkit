---

blueprint_name: test-workstation-lustre

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: test
  region: us-central1
  zone: us-central1-a
  machine_type: n2d-standard-2


deployment_groups:
- group: primary
  modules:

  ###########
  # Network #
  ###########

  - id: network1
    source: modules/network/vpc

  - id: private_service_access
    source: modules/network/private-service-access
    use: [network1]

  ###########
  # Storage #
  ###########

  - id: lustre
    source: modules/file-system/managed-lustre
    use:
    - network1
    - private_service_access
    settings:
      name: test-lustre
      local_mount: /lustre
      remote_mount: lustrefs
      size_gib: 36000

  #############
  # Simple VM #
  #############

  - id: workstation-rocky
    source: modules/compute/vm-instance
    use:
    - network1
    - lustre
    settings:
      name_prefix: rocky
      instance_count: 1
      instance_image:
        family: rocky-linux-8
        project: rocky-linux-cloud
  - id: wait-rocky
    source: community/modules/scripts/wait-for-startup
    settings:
      instance_name: ((module.workstation-rocky.name[0]))
      timeout: 7200

  - id: workstation-ubuntu
    source: modules/compute/vm-instance
    use:
    - network1
    - lustre
    settings:
      name_prefix: ubuntu
      instance_count: 1
      instance_image:
        family: ubuntu-2204-lts
        project: ubuntu-os-cloud
  - id: wait-ubuntu
    source: community/modules/scripts/wait-for-startup
    settings:
      instance_name: ((module.workstation-ubuntu.name[0]))
      timeout: 7200
