---

blueprint_name: test-workstation-filestore

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: test
  region: us-central1
  zone: us-central1-a
  machine_type: n1-standard-2

deployment_groups:
- group: primary
  modules:

  ###########
  # Network #
  ###########

  - id: network1
    source: modules/network/vpc

  ###########
  # Storage #
  ###########

  - id: homefs
    source: modules/file-system/filestore
    use: [network1]
    settings:
      local_mount: /home

  #############
  # Simple VM #
  #############

  - id: workstation_ubuntu
    source: modules/compute/vm-instance
    use:
    - network1
    - homefs
    settings:
      instance_image:
        family: ubuntu-2404-lts-amd64
        project: ubuntu-os-cloud
      name_prefix: workstation-ubuntu
      instance_count: 1
  - id: wait_ubuntu
    source: community/modules/scripts/wait-for-startup
    settings:
      instance_name: ((module.workstation_ubuntu.name[0]))

  - id: workstation_rocky
    source: modules/compute/vm-instance
    use:
    - network1
    - homefs
    settings:
      instance_image:
        family: aci-cpu-rocky-linux-9-amd64
        project: advanced-compute-images
      name_prefix: workstation-rocky
      instance_count: 1
  - id: wait_rocky
    source: community/modules/scripts/wait-for-startup
    settings:
      instance_name: ((module.workstation_rocky.name[0]))
