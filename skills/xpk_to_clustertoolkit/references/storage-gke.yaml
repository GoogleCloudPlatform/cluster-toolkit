blueprint_name: storage-gke

vars:
  project_id:
  deployment_name: storage-gke
  region: us-central1
  zone: us-central1-a
  authorized_cidr:
  gcp_public_cidrs_access_enabled: false

  # Storage CSI Drivers & Addons
  enable_gcsfuse_csi_driver: true
  enable_filestore_csi_driver: true
  enable_managed_lustre_csi: true
  enable_parallelstore_csi_driver: false
  enable_pd_csi: true
  enable_multi_tier_checkpointing: true

  # Managed Lustre Configuration
  lustre_instance_id: gke-lustre-instance
  lustre_size_gib: 36000
  per_unit_storage_throughput: 500
  lustre_kms_key: ""

  # Storage Pools (Pre-created storage pools)
  hyperdisk_balanced_storage_pool: "projects/$(vars.project_id)/zones/$(vars.zone)/storagePools/your-pool-balanced"
  hyperdisk_throughput_storage_pool: "projects/$(vars.project_id)/zones/$(vars.zone)/storagePools/your-pool-throughput"

  # MTC Template Configuration
  mtc_ramdisk_size: "50Gi"

deployment_groups:
- group: primary
  modules:
  - id: network1
    source: modules/network/vpc
    settings:
      network_name: $(vars.deployment_name)-net
      subnetwork_name: $(vars.deployment_name)-subnet
      secondary_ranges_list:
      - subnetwork_name: $(vars.deployment_name)-subnet
        ranges:
        - range_name: pods
          ip_cidr_range: 10.4.0.0/14
        - range_name: services
          ip_cidr_range: 10.0.32.0/20

  # Private Service Access (Required for Managed Lustre and Filestore)
  - id: private_service_access
    source: modules/network/private-service-access
    use: [network1]
    settings:
      prefix_length: 22

  # Firewall rule allowing Managed Lustre client traffic (Port 988)
  - id: lustre_firewall_rule
    source: modules/network/firewall-rules
    use: [network1]
    settings:
      ingress_rules:
      - name: $(vars.deployment_name)-allow-lustre-traffic
        description: Allow Managed Lustre traffic
        source_ranges:
        - $(private_service_access.cidr_range)
        allow:
        - protocol: tcp
          ports:
          - "988"

  - id: node_pool_service_account
    source: modules/project/service-account
    settings:
      name: gke-np-sa
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - monitoring.viewer
      - stackdriver.resourceMetadata.writer
      - storage.objectViewer
      - artifactregistry.reader

  - id: workload_service_account
    source: modules/project/service-account
    settings:
      name: gke-wl-sa
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - monitoring.viewer
      - stackdriver.resourceMetadata.writer
      - storage.objectAdmin
      - artifactregistry.reader
      - container.admin

  - id: gke_cluster
    source: modules/scheduler/gke-cluster
    use: [network1, workload_service_account]
    settings:
      enable_filestore_csi: $(vars.enable_filestore_csi_driver)
      enable_gcsfuse_csi: $(vars.enable_gcsfuse_csi_driver)
      enable_managed_lustre_csi: $(vars.enable_managed_lustre_csi)
      enable_parallelstore_csi: $(vars.enable_parallelstore_csi_driver)
      enable_pd_csi: $(vars.enable_pd_csi)
      enable_multi_tier_checkpointing: $(vars.enable_multi_tier_checkpointing)
      configure_workload_identity_sa: true
      enable_private_endpoint: false
      gcp_public_cidrs_access_enabled: $(vars.gcp_public_cidrs_access_enabled)
      master_authorized_networks:
      - display_name: kubectl-access-network
        cidr_block: $(vars.authorized_cidr)
    outputs: [instructions, k8s_service_account_name, node_service_account]

  - id: debug_pool
    source: modules/compute/gke-node-pool
    use: [gke_cluster, node_pool_service_account]
    settings:
      name: debug
      zones: [$(vars.zone)]
      machine_type: n2-standard-16
      auto_upgrade: true

  # =========================================================================
  # 1. Google Cloud Storage (Bucket with anywhere-cache and Zonal RAPID)
  # =========================================================================

  - id: data-bucket
    source: modules/file-system/cloud-storage-bucket
    settings:
      local_mount: /data
      random_suffix: true
      force_destroy: true
      object_users:
        gke_node_sa: "serviceAccount:$(gke_cluster.node_service_account)"
      anywhere_cache:
        zones: [$(vars.zone)]
        ttl: "86400s"
        admission_policy: "admit-on-first-miss"
    outputs: [gcs_bucket_name]

  - id: data-bucket-pv
    source: modules/file-system/gke-persistent-volume
    use: [gke_cluster, data-bucket]
    settings:
      capacity_gib: 5000

  - id: data-bucket-zonal
    source: modules/file-system/cloud-storage-bucket
    settings:
      local_mount: /data_zonal
      random_suffix: true
      force_destroy: true
      storage_class: RAPID
      placement_zones: ["$(vars.zone)"]
      enable_hierarchical_namespace: true
    outputs: [gcs_bucket_name]

  # =========================================================================
  # 2. Multi-Tier Checkpointing (MTC) Manifest Application
  # =========================================================================

  - id: apply_mtc_config
    source: modules/management/kubectl-apply
    use: [gke_cluster]
    settings:
      apply_manifests:
      - source: $(ghpc_stage("modules/management/kubectl-apply/manifests/checkpoint-configuration.yaml.tftpl"))
        template_vars:
          namespace: "default"
          inMemoryVolumeSize: $(vars.mtc_ramdisk_size)
          cloudStorageBucketName: $(data-bucket.gcs_bucket_name)

  # =========================================================================
  # 3. Filestore Instance & Persistent Volume
  # =========================================================================

  - id: filestore
    source: modules/file-system/filestore
    use: [network1]
    settings:
      local_mount: /shared

  - id: shared-filestore-pv
    source: modules/file-system/gke-persistent-volume
    use: [gke_cluster, filestore]

  # =========================================================================
  # 4. Managed Lustre Instance & Persistent Volume
  # =========================================================================

  - id: managed-lustre
    source: modules/file-system/managed-lustre
    use: [network1, private_service_access]
    settings:
      name: $(vars.lustre_instance_id)
      local_mount: /lustre
      remote_mount: lustrefs
      size_gib: $(vars.lustre_size_gib)
      per_unit_storage_throughput: $(vars.per_unit_storage_throughput)
      kms_key: $(vars.lustre_kms_key)

  - id: lustre-pv
    source: modules/file-system/gke-persistent-volume
    use: [managed-lustre, gke_cluster]
    settings:
      capacity_gib: $(vars.lustre_size_gib)
