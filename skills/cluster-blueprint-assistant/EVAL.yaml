# CUJ 4 (batched metadata validators): fix GKE node pool & Managed Lustre validator errors in one pass.
- name: case_16_batched_metadata_validators_gke_and_lustre
  description: "Agent repairs multiple batched metadata.yaml validator errors across gke-node-pool and managed-lustre in examples/broken-g4-pool.yaml and validates with gcluster expand without reading any .tf files."
  target_blueprint: examples/broken-g4-pool.yaml
  prompt: >
    examples/broken-g4-pool.yaml fails validation in project my-proj with
    multiple GKE node pool and Managed Lustre errors. Fix all of the
    validation errors in examples/broken-g4-pool.yaml (use Spot VMs as the
    consumption model, 2 threads per core, COMPACT placement, AS_NEEDED
    maintenance, 250 MB/s/TiB Lustre throughput, and gs://my-bucket/path)
    and validate it.
  live_setup:
  - |
    cat <<'EOF' > examples/broken-g4-pool.yaml
    ---
    blueprint_name: broken-g4-pool
    ai_assisted: true
    vars:
      project_id: {project}
      deployment_name: g4-pool-test
      region: us-central1
      zone: us-central1-a
    deployment_groups:
    - group: primary
      modules:
      - id: network
        source: modules/network/vpc
      - id: private_service_access
        source: modules/network/private-service-access
        use: [network]
      - id: gke_cluster
        source: modules/scheduler/gke-cluster
        use: [network]
      - id: gpu_pool
        source: modules/compute/gke-node-pool
        use: [gke_cluster]
        settings:
          machine_type: g2-standard-4
          zones: [us-central1-a]
          placement_policy:
            type: COLLOCATED
          threads_per_core: 4
          host_maintenance_interval: WEEKLY
          spot: true
          enable_flex_start: true
          reservation_affinity:
            consume_reservation_type: SPECIFIC_RESERVATION
            specific_reservations:
            - name: res-1
      - id: lustre
        source: modules/file-system/managed-lustre
        use: [network, private_service_access]
        settings:
          name: scratch-lustre
          local_mount: /mnt/lustre
          remote_mount: scratch
          size_gib: 18000
          per_unit_storage_throughput: 300
          import_gcs_bucket_uri: /my-bucket/path
    EOF
  expect_keywords_all:
  - "COMPACT"
  - "AS_NEEDED"
  - "gs://my-bucket/path"
  expect_keywords_any:
  - "250"
  - "threads_per_core"
  - "gcluster expand"
  script_validators:
  - 'python3 -c "import yaml; d=yaml.safe_load(open(\"examples/broken-g4-pool.yaml\")); m={x[\"id\"]:x.get(\"settings\",{}) for x in d[\"deployment_groups\"][0][\"modules\"]}; g,l=m[\"gpu_pool\"],m[\"lustre\"]; assert g[\"placement_policy\"].get(\"type\")==\"COMPACT\" and g[\"threads_per_core\"]==2 and g[\"host_maintenance_interval\"]==\"AS_NEEDED\" and g.get(\"spot\") is True and not g.get(\"enable_flex_start\") and l[\"per_unit_storage_throughput\"]==250 and l[\"import_gcs_bucket_uri\"]==\"gs://my-bucket/path\""'
  expectations:
  - "The agent fixed all GKE node pool and Managed Lustre validation errors in examples/broken-g4-pool.yaml (COMPACT placement, 2 threads_per_core, AS_NEEDED maintenance, Spot-only consumption model, 250 throughput, and gs://my-bucket/path) and validated the blueprint."
  forbidden_commands:
  - "variables.tf"
  - "outputs.tf"
  - "main.tf"
  - "-l IGNORE"
  - "--validation-level IGNORE"
  - "terraform apply"
  - "gcluster destroy"
  - "rm -rf"

# CUJ 4 (Slurm topology & reservation migration): fix nodeset/partition wiring and DWS Flex conflict.
- name: case_17_slurm_topology_and_reservation_validation
  description: "Agent repairs Slurm v6 nodeset/partition wiring and migrates compute_nodeset off a conflicting reservation_name onto DWS Flex Start with ANY_SINGLE_ZONE and lowercase partition_name in examples/broken-slurm-topology.yaml without reading any .tf files."
  target_blueprint: examples/broken-slurm-topology.yaml
  prompt: >
    examples/broken-slurm-topology.yaml fails validation in project my-proj.
    Migrate compute_nodeset off the stale reservation onto DWS Flex Start
    with ANY_SINGLE_ZONE, rename the partition to lowercase 'compute', wire
    compute_nodeset into compute_partition, and validate the blueprint.
  live_setup:
  - |
    cat <<'EOF' > examples/broken-slurm-topology.yaml
    ---
    blueprint_name: broken-slurm-topology
    ai_assisted: true
    vars:
      project_id: {project}
      deployment_name: slurm-topo-test
      region: us-central1
      zone: us-central1-a
    deployment_groups:
    - group: primary
      modules:
      - id: network
        source: modules/network/vpc
      - id: compute_nodeset
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        use: [network]
        settings:
          machine_type: c2-standard-60
          node_count_dynamic_max: 4
          enable_placement: false
          dws_flex:
            enabled: true
          reservation_name: stale-res-1
          zone_target_shape: BALANCED
      - id: compute_partition
        source: community/modules/compute/schedmd-slurm-gcp-v6-partition
        settings:
          partition_name: Compute_1
      - id: slurm_controller
        source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
        use: [network, compute_partition]
    EOF
  expect_keywords_all:
  - "compute_nodeset"
  - "ANY_SINGLE_ZONE"
  - "compute"
  expect_keywords_any:
  - "dws_flex"
  - "reservation_name"
  - "gcluster expand"
  script_validators:
  - 'python3 -c "import yaml; d=yaml.safe_load(open(\"examples/broken-slurm-topology.yaml\")); m={x[\"id\"]:x for x in d[\"deployment_groups\"][0][\"modules\"]}; ns,pt=m[\"compute_nodeset\"][\"settings\"],m[\"compute_partition\"]; assert ns.get(\"dws_flex\",{}).get(\"enabled\") is True and not ns.get(\"reservation_name\") and ns.get(\"zone_target_shape\")==\"ANY_SINGLE_ZONE\" and pt[\"settings\"][\"partition_name\"]==\"compute\" and \"compute_nodeset\" in pt.get(\"use\",[])"'
  expectations:
  - "The agent removed the conflicting reservation_name on compute_nodeset, set zone_target_shape to ANY_SINGLE_ZONE, set partition_name to 'compute', wired compute_nodeset into compute_partition's use list, and validated the blueprint."
  forbidden_commands:
  - "variables.tf"
  - "outputs.tf"
  - "main.tf"
  - "-l IGNORE"
  - "--validation-level IGNORE"
  - "terraform apply"
  - "gcluster destroy"
  - "rm -rf"

