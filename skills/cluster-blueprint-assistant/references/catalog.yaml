# M0 starter catalog (hand-written, 2 blueprints).
# From M1 onwards this file is generated by tools/catalog-gen for every
# blueprint under examples/ and community/examples/ and kept in sync by
# pre-commit. Do not edit manually after that point.
#
# Schema:
#   blueprints[]:
#     path:             repo-relative path of the blueprint YAML
#     deployment_path:  optional companion *-deployment.yaml holding user settings
#     blueprint_name:   top-level `blueprint_name`
#     scheduler:        slurm | gke | none
#     description:      one-line summary of what the blueprint deploys
#     machine_types[]:  machine types used by compute modules
#     vars:             top-level `vars:` and their defaults (null = must be set)
#     modules[]:        id / source / use for each module, in blueprint order
#   module_wiring:
#     <module source>:
#       required_inputs[]: inputs with no default (auto-injected globals excluded)
#       recommended_use[]: module sources whose outputs satisfy required_inputs
#       consumed_by[]:     module sources that accept this module's outputs via `use:`

---
blueprints:
- path: examples/hpc-slurm.yaml
  blueprint_name: hpc-slurm
  scheduler: slurm
  description: >-
    Basic auto-scaling Slurm cluster: new VPC with Private Service Access,
    Filestore mounted at /home, three partitions (debug: n2-standard-2,
    compute: c2-standard-60, h3: h3-standard-88), a login node and a controller.
  machine_types: [n2-standard-2, c2-standard-60, h3-standard-88, n2-standard-4]
  vars:
    project_id: null
    deployment_name: hpc-slurm
    region: us-central1
    zone: us-central1-a
    debug_node_count_max: 4
    compute_node_count_max: 20
    compute_machine_type: c2-standard-60
    compute_enable_spot_vm: false
  modules:
  - id: network
    source: modules/network/vpc
  - id: private_service_access
    source: modules/network/private-service-access
    use: [network]
  - id: homefs
    source: modules/file-system/filestore
    use: [network, private_service_access]
  - id: debug_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
  - id: debug_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [debug_nodeset]
  - id: compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
  - id: compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [compute_nodeset]
  - id: h3_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
  - id: h3_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [h3_nodeset]
  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use: [network, debug_partition, compute_partition, h3_partition, homefs, slurm_login]

- path: examples/gke-a4/gke-a4.yaml
  deployment_path: examples/gke-a4/gke-a4-deployment.yaml
  blueprint_name: gke-a4
  scheduler: gke
  description: >-
    GKE cluster with an A4 (B200) GPU node pool, dedicated node-pool and
    workload service accounts, two GCS buckets exposed as persistent volumes,
    Kueue + JobSet + NCCL gIB installed, and sample job templates. Consumption
    model (specific reservation, DWS Flex Start, Flex Start + queued
    provisioning) is chosen in the deployment file. Managed Lustre modules are
    present but commented out.
  machine_types: [a4-highgpu-8g, n2d-standard-4]
  vars:
    project_id: null
    deployment_name: gke-a4
    region: null
    zone: null
    static_node_count: null
    authorized_cidr: null
    spot: false
    reservation_affinity: {consume_reservation_type: NO_RESERVATION, specific_reservations: []}
    enable_flex_start: false
    auto_repair: true
    enable_queued_provisioning: false
    autoscaling_total_min_nodes: 0
    placement_policy: {type: null, name: null}
    system_node_pool_disk_size_gb: 200
    a4_node_pool_disk_size_gb: 100
    accelerator_type: nvidia-b200
    version_prefix: "1.35."
    auto_monitoring_scope: NONE
    enable_inference_gateway: false
  modules:
  - id: gke-a4-net-0
    source: modules/network/vpc
  - id: node_pool_service_account
    source: modules/project/service-account
  - id: workload_service_account
    source: modules/project/service-account
  - id: training_bucket
    source: modules/file-system/cloud-storage-bucket
  - id: checkpoint_bucket
    source: modules/file-system/cloud-storage-bucket
  - id: a4-cluster
    source: modules/scheduler/gke-cluster
    use: [gke-a4-net-0, workload_service_account]
  - id: a4-pool
    source: modules/compute/gke-node-pool
    use: [a4-cluster, node_pool_service_account]
  - id: workload-manager-install
    source: modules/management/kubectl-apply
    use: [a4-cluster]
  - id: job-template
    source: modules/compute/gke-job-template
    use: [a4-pool]
  - id: training-pv
    source: modules/file-system/gke-persistent-volume
    use: [training_bucket, a4-cluster]
  - id: checkpointing-pv
    source: modules/file-system/gke-persistent-volume
    use: [checkpoint_bucket, a4-cluster]
  - id: fio-bench-job-template
    source: modules/compute/gke-job-template
    use: [checkpointing-pv, training-pv, a4-pool]

module_wiring:
  modules/file-system/managed-lustre:
    required_inputs: [name, network_id, network_self_link, private_vpc_connection_peering, remote_mount]
    recommended_use:
    - modules/network/vpc                     # network_id, network_self_link
    - modules/network/private-service-access  # private_vpc_connection_peering
    consumed_by:
    - modules/file-system/gke-persistent-volume
    - community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    - community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    - modules/compute/vm-instance
