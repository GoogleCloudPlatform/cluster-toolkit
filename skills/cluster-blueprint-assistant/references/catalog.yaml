      source: "$(ghpc_stage(\"adm/inference.yml\"))"
      type: ansible-local
    instance_image:
      family: "$(\"${vars.deployment_name}-slurm-apptainer\")"
      project: $(vars.project_id)
    jax_compilation_cache_path: ""
    login_machine_type: n2-standard-4
    login_runners:
    - args: "$(\"-e database_bucket=${vars.database_bucket} -e datapipeline_partition=${vars.default_datapipeline_partition.name}\")"
      destination: onetime_prepare_databasebucket.yml
      source: "$(ghpc_stage(\"adm/onetime_prepare_databasebucket.yml\"))"
      type: ansible-local
    max_template_date: ""
    model_dir: /opt/apps/af3/models
    modelweights_bucket: ""
    num_diffusion_samples: ""
    num_recycles: ""
    num_seeds: ""
    pdb_database_path: /mnt/databases/v3.0/uncompressed/mmcif_files
    project_id: null
    region: us-central1
    save_embeddings: ""
    sif_dir: /opt/apps/af3/containers
    zone: us-central1-a
