---

blueprint_name: hpcslurmlb

vars:
  project_id:  # Set Project ID
  deployment_name: hpcslurmlb
  region: us-central1
  zone: us-central1-a
  enable_slurm_auth: true

terraform_backend_defaults:
  type: gcs
  configuration:
    bucket:  # Set Bucket Name Here

deployment_groups:
- group: primary
  modules:
  # Service Accounts
  - id: controller_sa
    source: modules/project/service-account
    kind: terraform
    settings:
      deployment_name: $(vars.deployment_name)
      project_id: $(vars.project_id)
      name: controller-sa
      description: Controller Service Account
      display_name: Controller SA
      project_roles:
      - compute.instanceAdmin.v1
      - iam.serviceAccountUser
      - storage.objectViewer
      - logging.logWriter
      - monitoring.metricWriter

  - id: login_sa
    source: modules/project/service-account
    kind: terraform
    settings:
      deployment_name: $(vars.deployment_name)
      project_id: $(vars.project_id)
      name: login-sa
      description: Login Node Service Account
      display_name: Login SA
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - storage.objectViewer

  - id: compute_sa
    source: modules/project/service-account
    kind: terraform
    settings:
      deployment_name: $(vars.deployment_name)
      project_id: $(vars.project_id)
      name: compute-sa
      description: Compute Node Service Account
      display_name: Compute SA
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - storage.objectViewer

  # Network
  - id: network
    source: modules/network/vpc
    settings:
      network_name: $(vars.deployment_name)-net
      subnetworks:
      - subnet_name: $(vars.deployment_name)-primary-subnet
        subnet_region: $(vars.region)
        subnet_ip: 10.80.0.0/24
      - subnet_name: $(vars.deployment_name)-proxy-subnet
        # A Proxy-only subnet is only required if you are configuring the Internal Application Load Balancer
        # (the slurm_api_lb module below). If you omit the LB, you can safely remove this subnet.
        subnet_region: $(vars.region)
        subnet_ip: 10.81.0.0/24
        purpose: REGIONAL_MANAGED_PROXY
        role: ACTIVE
      firewall_rules:
      - name: $(vars.deployment_name)-allow-lb-to-slurmrest
        description: Allow Envoy proxies and Health Checks to reach slurmrestd
        direction: INGRESS

        ranges:
        - 10.81.0.0/24    # Proxy-only subnet
        - 130.211.0.0/22  # GCP Health Checks
        - 35.191.0.0/16   # GCP Health Checks
        target_tags:
        - $(vars.deployment_name)-controller
        allow:
        - protocol: tcp
          ports: ["6842"]

  # Filestore (Shared /home)
  - id: home_fs
    source: modules/file-system/filestore
    settings:
      network_id: $(network.network_id)
      size_gb: 1024
      filestore_tier: BASIC_HDD
      zone: $(vars.zone)

  # Login Node Logic
  - id: login_nodes
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    settings:
      name_prefix: login
      num_instances: 1
      machine_type: n1-standard-2
      service_account_email: $(login_sa.service_account_email)
      service_account_scopes: ["https://www.googleapis.com/auth/cloud-platform"]
      enable_oslogin: true
      enable_shielded_vm: true
      subnetwork_self_link: $(network.subnetwork_self_link)
      enable_login_public_ips: false # NO EXTERNAL IP

  # Nodeset (Compute)
  - id: compute_nodes
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    settings:
      name: a2-nodes
      node_count_dynamic_max: 4
      node_count_static: 0
      machine_type: n1-standard-2
      service_account_email: $(compute_sa.service_account_email)
      service_account_scopes: ["https://www.googleapis.com/auth/cloud-platform"]
      enable_oslogin: true
      enable_shielded_vm: true
      subnetwork_self_link: $(network.subnetwork_self_link)
      enable_placement: false
      network_storage:
      - server_ip: $(home_fs.network_storage.server_ip)
        remote_mount: $(home_fs.network_storage.remote_mount)
        local_mount: /home
        fs_type: nfs
        mount_options: _netdev,hard,intr

  # Partition
  - id: debug_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [compute_nodes]
    settings:
      partition_name: debug
      is_default: true

  # Filestore (Dedicated State for Controller)
  - id: controller_fs
    source: modules/file-system/filestore
    settings:
      network_id: $(network.network_id)
      size_gb: 1024
      filestore_tier: BASIC_HDD
      zone: $(vars.zone)

  # Cloud SQL (External DB)
  - id: slurm_db
    source: community/modules/database/slurm-cloudsql-federation
    settings:
      deployment_name: $(vars.deployment_name)
      project_id: $(vars.project_id)
      region: $(vars.region)
      tier: db-f1-micro
      sql_instance_name: $(vars.deployment_name)-db
      network_id: $(network.network_id)
      use_psc_connection: true
      subnetwork_self_link: $(network.subnetwork_self_link)

  # Controller (Custom HA Module)
  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use: [debug_partition]
    settings:
      enable_backup_controller: true
      controller_ha_type: regional
      slurm_cluster_name: $(vars.deployment_name)
      backup_zone: us-central1-f
      # Disable PD state disk, rely on /var/spool/slurm filestore share
      controller_state_disk: null
      cloudsql:
        server_ip: $(slurm_db.cloudsql.server_ip)
        user: $(slurm_db.cloudsql.user)
        password: $(slurm_db.cloudsql.password)
        db_name: $(slurm_db.cloudsql.db_name)
      enable_controller_public_ips: false # NO EXTERNAL IP
      machine_type: n1-standard-2
      zone: $(vars.zone)
      service_account_email: $(controller_sa.service_account_email)
      service_account_scopes: ["https://www.googleapis.com/auth/cloud-platform"]
      enable_oslogin: true
      enable_shielded_vm: true
      tags: ["$(vars.deployment_name)-controller"]
      named_ports:
      - name: slurm-restapi
        port: 6842
      subnetwork_self_link: $(network.subnetwork_self_link)
      login_nodes: $(login_nodes.login_nodes)
      network_storage:
      - server_ip: $(home_fs.network_storage.server_ip)
        remote_mount: $(home_fs.network_storage.remote_mount)
        local_mount: /home
        fs_type: nfs
        mount_options: _netdev,hard,intr
      - server_ip: $(controller_fs.network_storage.server_ip)
        remote_mount: $(controller_fs.network_storage.remote_mount)
        local_mount: /var/spool/slurm
        fs_type: nfs
        mount_options: _netdev,hard,intr
      login_network_storage:
      - server_ip: $(home_fs.network_storage.server_ip)
        remote_mount: $(home_fs.network_storage.remote_mount)
        local_mount: /home
        fs_type: nfs
        mount_options: _netdev,hard,intr
      static_ips:
      - "10.80.0.10"
      - "10.80.0.11"

  # Internal Application Load Balancer for Slurm REST API
  - id: slurm_api_lb
    source: community/modules/network/int-app-lb
    use: [network]
    settings:
      project_id: $(vars.project_id)
      region: $(vars.region)
      backends:
      - $(slurm_controller.controller_instance_group)
      endpoints:
        slurm-restapi:
          port: 6842
          paths: ["/slurm/*", "/slurmdb/*"]
          health_check_type: "TCP"
      lb_name: $(vars.deployment_name)-api-lb
      ip_address: "10.80.0.100"
