---

# See instructions at
# https://github.com/GoogleCloudPlatform/hpc-toolkit/tree/main/examples#image-builderyaml-

blueprint_name: hpc-slurm6-hybrid

vars:
  project_id: ## Set GCP Project ID Here ##

  #Directory the on-prem controller exports over NFS holding slurm.key, the
  #compute nodes mount it at boot, copy the key and unmount it again, so the key
  #never ends up in a disk image; see docs/hybrid-slurm-cluster/README.md.
  key_export_dir: /slurm/key_distribution

  deployment_name: slurm6-hybrid
  onprem_ctld_host: "your_slurmctld_name"
  onprem_ctld_addr: "your_slurmctld_IPaddress"
  cluster_name: "your-cluster-name"
  on_prem_install_dir: "your_slurm_installation_directory"
  slurm_uid: 620
  slurm_gid: 620
  output_dir: /share/$(vars.deployment_name)-files
  region: us-central1
  zone: us-central1-c
  # see latest in https://github.com/GoogleCloudPlatform/slurm-gcp/blob/master/docs/images.md#published-image-family
  latest_base_image: slurm-gcp-6-11-hpc-rocky-linux-8
  custom_image:
    family: hybrid
    project: $(vars.project_id)
  disk_size: 64

  #The range allowed to reach slurmd on the compute nodes. Set it to the range
  #your on-prem controller reaches the cloud from, i.e. your VPN/Interconnect
  #subnet; the value below is the example on-prem network used in the docs.
  #Never widen it to "0.0.0.0/0", that exposes slurmd to the whole internet.
  controller_ip_range: "192.168.1.0/24"
  slurmd_port: 6818


deployment_groups:
- group: network
  modules:
  - id: network
    source: modules/network/vpc
    settings:
      network_name: "slurm-hybrid-net"
      firewall_rules:
      - name: "slurmd-ingress"
        description: "My slurmd ingress"
        direction: "INGRESS"
        ranges:
        - $(vars.controller_ip_range)
        allow:
        - protocol: "tcp"
          ports:
          - $(vars.slurmd_port)


- group: scripts_for_image
  modules:
  - id: scripts_for_image
    source: modules/scripts/startup-script
    settings:
      runners:
      #This scripts creates on the compute node image all the necessary slurmd
      #directories as we have on-prem. For things like the log or the etc dir
      #mkdir is good enough, but with the ln we keep it all in the same place.
      - type: shell
        destination: prepare_slurm_dirs.sh
        content: |
          #!/bin/sh
          mkdir -p $(vars.on_prem_install_dir)/var/spool/slurmd
          ln -s /usr/local/etc/slurm $(vars.on_prem_install_dir)/etc
          ln -s /usr/local/bin $(vars.on_prem_install_dir)/bin
          ln -s /usr/local/sbin $(vars.on_prem_install_dir)/sbin
          ln -s /var/log/slurm $(vars.on_prem_install_dir)/var/log
          chown -R $(vars.slurm_uid):$(vars.slurm_gid) $(vars.on_prem_install_dir)

- group: image
  modules:
  - id: custom-image
    source: modules/packer/custom-image
    kind: packer
    use:
    - network
    - scripts_for_image
    settings:
      source_image_project_id: [schedmd-slurm-public]
      source_image_family: $(vars.latest_base_image)
      disk_size: $(vars.disk_size)
      image_family: $(vars.custom_image.family)
      state_timeout: 15m

- group: cluster
  modules:
  - id: compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 20
      disk_size_gb: $(vars.disk_size)
      instance_image: $(vars.custom_image)
      instance_image_custom: true

  - id: compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [compute_nodeset]
    settings:
      partition_name: compute
      is_default: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - compute_partition
    settings:
      enable_hybrid: true
      slurm_cluster_name: $(vars.cluster_name)
      enable_slurm_auth: true
      #Where the compute nodes get slurm.key from, the directory your on-prem
      #controller exports to the cloud subnet.
      slurm_key_mount:
        server_ip: $(vars.onprem_ctld_addr)
        remote_mount: $(vars.key_export_dir)
        fs_type: nfs
        mount_options: defaults,hard,intr,_netdev
      output_dir: $(vars.output_dir)
      install_dir: $(vars.on_prem_install_dir)/etc
      hybrid_conf:
        slurm_control_host: $(vars.onprem_ctld_host)
        slurm_control_addr: $(vars.onprem_ctld_addr)
        slurm_uid: $(vars.slurm_uid)
        slurm_gid: $(vars.slurm_gid)
        slurm_log_dir: $(vars.on_prem_install_dir)/var/log
        slurm_bin_dir: $(vars.on_prem_install_dir)/bin
