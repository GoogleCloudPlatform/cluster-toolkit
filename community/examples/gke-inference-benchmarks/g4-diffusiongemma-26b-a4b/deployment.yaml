terraform_backend_defaults:
  type: gcs
  configuration:
    # The GCS bucket used for storing terraform state
    bucket:

vars:
  # Your GCP Project ID
  project_id:

  # This should be unique across all of your Cluster Toolkit Deployments.
  deployment_name: g4-diffusiongemma

  # The GCP Region and Zone used for this deployment. Spot capacity is zonal;
  # pick a zone with G4 availability:
  # https://cloud.google.com/compute/docs/gpus/gpu-regions-zones
  region: us-central1
  zone: us-central1-b

  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr:

  # g4-standard-48 = 1x NVIDIA RTX PRO 6000 (96 GB).
  # See allowed values here: https://cloud.google.com/compute/docs/gpus#rtx-6000-gpus
  machine_type: g4-standard-48
  num_gpus: 1

  # Number of nodes. One node is enough for the benchmark.
  static_node_count: 1

  # Consumption model: Spot VMs (preemptible). Set to false for on-demand.
  spot: true

  # Hugging Face token for the gated model. Do NOT commit it here; pass it with
  # --vars hf_token=$HF_TOKEN (see README.md for the plaintext state caveat).
  hf_token: ""

  # Existing Cloud Storage bucket (name only, no gs://) and prefix for the model
  # weights; leave model_bucket empty to use a Hyperdisk volume (see README.md).
  model_bucket: ""
  model_path: models/diffusiongemma-26B-A4B-it

  # Set to false to only deploy the vLLM server (no benchmark Job).
  run_benchmark: true

  # Benchmark workload (random dataset); part of the Job name, so change them
  # with `gcluster deploy -w` (see README.md). bench_run_id repeats a workload.
  bench_input_len: 1024
  bench_output_len: 1024
  bench_num_prompts: 64
  bench_max_concurrency: 8
  bench_run_id: ""
