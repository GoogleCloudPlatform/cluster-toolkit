---

vars:
  # This should be unique across all of your Cluster Toolkit Deployments.
  deployment_name: sym-gke-01

  # Your GCP Project ID
  project_id: <YOUR_PROJECT_ID>

  # The GCP Region used for this deployment.
  region: us-central1

  # The GCP Zone used for this deployment.
  zone: us-central1-c

  # Authorized CIDR for kubectl/API server access (use 0.0.0.0/0 or specific CIDR)
  authorized_cidr: 0.0.0.0/0

  sym_installer: sym-7.3.2.0_x86_64.bin
  sym_source_bucket: <YOUR_GCS_BUCKET_NAME>
  sym_fixpack: sym-7.3.2.0_x86_64_build601711.tar.gz
  sym_entitlement: sym_adv_entitlement.dat
  symphony_install_dir: /opt/ibm/spectrumcomputing
  admin_password: <ADMIN_PASSWORD>

  # GKE Configuration
  gke_node_machine_type: c2-standard-8
  gke_min_node_count: 1
  gke_max_node_count: 100
