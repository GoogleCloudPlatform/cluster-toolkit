steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    gcloud storage cp gs://$_BUCKET/$_INSTALLER .
    gcloud storage cp gs://$_BUCKET/$_FIXPACK .
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    BUILD_ARGS="--build-arg sym_installer=$_INSTALLER --build-arg sym_fixpack=$_FIXPACK"
    # Use BuildKit to support inline heredocs
    export DOCKER_BUILDKIT=1
    docker build $$BUILD_ARGS -f Dockerfile.sym-compute -t $_IMAGE .
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '$_IMAGE']
- name: 'gcr.io/cloud-builders/git'
  args: ['clone', 'https://github.com/google/symphony-gcp.git']
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    export DOCKER_BUILDKIT=1
    docker build -t $_OPERATOR_IMAGE symphony-gcp/k8s-operator
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '$_OPERATOR_IMAGE']
substitutions:
  _BUCKET: ''
  _INSTALLER: ''
  _FIXPACK: ''
  _IMAGE: ''
  _OPERATOR_IMAGE: ''
options:
  logging: CLOUD_LOGGING_ONLY
