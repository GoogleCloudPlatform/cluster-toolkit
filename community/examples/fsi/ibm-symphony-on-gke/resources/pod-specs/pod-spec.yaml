containers:
  - name: sym-compute
    image: COMPUTE_IMAGE_PLACEHOLDER
    securityContext:
      privileged: true
    stdin: true
    tty: true
    env:
      - name: MASTER_HOST
        value: MASTER_IP_PLACEHOLDER
      - name: MASTER_ALIAS
        value: MASTER_HOSTNAME_PLACEHOLDER
    resources:
      requests:
        cpu: "2"
        memory: "4096M"
      limits:
        cpu: "4"
        memory: "8192M"
