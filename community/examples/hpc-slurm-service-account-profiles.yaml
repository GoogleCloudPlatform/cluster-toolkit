---

blueprint_name: hpc-slurm-service-account-profiles

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: lpsa01
  region: us-central1
  zone: us-central1-a
  # The controller's custom_role_stage. Named differently so it is not passed
  # to every service-account-profiles module (login and compute have no custom
  # role).
  controller_role_stage: GA

# A small Slurm cluster demonstrating community/modules/iam/service-account-profiles:
# separate controller, login and compute service accounts, each with its own
# custom IAM role instead of broad predefined roles such as
# roles/compute.instanceAdmin.v1. See that module's README.
#
# Documentation for each of the modules used below can be found at
# https://github.com/GoogleCloudPlatform/cluster-toolkit/blob/main/modules/README.md

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  - id: compute_account
    source: modules/project/service-account
    settings:
      name: compute
      project_roles: []

  - id: compute_sa
    source: community/modules/iam/service-account-profiles
    use: [compute_account]
    settings:
      name: compute
      profile: slurm-compute

  # A second, independent compute identity for a second nodeset/partition,
  # demonstrating that this module supports one account per nodeset rather
  # than a single shared compute account -- see
  # community/modules/iam/service-account-profiles/README.md, "Example usage".
  - id: compute2_account
    source: modules/project/service-account
    settings:
      name: compute2
      project_roles: []

  - id: compute2_sa
    source: community/modules/iam/service-account-profiles
    use: [compute2_account]
    settings:
      name: compute2
      profile: slurm-compute

  - id: login_account
    source: modules/project/service-account
    settings:
      name: login
      project_roles: []

  - id: login_sa
    source: community/modules/iam/service-account-profiles
    use: [login_account]
    settings:
      name: login
      profile: slurm-login

  - id: controller_account
    source: modules/project/service-account
    settings:
      name: controller
      project_roles: []

  - id: controller_sa
    source: community/modules/iam/service-account-profiles
    use: [controller_account]
    settings:
      name: controller
      profile: slurm-controller
      # debug_nodeset keeps the nodeset default enable_placement: true.
      enable_placement_policies: true
      custom_role_stage: $(vars.controller_role_stage)
      # Only the compute identities: the controller attaches them to the nodes
      # it creates at run time. Login VMs are created by Terraform under the
      # deploying principal, so the controller never needs to act as login_sa.
      act_as_service_accounts:
      - $(compute_sa.service_account_email)
      - $(compute2_sa.service_account_email)

  - id: debug_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, compute_sa]
    settings:
      node_count_dynamic_max: 2
      machine_type: n2-standard-2
      allow_automatic_updates: false

  - id: debug_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [debug_nodeset]
    settings:
      partition_name: debug
      exclusive: false # allows nodes to stay up after jobs are done
      is_default: true

  # A second nodeset/partition on the second compute identity. Dynamic nodes
  # default to 0, so this adds no steady-state cost; it only proves the
  # controller can resume nodes under either compute account.
  - id: debug2_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, compute2_sa]
    settings:
      node_count_dynamic_max: 2
      machine_type: n2-standard-2
      allow_automatic_updates: false

  - id: debug2_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [debug2_nodeset]
    settings:
      partition_name: debug2
      exclusive: false # allows nodes to stay up after jobs are done

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network, login_sa]
    settings:
      machine_type: n2-standard-4
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use: [network, controller_sa, debug_partition, debug2_partition, slurm_login]
    settings:
      enable_controller_public_ips: true
