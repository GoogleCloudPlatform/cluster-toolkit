---
blueprint_name: instructions-demo

vars:
  project_id: # Set Your Project ID
  deployment_name: instructions-test
  cluster_name: demo-cluster
  admin_user: cluster-admin

deployment_groups:
- group: primary
  modules:
  - id: custom-next-steps
    source: community/modules/general/instructions
    settings:
      banner_title: "Cluster Setup Complete"
      template_path: $(ghpc_stage("./instructions.txt.tftpl"))
      template_vars:
        deployment_name: $(vars.deployment_name)
        cluster_name: $(vars.cluster_name)
        admin_user: $(vars.admin_user)
      write_to_file: NEXT_STEPS.txt
    outputs:
    - instructions
