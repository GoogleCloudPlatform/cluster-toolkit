---

blueprint_name: hpc-slurm-scale

vars:
  enable_slurm_auth: true
  project_id: ## Set GCP Project ID Here ##
  deployment_name: hpc-slurm-scale
  region: us-central1
  zone: us-central1-a
  enable_spot_vm: true # Spot VM support for cost-effective scaling
  compute_machine_type: n2-standard-128
  enable_placement: true
  node_count_dynamic_max: 800 # 800 dynamic nodes
  login_machine_type: n2-standard-4 # Cost-effective machine type with high availability
  controller_machine_type: n2-standard-8
  compute_zones:
  - us-central1-a
  - us-central1-b
  - us-central1-c
  - us-central1-f

deployment_groups:
- group: primary
  modules:
  # 1. VPC Network (automatically creates /15 subnet with 131,072 IP addresses)
  - id: network
    source: modules/network/vpc

  # 2. Shared NFS Filesystem (/home)
  - id: homefs
    source: modules/file-system/filestore
    use: [network]
    settings:
      local_mount: /home

  # 3. Dynamic N2 Compute Nodeset
  # 800 nodes * 128 vCPUs = 102400 Cores maximum capacity
  - id: compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_static: 0             # 0 active VMs at idle ($0 compute cost)
      node_count_dynamic_max: $(vars.node_count_dynamic_max)
      machine_type: $(vars.compute_machine_type)
      enable_spot_vm: $(vars.enable_spot_vm)
      enable_placement: $(vars.enable_placement) # Placement policy
      zones: $(vars.compute_zones)     # Dynamic multi-zone list across region
      zone_target_shape: ANY
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  # 4. Compute Partition with 5-minute Auto-Decommission & Scale Timeouts
  - id: compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [compute_nodeset]
    settings:
      partition_name: compute
      is_default: true
      partition_conf:
        SuspendTime: 300               # Auto-decommission idle nodes after 5 mins
        ResumeTimeout: 900             # 15-min buffer for massive parallel provisioning
        SuspendTimeout: 600            # 10-min buffer for bulk node teardown

  # 5. Login Node
  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: $(vars.login_machine_type)
      enable_login_public_ips: true

  # 6. Slurm Controller Sized & Tuned for High Throughput & Scaling
  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - compute_partition
    - homefs
    - slurm_login
    settings:
      machine_type: $(vars.controller_machine_type) # 8 vCPUs for managing scale operations
      enable_controller_public_ips: true
      cloud_parameters:
        resume_rate: 300               # Staggers VM boot to protect Filestore NFS
        tree_width: 65533              # High-throughput flat communication hierarchy
        scheduler_parameters:          # Native first-class scheduler batching
        - defer
        - bf_continue
        - batch_sched_delay=1
