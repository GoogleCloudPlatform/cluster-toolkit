---
- name: Install CentOS Software Collections
  ansible.builtin.yum:
    name: centos-release-scl
  when: ansible_distribution == 'CentOS'

# The dev-tool package names differ by Rocky major version: Rocky 8 ships the
# gcc-toolset-9 SCL and python2/python36 devel packages, none of which exist on
# Rocky 9 (which uses python3-devel and only newer toolsets). gcc-toolset-11 and
# cmake exist on both, and the profile.d task below enables gcc-toolset-11 on either.
- name: Install Dev Tools Rocky 8
  ansible.builtin.yum:
    name:
    - gcc-toolset-11
    - gcc-toolset-9
    - cmake
    - python2-devel
    - python36-devel
  when: ansible_distribution == 'Rocky' and ansible_distribution_major_version == '8'

- name: Install Dev Tools Rocky 9
  ansible.builtin.yum:
    name:
    - gcc-toolset-11
    - cmake
    - python3-devel
  when: ansible_distribution == 'Rocky' and ansible_distribution_major_version == '9'

- name: Install Dev Tools CentOS
  ansible.builtin.yum:
    name:
    - devtoolset-9
    - devtoolset-11
    - cmake
    - python2-devel
    - python36-devel
  when: ansible_distribution in ['CentOS']


- name: Add DevTools to default shells on CentOS
  ansible.builtin.copy:
    dest: /etc/profile.d/98-devtools.sh
    content: |
      . /opt/rh/devtoolset-11/enable
    owner: root
    mode: 0755
    force: False
  when: ansible_distribution in ['CentOS']

- name: Add DevTools to default shells on Rocky
  ansible.builtin.copy:
    dest: /etc/profile.d/98-devtools.sh
    content: |
      . /opt/rh/gcc-toolset-11/enable
    owner: root
    mode: 0755
    force: False
  when: ansible_distribution in ['Rocky']

- name: Install Debian Dev tools
  ansible.builtin.apt:
    name:
    - cmake
  when: ansible_distribution == 'Debian'
