# Backend configuration for the test suite, with the same keys that the
# webserver startup script writes to configuration.yaml. All values are fake.
# baseDir is not set here: the test settings point it at a per-run scratch directory.
config:
  server:
    host_type: "GCP"
    gcp_project: "ofe-test-project"
    gcs_bucket: "ofe-test-bucket"
    terraform_state_bucket: "ofe-test-state-bucket"
    c2_topic: "ofe-test-c2"
    deployment_name: "ofe-test"
