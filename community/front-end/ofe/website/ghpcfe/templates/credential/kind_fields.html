<script>
  // Show only the fields of the chosen kind of credential: the key JSON for
  // an uploaded key, the account and project for an impersonated one
  (function () {
    var fieldsOf = {
      key: ["detail"],
      impersonate: ["service_account_email", "project_id"],
    };
    function show() {
      var checked = document.querySelector('input[name="kind"]:checked');
      var kind = checked ? checked.value : "key";
      Object.keys(fieldsOf).forEach(function (fieldKind) {
        fieldsOf[fieldKind].forEach(function (name) {
          var group = document.getElementById("group-" + name);
          if (group) {
            group.style.display = fieldKind === kind ? "" : "none";
          }
        });
      });
    }
    document.querySelectorAll('input[name="kind"]').forEach(function (radio) {
      radio.addEventListener("change", show);
    });
    show();
  })();
</script>
