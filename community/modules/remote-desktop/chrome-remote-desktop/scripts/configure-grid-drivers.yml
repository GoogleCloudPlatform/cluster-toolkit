---
- name: Ensure nvidia grid drivers and other binaries are installed
  hosts: localhost
  become: true
  vars:
    dist_settings:
      bullseye:
        packages:
        - build-essential
        - gdebi-core
        - mesa-utils
        - gdm3
        - linux-headers-{{ ansible_kernel }}
        grid_fn: NVIDIA-Linux-x86_64-510.85.02-grid.run
        grid_ver: vGPU14.2
      bookworm:
        packages:
        - build-essential
        - gdebi-core
        - mesa-utils
        - gdm3
        - linux-headers-{{ ansible_kernel }}
        grid_fn: NVIDIA-Linux-x86_64-550.54.15-grid.run
        grid_ver: vGPU17.1
      jammy:
        packages:
        - build-essential
        - gdebi-core
        - mesa-utils
        - gdm3
        - gcc-12 # must match compiler used to build kernel on latest Ubuntu 22
        - pkg-config # observed to be necessary for GRID driver installation on latest Ubuntu 22
        - libglvnd-dev # observed to be necessary for GRID driver installation on latest Ubuntu 22
        - linux-headers-{{ ansible_kernel }}
        grid_fn: NVIDIA-Linux-x86_64-525.125.06-grid.run
        grid_ver: vGPU15.3
      noble:
        packages:
        - build-essential
        - gdebi-core
        - mesa-utils
        - gdm3
        - pciutils
        - pkg-config
        - libglvnd-dev
        - linux-headers-{{ ansible_kernel }}
        grid_fn: NVIDIA-Linux-x86_64-595.112.07-grid.run
        grid_ver: vGPU20.3
        grid_sha256: "sha256:b055cc313d74be3416993503c42cc552cff75d899400d40d3622d28f9f8e2cd4"
  tasks:
  - name: Fail if using wrong OS
    ansible.builtin.assert:
      that:
      - ansible_os_family in ["Debian", "Ubuntu"]
      - ansible_distribution_release in dist_settings.keys() | list
      fail_msg: "ansible_os_family: {{ ansible_os_family }} or ansible_distribution_release: {{ansible_distribution_release}} was not acceptable."

  - name: Check if GRID driver installed
    ansible.builtin.command: which nvidia-smi
    register: nvidiasmi_result
    ignore_errors: true
    changed_when: false

  - name: Install binaries for GRID drivers
    ansible.builtin.apt:
      name: '{{ dist_settings[ansible_distribution_release]["packages"] }}'
      state: present
      update_cache: true
    register: apt_result
    retries: 6
    delay: 10
    until: apt_result is success

  - name: Detect attached NVIDIA GPU PCI devices
    when: ansible_distribution_release == "noble"
    ansible.builtin.command: "lspci -nn -d 10de:"
    register: lspci_nvidia
    changed_when: false

  - name: Disable NVIDIA GSP firmware on Turing vWS GPUs (T4)
    when:
    - ansible_distribution_release == "noble"
    - lspci_nvidia.stdout is search("Tesla T4|10de:1eb8")
    ansible.builtin.copy:
      dest: /etc/modprobe.d/nvidia-gsp.conf
      content: "options nvidia NVreg_EnableGpuFirmware=0\n"
      mode: "0644"
    register: gsp_conf

  - name: Configure nvidia_drm modeset=1 so GBM/EGL does not crash CRD Xorg/Xvfb
    when: ansible_distribution_release == "noble"
    ansible.builtin.copy:
      dest: /etc/modprobe.d/nvidia-drm.conf
      content: "options nvidia_drm modeset=1\n"
      mode: "0644"
    register: drm_modprobe_conf

  - name: Persist nvidia_drm module autoload across reboots
    when: ansible_distribution_release == "noble"
    ansible.builtin.copy:
      dest: /etc/modules-load.d/nvidia-drm.conf
      content: "nvidia_drm\n"
      mode: "0644"
    register: drm_modules_load_conf

  - name: Install GRID driver if not existing
    when: nvidiasmi_result is failed
    block:
    - name: Download GPU driver
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/nvidia-drivers-us-public/GRID/{{ dist_settings[ansible_distribution_release]["grid_ver"] }}/{{ dist_settings[ansible_distribution_release]["grid_fn"] }}
        dest: /tmp/{{ dist_settings[ansible_distribution_release]["grid_fn"] }}
        checksum: '{{ dist_settings[ansible_distribution_release].get("grid_sha256", omit) }}'
        mode: "0755"
        timeout: 60

    - name: Stop gdm service
      ansible.builtin.systemd:
        name: gdm
        state: stopped

    - name: Install GPU driver
      ansible.builtin.shell: |
        #jinja2: trim_blocks: "True"
        {% if ansible_distribution_release == "jammy" %}
        CC=gcc-12 /tmp/{{ dist_settings[ansible_distribution_release]["grid_fn"] }} --silent
        {% elif ansible_distribution_release == "noble" %}
        /tmp/{{ dist_settings[ansible_distribution_release]["grid_fn"] }} --silent -M=proprietary
        {% else %}
        /tmp/{{ dist_settings[ansible_distribution_release]["grid_fn"] }} --silent
        {% endif %}
      register: result
      changed_when: result.rc == 0

  - name: Download VirtualGL driver
    ansible.builtin.get_url:
      url: https://github.com/VirtualGL/virtualgl/releases/download/3.1.1/virtualgl_3.1.1_amd64.deb
      dest: /tmp/virtualgl_3.1.1_amd64.deb
      checksum: "sha256:796866b5a84dc47e57e9d45f5ea621c9dbc49a26344b89111a63d39ec8fc2184"
      mode: "0644"
      timeout: 30

  - name: Install VirtualGL
    ansible.builtin.command: gdebi /tmp/virtualgl_3.1.1_amd64.deb --non-interactive
    register: result
    changed_when: result.rc == 0

  - name: Fix headless Nvidia issue
    block:
    - name: Lookup gpu info
      ansible.builtin.command: nvidia-xconfig --query-gpu-info
      register: gpu_info
      failed_when: gpu_info.rc != 0
      changed_when: false

    - name: Extract PCI ID
      ansible.builtin.shell: |
        set -o pipefail
        echo "{{ gpu_info.stdout }}" | grep "PCI BusID " | head -n 1 | cut -d':' -f2-99 | xargs
      args:
        executable: /bin/bash
      register: pci_id
      changed_when: false

    - name: Configure nvidia-xconfig
      ansible.builtin.command: nvidia-xconfig -a --allow-empty-initial-configuration --enable-all-gpus --virtual=1920x1200 --busid={{ pci_id.stdout }}
      register: result
      changed_when: result.rc == 0

    - name: Set HardDPMS to false
      ansible.builtin.replace:
        path: /etc/X11/xorg.conf
        regexp: "Section \"Device\""
        replace: "Section \"Device\"\n    Option      \"HardDPMS\" \"false\""

  - name: Configure VirtualGL for X
    ansible.builtin.command: vglserver_config +glx +s +f -t
    register: result
    changed_when: result.rc == 0

  - name: Ensure nvidia_drm and nvidia_uvm kernel modules are loaded after vglserver_config
    when: ansible_distribution_release == "noble"
    ansible.builtin.shell: |
      set -e
      changed=false
      if [ ! -e /dev/dri/card0 ]; then
        modprobe -r nvidia_drm 2>/dev/null || true
        modprobe nvidia_drm modeset=1
        changed=true
      fi
      if [ ! -d /sys/module/nvidia_uvm ]; then
        modprobe nvidia_uvm
        changed=true
      fi
      if [ "$changed" = true ]; then
        echo "changed"
      fi
      exit 0
    args:
      executable: /bin/bash
    register: modprobe_drm_result
    changed_when: "'changed' in modprobe_drm_result.stdout"

  - name: Update initramfs to persist NVIDIA module options across reboots
    when:
    - ansible_distribution_release == "noble"
    - (nvidiasmi_result is failed) or (gsp_conf is changed) or (drm_modprobe_conf is changed) or (drm_modules_load_conf is changed)
    ansible.builtin.command: update-initramfs -u
    register: initramfs_result
    changed_when: initramfs_result.rc == 0

  - name: Configure gdm for X
    block:
    - name: Configure default display manager
      ansible.builtin.copy:
        dest: /etc/X11/default-display-manager
        content: "/usr/sbin/gdm3"
        mode: 0644

    - name: Switch boot target to gui
      ansible.builtin.command: systemctl set-default graphical.target
      register: result
      changed_when: result.rc == 0

    - name: Start gdm service
      ansible.builtin.systemd:
        name: gdm
        daemon_reload: true
        state: started
