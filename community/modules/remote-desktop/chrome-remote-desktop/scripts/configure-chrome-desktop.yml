---
- name: Ensure Desktop OS and Chrome Remote Desktop is installed
  hosts: localhost
  become: true
  module_defaults:
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  tasks:
  - name: Install desktop packages
    ansible.builtin.apt:
      name:
      - xfce4
      - xfce4-goodies
      state: present
    register: apt_result
    retries: 10
    delay: 30
    until: apt_result is success

  - name: Install the current CRD release
    block:
    - name: Download and configure CRD
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        dest: /tmp/chrome-remote-desktop_current_amd64.deb
        mode: "0755"
        timeout: 30

    - name: Install CRD
      ansible.builtin.apt:
        deb: /tmp/chrome-remote-desktop_current_amd64.deb
        lock_timeout: 300
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_result
      retries: 2
      delay: 30
      until: apt_result is success

    rescue:
    # TODO: Remove fallback once upstream chrome-remote-desktop fixes libxtst6 dependency on Ubuntu 24.04.
    - name: Download the last CRD release without the newer libxtst6 requirement
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/chrome-remote-desktop/deb/pool/main/c/chrome-remote-desktop/chrome-remote-desktop_157.0.8103.19_amd64.deb
        dest: /tmp/chrome-remote-desktop_157.0.8103.19_amd64.deb
        checksum: sha256:cb3883ec7fbef455a5a1f75303f9f84face53fe8c10464fb102218833ed3db61
        mode: "0755"
        timeout: 30

    - name: Install fallback CRD release
      ansible.builtin.apt:
        deb: /tmp/chrome-remote-desktop_157.0.8103.19_amd64.deb
        lock_timeout: 300
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_fallback_result
      retries: 10
      delay: 30
      until: apt_fallback_result is success

    - name: Hold CRD at the fallback release
      ansible.builtin.dpkg_selections:
        name: chrome-remote-desktop
        selection: hold

  - name: Configure CRD to use Xfce by default
    ansible.builtin.copy:
      dest: /etc/chrome-remote-desktop-session
      content: "exec /etc/X11/Xsession /usr/bin/xfce4-session"
      mode: 0644

  - name: Reload systemd daemon for Chrome Remote Desktop
    ansible.builtin.systemd:
      daemon_reload: true
