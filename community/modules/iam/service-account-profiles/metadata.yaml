---

spec:
  requirements:
    services:
    - iam.googleapis.com
    - cloudresourcemanager.googleapis.com

ghpc:
  validators:
  - validator: allowed_enum
    inputs:
      vars: [profile]
      allowed: [slurm-controller, slurm-login, slurm-compute, image-builder, custom]
      allow_null: false
    error_message: "Invalid value for profile. Must be one of: slurm-controller, slurm-login, slurm-compute, image-builder, custom."
  # These repeat main.tf's role_stages, role_deletion_policies and
  # id_part_pattern so bad input fails at gcluster create; keep them in step.
  - validator: allowed_enum
    inputs:
      vars: [custom_role_stage]
      allowed: [ALPHA, BETA, GA, DEPRECATED, DISABLED, EAP]
      allow_null: true
    error_message: "Invalid value for custom_role_stage. Must be unset or one of: ALPHA, BETA, GA, DEPRECATED, DISABLED, EAP."
  - validator: allowed_enum
    inputs:
      vars: [custom_role_deletion_policy]
      allowed: [PREVENT, ABANDON, DELETE]
      allow_null: true
    error_message: "Invalid value for custom_role_deletion_policy. Must be unset or one of: PREVENT, ABANDON, DELETE."
  - validator: regex
    inputs:
      vars: [deployment_name, name]
      concat: true
      separator: "."
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?[.][a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    error_message: "deployment_name and name must each be lowercase letters, digits and dashes, not starting or ending with a dash: the generated custom role id is built from them."
  # role_id_suffix is left out: a concat check is skipped when any of its
  # settings is unset. The Terraform validation on name counts the suffix.
  - validator: regex
    inputs:
      vars: [deployment_name, name]
      concat: true
      separator: "."
      pattern: "^.{3,57}$"
    error_message: "deployment_name + name together can be at most 56 characters, as the generated role id <deployment_name>.<name>.scoped is limited to 64."
