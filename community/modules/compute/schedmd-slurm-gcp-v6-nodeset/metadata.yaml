---

spec:
  requirements:
    services: []
ghpc:
  inject_module_id: name
  has_to_be_used: true
  validators:
  - validator: allowed_enum
    inputs:
      vars: [bandwidth_tier]
      allowed:
      - platform_default
      - virtio_enabled
      - gvnic_enabled
      - tier_1_enabled
      allow_null: false
    error_message: "Allowed values for bandwidth_tier are 'platform_default', 'virtio_enabled', 'gvnic_enabled', or 'tier_1_enabled'."
  - validator: allowed_enum
    inputs:
      vars: [on_host_maintenance]
      allowed:
      - MIGRATE
      - TERMINATE
      allow_null: false
    error_message: "Allowed values for on_host_maintenance are 'MIGRATE' or 'TERMINATE'."
  - validator: allowed_enum
    inputs:
      vars: [provisioning_engine]
      allowed:
      - AUTO
      - MIG
      - BULK_INSERT
      allow_null: false
    error_message: "Allowed values for provisioning_engine are 'AUTO', 'MIG', or 'BULK_INSERT'."
  - validator: allowed_enum
    inputs:
      vars: [zone_target_shape]
      allowed:
      - ANY
      - ANY_SINGLE_ZONE
      - BALANCED
      allow_null: true
    error_message: "Allowed values for zone_target_shape are 'ANY', 'ANY_SINGLE_ZONE', or 'BALANCED'."
  - validator: conditional
    inputs:
      trigger: provisioning_engine
      trigger_value: MIG
      dependent: node_count_dynamic_max
      dependent_value: 0
    error_message: "When 'provisioning_engine' is 'MIG', 'node_count_dynamic_max' must be explicitly set to 0. (Note: DWS Flex NodeSets should leave 'provisioning_engine' as 'AUTO')."
  - validator: exclusive
    inputs:
      vars: [instance_image.name, instance_image.family]
    error_message: "In 'instance_image', at most one of the \"family\" or \"name\" fields can be set."
  - validator: exclusive
    inputs:
      vars: [future_reservation, zones]
    error_message: "If a future reservation is specified, `zones` should be empty."
  - validator: exclusive
    inputs:
      vars: [enable_placement, future_reservation]
    error_message: "Cannot use `enable_placement` with future reservations."
  - validator: exclusive
    inputs:
      vars: [reservation_name, future_reservation]
    error_message: "Cannot use reservations and future reservations in the same nodeset."
  - validator: exclusive
    inputs:
      vars: [enable_spot_vm, dws_flex.enabled]
    error_message: "Cannot use both Flex-Start and Spot VMs for provisioning."
  - validator: exclusive
    inputs:
      vars: [zones, dws_flex.enabled]
    error_message: "If a DWS Flex is enabled, `zones` should be empty."
  - validator: exclusive
    inputs:
      vars: [reservation_name, dws_flex.enabled]
    error_message: "Cannot use reservations with DWS Flex."
  - validator: exclusive
    inputs:
      vars: [reservation_name, enable_spot_vm]
    error_message: "Cannot use reservations with Spot VMs for provisioning."
  - validator: exclusive
    inputs:
      vars: [future_reservation, enable_spot_vm]
    error_message: "Cannot use future reservations with Spot VMs for provisioning."
  - validator: exclusive
    inputs:
      vars: [future_reservation, dws_flex.enabled]
    error_message: "Cannot use future reservations with DWS Flex."
  - validator: exclusive
    inputs:
      vars: [reservation_name, zones]
    error_message: "If a reservation is specified, `zones` should be empty."
  - validator: conditional_regex
    inputs:
      triggers:
        dws_flex.enabled: true
        enable_placement: true
      dependent: machine_type
      pattern: "^(a3-ultragpu-|a4-|h4d-)"
    error_message: "Compact placement with DWS Flex is only supported for A3 Ultra, A4, and H4D machine types."
  - validator: conditional_regex
    inputs:
      triggers:
        provisioning_engine: "MIG"
        enable_placement: true
      dependent: accelerator_topology
      pattern: "^[1-9][0-9]*[xX][1-9][0-9]*$"
      required: true
    error_message: "MIG provisioning engine only supports enable_placement when accelerator_topology is specified (e.g. '1x72')."
  - validator: conditional
    inputs:
      triggers:
        # A null expected value in 'triggers' matches when the setting is set (non-null)
        accelerator_topology: null
        provisioning_engine: "MIG"
        dws_flex.enabled: false
      dependent: node_count_dynamic_max
      dependent_value: 0
    error_message: "When 'accelerator_topology' is specified with 'provisioning_engine: MIG', 'node_count_dynamic_max' must be explicitly set to 0."
  - validator: exclusive
    inputs:
      vars: [instance_flexibility_policy, accelerator_topology]
    error_message: "instance_flexibility_policy cannot be combined with accelerator_topology."
  - validator: exclusive
    inputs:
      vars: [instance_flexibility_policy, dws_flex.enabled]
    error_message: "instance_flexibility_policy is not supported with DWS Flex."
  - validator: exclusive
    inputs:
      vars: [instance_flexibility_policy, reservation_name]
    error_message: "instance_flexibility_policy cannot be combined with a reservation; a specific reservation pins a single machine type."
  - validator: exclusive
    inputs:
      vars: [instance_flexibility_policy, future_reservation]
    error_message: "instance_flexibility_policy cannot be combined with a future reservation; a specific reservation pins a single machine type."
  - validator: conditional
    inputs:
      triggers:
        instance_flexibility_policy: null
      dependent: provisioning_engine
      dependent_value: MIG
    error_message: "instance_flexibility_policy requires 'provisioning_engine' to be explicitly set to 'MIG'."
  - validator: conditional_regex
    inputs:
      triggers:
        instance_flexibility_policy: null
      dependent: machine_type
      pattern: "^(a3-ultragpu|a4|a4x)-"
      match_expected: false
    error_message: "instance_flexibility_policy is not supported on a3-ultragpu, a4, or a4x machine types."
  - validator: conditional_regex
    inputs:
      triggers:
        dws_flex.enabled: true
        dws_flex.use_bulk_insert: false
      dependent: zone_target_shape
      pattern: "^(ANY_SINGLE_ZONE|ANY)$"
    error_message: "DWS Flex (FLEX_START) Regional MIGs only support zone_target_shape of 'ANY_SINGLE_ZONE' or 'ANY'; 'BALANCED' is rejected by Compute Engine."
