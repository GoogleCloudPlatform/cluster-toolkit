name: gke-hyperdisk
description: Dynamically provisioned Hyperdisk volume for GKE (balanced, throughput, or extreme)

config_base:
  gke:
    deployment_groups:
    - group: auto
      modules:
      - id: "{name}"
        source: modules/file-system/gke-storage
        use: [cluster]
        export: true
        settings:
          # Override storage_type to Hyperdisk-throughput for streaming reads or
          # Hyperdisk-extreme for IOPS-bound checkpointing.
          storage_type: Hyperdisk-balanced
          access_mode: ReadWriteOnce
          sc_reclaim_policy: Delete
          capacity_gb: 2048
