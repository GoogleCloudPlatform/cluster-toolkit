name: cloud-storage
description: "Provisions a GCS Bucket and mounts it to GKE via gcsfusecsi."
deployment_groups:
- group: auto
  modules:
  - id: "{name}_bucket"
    source: modules/file-system/cloud-storage-bucket
    export: true
    settings:
      name_prefix: "{name}"
      random_suffix: true
      enable_hierarchical_namespace: true
config_base:
  gke:
    deployment_groups:
      # LAYERING RULE: the capability that needs a cluster-level toggle owns it.
    - group: cluster
      modules:
      - id: cluster
        source: modules/scheduler/gke-cluster
        settings:
          enable_gcsfuse_csi: true
    - group: auto
      modules:
      - id: "{name}_bucket"
        source: modules/file-system/cloud-storage-bucket
        settings:
          mount_options: "defaults,_netdev,implicit-dirs"
      - id: "{name}_pv"
        source: modules/file-system/gke-persistent-volume
        export: true
        use: ["{name}_bucket", cluster]
        settings:
          capacity_gib: 1000000
          lustre_id: null
          filestore_id: null
