# ABSORBED THE FORMER `kubectl-apply` FEATURE.
# Both features wrapped the same module, `modules/management/kubectl-apply`; this one was
# only that module with `kueue.install` / `jobset.install` preset, while `kubectl-apply`
# was the same module with nothing preset. Two features
# for one module meant two places to fix anything, so they are now one.
#
# Consequences worth knowing:
#   - This is the ONLY feature that may install cluster-wide controllers. Compute
#     archetypes also emit a `{pool}_manager` kubectl-apply for silicon enablement (gIB,
#     TCPX/TCPXO, DRA); two modules installing the same DaemonSet is a Terraform race, so
#     do not add silicon enablement here.
#   - Settings route to `{name}_manager`, so every input the module declares is reachable
#     from a cluster-config -- including `apply_manifests` for arbitrary YAML.
#   - Job overlays do NOT install these controllers themselves. A config using a job overlay
#     must also list `type: kueue-jobset`.
name: kueue-jobset
description: "Installs Kueue job queuing and JobSet batch scheduling on GKE; also the carrier for arbitrary kubectl-apply manifests."
config_base:
  gke:
    deployment_groups:
    - group: auto
      modules:
      - id: "{name}_manager"
        source: modules/management/kubectl-apply
        use: [cluster]
        settings:
          kueue:
            install: true
          jobset:
            install: true
