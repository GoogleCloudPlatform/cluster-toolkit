---

# Owns the wiring for a Kubernetes batch Job/JobSet on GKE. Overlays (or power users
# specifying `settings.image`) supply the container workload (`image`, `command`, `node_count`).
name: gke-job-template
description: Runs a containerised batch job on a GKE node pool; an overlay supplies the job

assertions:
- rule: 'settings.image != "" && settings.image != "debian"'
  message: 'feature "gke-job-template" requires `settings.image` (or list a workload overlay under `overlays:` such as `run-nvidia-smi`, `fio-bench-job`, or `nccl-jobset-test`).'

config_base:
  gke:
    deployment_groups:
    - group: cluster
      modules:
      - id: "{name}"
        source: modules/compute/gke-job-template
        export: true
        outputs: [instructions]
        settings:
          name: "{name}"
          k8s_service_account_name: workload-identity-k8s-sa
