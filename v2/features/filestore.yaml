name: filestore
description: "Configures and mounts a Google Cloud Filestore instance."
deployment_groups:
- group: auto
  modules:
    # 1. CONDITIONAL PREREQUISITE
  - id: "private_service_access"
    source: modules/network/private-service-access
    condition: "settings.connect_mode == 'PRIVATE_SERVICE_ACCESS'"
    use: [network]
    settings:
      prefix_length: 22
  # 2. PRIMARY FEATURE MODULE (Receives user settings)
  - id: "{name}"
    source: modules/file-system/filestore
    export: true
    use: [network, "private_service_access"]
# BASE-SPECIFIC EXTENSIONS
config_base:
  gke:
    deployment_groups:
    - group: cluster
      modules:
      - id: cluster
        source: modules/scheduler/gke-cluster
        settings:
          enable_filestore_csi: true
    - group: auto
      modules:
      - id: "{name}_volume_mapping"
        source: modules/file-system/gke-persistent-volume
        export: true
        use: ["{name}", cluster]
        settings:
          gcs_bucket_name: null
          lustre_id: null
