---

name: nccl-jobset-test
description: Multi-node NCCL all_reduce_perf bandwidth test over GPUDirect RDMA / TCPX-O
config_base: gke

features:
- name: nccl-jobset-test
  type: gke-job-template
  settings:
    image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic:v1.1.2
    node_count: 2
    k8s_service_account_name: workload-identity-k8s-sa
    tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule
    command:
    - /bin/bash
    - -c
    - |
      set -ex
      /usr/local/nvidia/bin/nvidia-smi -L
      NUM_GPUS=\$(/usr/local/nvidia/bin/nvidia-smi -L | wc -l)
      /third_party/nccl-tests/build/all_reduce_perf -b 8M -e 8G -f 2 -g "${NUM_GPUS:-1}"
