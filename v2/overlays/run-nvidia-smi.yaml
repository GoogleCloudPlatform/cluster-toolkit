---

name: run-nvidia-smi
description: GPU visibility check - runs `nvidia-smi` across every node in the pool
config_base: gke

features:
- name: run-nvidia-smi
  type: gke-job-template
  settings:
    image: nvidia/cuda:12.8.0-runtime-ubuntu24.04
    command: [nvidia-smi]
    node_count: 1
    k8s_service_account_name: workload-identity-k8s-sa
    tolerations:
    - key: kubernetes.io/arch
      operator: Equal
      value: arm64
      effect: NoSchedule
