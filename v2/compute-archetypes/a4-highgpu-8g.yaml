---

name: a4-highgpu-8g
description: NVIDIA B200 (8x Blackwell GPU) compute archetype with 8x 400Gbps GPUDirect-RDMA (RoCEv2) networking.

config_base:
  slurm:
    vars:
      disk_size_gb: 300
      nic_count: 8
      rdma_mtu: 8896
      local_ssd_mountpoint: /mnt/localssd
      benchmark_dir: $(ghpc_stage("examples/machine-learning/a4-highgpu-8g/system_benchmarks"))
      a4_cluster_size: 2
      a4_reservation_name: ""
      a4_dws_flex_enabled: false
      a4_enable_spot_vm: false
    deployment_groups:
    - group: cluster
      modules:
      - id: controller_startup
        source: modules/scripts/startup-script
        settings:
          runners:
          - type: shell
            destination: ensure_mnt_localssd_permissions.sh
            content: |
              #!/bin/bash
              mkdir -p $(vars.local_ssd_mountpoint)
              chmod 1777 $(vars.local_ssd_mountpoint)
          - type: data
            destination: /etc/enroot/enroot.conf
            content: |
              ENROOT_CONFIG_PATH     ${HOME}/.enroot
              ENROOT_RUNTIME_PATH    $(vars.local_ssd_mountpoint)/${UID}/enroot/runtime
              ENROOT_CACHE_PATH      $(vars.local_ssd_mountpoint)/${UID}/enroot/cache
              ENROOT_DATA_PATH       $(vars.local_ssd_mountpoint)/${UID}/enroot/data
              ENROOT_TEMP_PATH       $(vars.local_ssd_mountpoint)/${UID}/enroot
          - type: shell
            destination: stage_scripts.sh
            content: |
              #!/bin/bash
              SLURM_ROOT=/opt/apps/adm/slurm
              PARTITION_NAME=$({name}_partition.partitions[0].partition_name)
              mkdir -m 0755 -p "${SLURM_ROOT}/scripts"
              mkdir -p "${SLURM_ROOT}/partition-${PARTITION_NAME}-epilog_slurmd.d"
              ln -sf "/slurm/scripts/tools/gpu-test" "${SLURM_ROOT}/partition-${PARTITION_NAME}-epilog_slurmd.d/gpu-test.epilog_slurmd"
              mkdir -p "${SLURM_ROOT}/prolog_slurmd.d"
              mkdir -p "${SLURM_ROOT}/epilog_slurmd.d"
              curl -s -o "${SLURM_ROOT}/scripts/sudo-oslogin" \
                  https://raw.githubusercontent.com/GoogleCloudPlatform/slurm-gcp/master/tools/prologs-epilogs/sudo-oslogin
              chmod 0755 "${SLURM_ROOT}/scripts/sudo-oslogin"
              ln -sf "${SLURM_ROOT}/scripts/sudo-oslogin" "${SLURM_ROOT}/prolog_slurmd.d/sudo-oslogin.prolog_slurmd"
              ln -sf "${SLURM_ROOT}/scripts/sudo-oslogin" "${SLURM_ROOT}/epilog_slurmd.d/sudo-oslogin.epilog_slurmd"
          - type: data
            destination: /opt/apps/system_benchmarks/run-nccl-tests-via-ramble.sh
            source: $(vars.benchmark_dir)/run-nccl-tests-via-ramble.sh
          - type: data
            destination: /opt/apps/system_benchmarks/README.md
            source: $(vars.benchmark_dir)/README.md
      - id: slurm_controller
        source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
        settings:
          instance_image:
            project: advanced-compute-images
            family: aci-gpu-u2404-slurm-2511-cuda-130-nvidia-580-amd64
          disk_type: pd-extreme
          disk_size_gb: 300
          machine_type: n2d-standard-8
          enable_external_prolog_epilog: true
          compute_startup_scripts_timeout: 1800
          metadata:
            user-data: |
              #cloud-config
              create_hostname_file: true
      - id: slurm_login
        source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
        settings:
          instance_image:
            project: advanced-compute-images
            family: aci-gpu-u2404-slurm-2511-cuda-130-nvidia-580-amd64
          machine_type: n2-standard-8
          metadata:
            user-data: |
              #cloud-config
              create_hostname_file: true
    - group: cluster-env
      modules:
      - id: net-1
        source: modules/network/vpc
        settings:
          network_name: "$(vars.deployment_name)-net-1"
          mtu: $(vars.rdma_mtu)
          enable_internal_traffic: false
          subnetworks:
          - subnet_name: "$(vars.deployment_name)-sub-1"
            subnet_region: "$(vars.region)"
            subnet_ip: 192.168.64.0/18
          firewall_rules:
          - name: "$(vars.deployment_name)-internal-1"
            ranges: ["192.168.64.0/18"]
            allow:
            - protocol: tcp
            - protocol: udp
            - protocol: icmp
      - id: rdma-net
        source: modules/network/gpu-rdma-vpc
        settings:
          network_name: "$(vars.deployment_name)-rdma-net"
          network_profile: https://www.googleapis.com/compute/beta/projects/$(vars.project_id)/global/networkProfiles/$(vars.zone)-vpc-roce
          network_routing_mode: REGIONAL
          subnetworks_template:
            name_prefix: "$(vars.deployment_name)-mrdma-sub"
            count: $(vars.nic_count)
            ip_range: 192.168.128.0/18
            region: "$(vars.region)"
    - group: cluster
      modules:
      - id: "{name}_nodeset"
        source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
        export: true
        use: [network, "{name}_a4_startup"]
        settings:
          name: "{name}"
          instance_image:
            project: advanced-compute-images
            family: aci-gpu-u2404-slurm-2511-cuda-130-nvidia-580-amd64
          machine_type: a4-highgpu-8g
          bandwidth_tier: gvnic_enabled
          disk_type: hyperdisk-balanced
          on_host_maintenance: TERMINATE
          reservation_name: $(vars.a4_reservation_name)
          enable_spot_vm: $(vars.a4_enable_spot_vm)
          dws_flex:
            enabled: $(vars.a4_dws_flex_enabled)
          enable_public_ips: true
          allow_automatic_updates: false
          node_count_static: $(vars.a4_cluster_size)
          node_count_dynamic_max: 0
          enable_placement: false
          disk_size_gb: $(vars.disk_size_gb)
          advanced_machine_features:
            threads_per_core: null
          metadata:
            user-data: |
              #cloud-config
              create_hostname_file: true
          node_conf:
            CoresPerSocket: 56
            SocketsPerBoard: 2
            ThreadsPerCore: 2
          additional_networks:
            $(concat(
              [{
                network=null,
                subnetwork=net-1.subnetwork_self_link,
                subnetwork_project=vars.project_id,
                nic_type="GVNIC",
                queue_count=null,
                network_ip="",
                stack_type=null,
                access_config=[],
                ipv6_access_config=[],
                alias_ip_range=[]
              }],
              rdma-net.subnetwork_interfaces
            ))
      - id: "{name}_partition"
        source: community/modules/compute/schedmd-slurm-gcp-v6-partition
        export: true
        use: ["{name}_nodeset"]
        settings:
          partition_name: "{name}"
          exclusive: false
          is_default: true
          partition_conf:
            OverSubscribe: EXCLUSIVE
            ResumeTimeout: 1200
            SuspendTimeout: 1200
      - id: "{name}_a4_startup"
        source: modules/scripts/startup-script
        export: true
        settings:
          install_ansible: true
          local_ssd_filesystem:
            mountpoint: $(vars.local_ssd_mountpoint)
            permissions: "1777"
          docker:
            enabled: true
            world_writable: true
            daemon_config: |
              {
                "data-root": "$(vars.local_ssd_mountpoint)/docker"
              }
          runners:
          - type: data
            destination: /etc/enroot/enroot.conf
            content: |
              ENROOT_CONFIG_PATH     ${HOME}/.enroot
              ENROOT_RUNTIME_PATH    $(vars.local_ssd_mountpoint)/${UID}/enroot/runtime
              ENROOT_CACHE_PATH      $(vars.local_ssd_mountpoint)/${UID}/enroot/cache
              ENROOT_DATA_PATH       $(vars.local_ssd_mountpoint)/${UID}/enroot/data
              ENROOT_TEMP_PATH       $(vars.local_ssd_mountpoint)/${UID}/enroot
          - type: shell
            destination: fix_enroot_env.sh
            content: |
              #!/bin/bash
              if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
                sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                echo "kernel.apparmor_restrict_unprivileged_userns = 0" > /etc/sysctl.d/90-enroot-namespaces.conf
              fi
          - type: ansible-local
            destination: install_cuda_and_dcgm.yml
            content: |
              ---
              - name: Install and Configure CUDA 13 / DCGM 4.6.1 for B200
                hosts: all
                become: true
                vars:
                  cuda_installer_url: "https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_580.65.06_linux.run"
                  cuda_installer_file: "/tmp/cuda_13.0.0_580.65.06_linux.run"
                  nvidia_packages:
                    - datacenter-gpu-manager-4-core=1:4.6.1-1
                    - datacenter-gpu-manager-4-dev=1:4.6.1-1
                    - datacenter-gpu-manager-4-cuda13=1:4.6.1-1
                tasks:
                  - name: Download CUDA runfile
                    ansible.builtin.get_url:
                      url: "{{ cuda_installer_url }}"
                      dest: "{{ cuda_installer_file }}"
                      mode: '0755'
                  - name: Install CUDA toolkit via runfile
                    ansible.builtin.command:
                      cmd: "{{ cuda_installer_file }} --silent --toolkit"
                  - name: Remove CUDA runfile
                    ansible.builtin.file:
                      path: "{{ cuda_installer_file }}"
                      state: absent
                  - name: Install NVIDIA repository keyring
                    ansible.builtin.apt:
                      deb: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
                      state: present
                  - name: Update apt cache
                    ansible.builtin.apt:
                      update_cache: yes
                  - name: Install NVIDIA Packages
                    ansible.builtin.apt:
                      name: "{{ nvidia_packages }}"
                      state: present
                      allow_downgrade: yes
                  - name: Freeze DCGM packages
                    ansible.builtin.dpkg_selections:
                      name: "{{ item.split('=')[0] }}"
                      selection: hold
                    loop: "{{ nvidia_packages }}"
          - type: ansible-local
            destination: enable_dcgm.yml
            content: |
              ---
              - name: Enable NVIDIA DCGM on B200 GPU nodes
                hosts: all
                become: true
                vars:
                  enable_ops_agent: true
                  enable_nvidia_dcgm: true
                  enable_nvidia_persistenced: true
                tasks:
                  - name: Update Ops Agent configuration
                    ansible.builtin.blockinfile:
                      path: /etc/google-cloud-ops-agent/config.yaml
                      insertafter: EOF
                      block: |
                        metrics:
                          receivers:
                            dcgm:
                              type: dcgm
                          service:
                            pipelines:
                              dcgm:
                                receivers:
                                  - dcgm
                    notify:
                      - Restart Google Cloud Ops Agent
                handlers:
                  - name: Restart Google Cloud Ops Agent
                    ansible.builtin.service:
                      name: google-cloud-ops-agent.service
                      state: "{{ 'restarted' if enable_ops_agent else 'stopped' }}"
                      enabled: "{{ enable_ops_agent }}"
                post_tasks:
                  - name: Enable Google Cloud Ops Agent
                    ansible.builtin.service:
                      name: google-cloud-ops-agent.service
                      state: "{{ 'started' if enable_ops_agent else 'stopped' }}"
                      enabled: "{{ enable_ops_agent }}"
                  - name: Enable NVIDIA DCGM service
                    ansible.builtin.service:
                      name: nvidia-dcgm.service
                      state: "{{ 'started' if enable_nvidia_dcgm else 'stopped' }}"
                      enabled: "{{ enable_nvidia_dcgm }}"
                  - name: Enable NVIDIA Persistence Daemon
                    ansible.builtin.service:
                      name: nvidia-persistenced.service
                      state: "{{ 'started' if enable_nvidia_persistenced else 'stopped' }}"
                      enabled: "{{ enable_nvidia_persistenced }}"

  gke:
    vars:
      # Staged here, not in the cluster-config: ghpc_stage() resolves relative
      # paths against the USER's config file, so a repo-relative path only works
      # from inside the catalog.
      kueue_configuration_path: $(ghpc_stage("examples/gke-a4/kueue-configuration.yaml.tftpl"))
      gib_installer_path: $(ghpc_stage("examples/gke-a4/nccl-installer.yaml.tftpl"))
      gpu_count: 8
      nic_count: 8
      a4_cluster_size: 1
      # Consumption model. Defaults to on-demand; set at most one of these.
      a4_enable_spot_vm: false
      a4_dws_flex_enabled: false
      disk_size_gb: 100
    deployment_groups:
    - group: cluster
      modules:
      - id: cluster
        source: modules/scheduler/gke-cluster
        settings:
          system_node_pool_machine_type: n2d-standard-8
          system_node_pool_disk_size_gb: 200
          enable_dcgm_monitoring: true
          enable_gcsfuse_csi: true
          enable_dataplane_v2: true
          release_channel: REGULAR
          additional_networks:
            $(concat(net-1.instance_additional_networks,
             rdma-net.subnetwork_interfaces_gke
            ))
      - id: net-1
        source: modules/network/vpc
        settings:
          network_name: "$(vars.deployment_name)-net-1"
          ips_per_nat: 6
          subnetworks:
          - subnet_name: "$(vars.deployment_name)-sub-1"
            subnet_region: "$(vars.region)"
            subnet_ip: 192.168.64.0/18
          firewall_rules:
          - name: "$(vars.deployment_name)-internal-1"
            ranges: [192.168.0.0/16]
            allow:
            - protocol: tcp
              ports: ["0-65535"]
            - protocol: udp
              ports: ["0-65535"]
            - protocol: icmp
      - id: rdma-net
        source: modules/network/gpu-rdma-vpc
        settings:
          network_name: $(vars.deployment_name)-rdma-net
          network_profile: https://www.googleapis.com/compute/beta/projects/$(vars.project_id)/global/networkProfiles/$(vars.zone)-vpc-roce
          network_routing_mode: REGIONAL
          subnetworks_template:
            name_prefix: $(vars.deployment_name)-rdma-sub
            count: $(vars.nic_count)
            ip_range: 192.168.128.0/18
            region: $(vars.region)
      # gIB NCCL plugin, as in the reference gke-a4.yaml and the a3-ultragpu / a4x
      # archetypes. Owned by the archetype so every a4 GKE cluster gets it without
      # the cluster-config having to route it through the kueue feature.
      - id: workload_manager
        source: modules/management/kubectl-apply
        use: [cluster]
        settings:
          gib:
            install: true
            path: $(vars.gib_installer_path)
            template_vars:
              version: v1.1.2
              accelerator_count: 8
      - id: "{name}_pool"
        source: modules/compute/gke-node-pool
        export: true
        use: [cluster, node_pool_service_account]
        settings:
          machine_type: a4-highgpu-8g
          auto_upgrade: true
          auto_repair: $(!vars.a4_dws_flex_enabled)
          enable_dranet: true
          zones: [$(vars.zone)]
          disk_size_gb: $(vars.disk_size_gb)
          static_node_count: $(vars.a4_cluster_size)
          guest_accelerator:
          - type: nvidia-b200
            count: $(vars.gpu_count)
          spot: $(vars.a4_enable_spot_vm)
          enable_flex_start: $(vars.a4_dws_flex_enabled)
        outputs:
        - instructions

  jbvm:
    vars:
      gpu_count: 8
      nic_count: 8
      rdma_mtu: 8896
      hostname_prefix: "$(vars.deployment_name)-a4"
      local_ssd_mountpoint: /mnt/localssd
      a4_reservation_name: "" # supply reservation name
      # Consumption model: STANDARD (on-demand), SPOT, or RESERVATION_BOUND.
      a4_provisioning_model: STANDARD
      number_of_vms: 2
    deployment_groups:
    - group: cluster-env
      modules:
      - id: net-1
        source: modules/network/vpc
        settings:
          network_name: "$(vars.deployment_name)-net-1"
          mtu: $(vars.rdma_mtu)
          subnetworks:
          - subnet_name: "$(vars.deployment_name)-sub-1"
            subnet_region: "$(vars.region)"
            subnet_ip: 192.168.64.0/18
          firewall_rules:
          - name: "$(vars.deployment_name)-internal-1"
            ranges: [192.168.64.0/18]
            allow:
            - protocol: tcp
            - protocol: udp
            - protocol: icmp
      - id: rdma-net
        source: modules/network/gpu-rdma-vpc
        settings:
          network_name: $(vars.deployment_name)-rdma-net
          network_profile: https://www.googleapis.com/compute/beta/projects/$(vars.project_id)/global/networkProfiles/$(vars.zone)-vpc-roce
          network_routing_mode: REGIONAL
          subnetworks_template:
            name_prefix: $(vars.deployment_name)-rdma-sub
            count: $(vars.nic_count)
            ip_range: 192.168.128.0/18
            region: $(vars.region)
    - group: cluster
      modules:
      - id: "{name}_instance"
        source: modules/compute/vm-instance
        use: ["{name}_startup_script"]
        settings:
          instance_image:
            project: ubuntu-os-accelerator-images
            name: ubuntu-accelerator-2204-amd64-with-nvidia-570-v20260210
          machine_type: a4-highgpu-8g
          name_prefix: $(vars.hostname_prefix)
          disk_type: hyperdisk-balanced
          automatic_restart: false
          on_host_maintenance: TERMINATE
          instance_count: $(vars.number_of_vms)
          provisioning_model: $(vars.a4_provisioning_model)
          reservation_name: $(vars.a4_reservation_name)
          guest_accelerator:
          - type: nvidia-b200
            count: $(vars.gpu_count)
          network_interfaces:
            $(concat(
              [
              merge(network.instance_additional_networks[0],
              { access_config = [{ nat_ip = null, public_ptr_domain_name = null, network_tier = null }] }),
              merge(net-1.instance_additional_networks[0],
              { access_config = [{ nat_ip = null, public_ptr_domain_name = null, network_tier = null }] })
              ],
              rdma-net.subnetwork_interfaces
            ))
      - id: "{name}_startup_script"
        source: modules/scripts/startup-script
        settings:
          configure_ssh_host_patterns:
          - $(vars.hostname_prefix)-*
          local_ssd_filesystem:
            mountpoint: $(vars.local_ssd_mountpoint)
            permissions: "1777" # must quote numeric filesystem permissions!
          docker:
            enabled: true
            world_writable: true
            daemon_config: |
              {
                "data-root": "$(vars.local_ssd_mountpoint)/docker"
              }

          runners:
          - type: data
            destination: /etc/security/limits.d/99-unlimited.conf
            content: |
              * - memlock unlimited
              * - nproc unlimited
              * - stack unlimited
              * - nofile 1048576
              * - cpu unlimited
              * - rtprio unlimited

          # Install Nvidia driver / CUDA components
          - type: ansible-local
            destination: install_a4h_drivers.yml
            content: |
              ---
              - name: Install A4 Drivers and Utils
                hosts: all
                become: true
                vars:
                  distribution: "{{ ansible_distribution | lower }}{{ ansible_distribution_version | replace('.','') }}"
                  cuda_repo_url: https://developer.download.nvidia.com/compute/cuda/repos/{{ distribution }}/x86_64/cuda-keyring_1.1-1_all.deb
                  cuda_repo_filename: /tmp/{{ cuda_repo_url | basename }}
                  enable_nvidia_dcgm: false
                  nvidia_packages:
                  - nvidia-open-570
                  - nvidia-utils-570
                  - nvidia-container-toolkit
                  - cuda-toolkit-12-8
                  - datacenter-gpu-manager
                  - libnvidia-nscq-570
                tasks:
                - name: Download NVIDIA repository package
                  ansible.builtin.get_url:
                    url: "{{ cuda_repo_url }}"
                    dest: "{{ cuda_repo_filename }}"
                - name: Install NVIDIA repository package
                  ansible.builtin.apt:
                    deb: "{{ cuda_repo_filename }}"
                    state: present
                - name: Update apt cache
                  ansible.builtin.apt:
                    update_cache: true
                - name: Install NVIDIA fabric and CUDA
                  ansible.builtin.apt:
                    name: "{{ item }}"
                  loop: "{{ nvidia_packages }}"
                - name: Freeze NVIDIA fabric and CUDA
                  ansible.builtin.dpkg_selections:
                    name: "{{ item }}"
                    selection: hold
                  loop: "{{ nvidia_packages }}"
                post_tasks:
                # Enable DCGM monitoring
                - name: Enable NVIDIA DCGM by default
                  ansible.builtin.service:
                    name: nvidia-dcgm.service
                    state: started
                    enabled: true

                # Enable persistenced service
                - name: Enable nvidia-persistenced
                  ansible.builtin.service:
                    name: nvidia-persistenced.service
                    state: started
                    enabled: true

          # Install ibverbs-utils
          - type: ansible-local
            destination: install_ibverbs_utils.yml
            content: |
              ---
              - name: Install ibverbs-utils
                hosts: all
                become: true
                tasks:
                - name: Install Linux Modules Extra
                  ansible.builtin.package:
                    name:
                    - ibverbs-utils
                    state: present

          # Install NCCL
          - type: ansible-local
            destination: install_nccl.yml
            content: |
              ---
              - name: Install nccl
                hosts: all
                become: true
                tasks:
                - name: Install Linux Modules Extra
                  ansible.builtin.package:
                    name:
                    - libnccl2
                    - libnccl-dev
                    state: present

          # Install OpenMPI
          - type: ansible-local
            destination: install_openmpi.yml
            content: |
              ---
              - name: Install MPI packages
                hosts: all
                become: true
                vars:
                  mpi_packages:
                  - libopenmpi-dev
                  - libpmix-dev
                  - libucx-dev
                  - ucx-utils
                tasks:
                - name: Install Packages
                  ansible.builtin.apt:
                    name: "{{ item }}"
                    update_cache: true
                  loop: "{{ mpi_packages }}"

                # Configure OpenMPI parameters
                - name: add default btl_tcp_if_include
                  ansible.builtin.lineinfile:
                    path: /etc/openmpi/openmpi-mca-params.conf
                    line: btl_tcp_if_include = enp0s19
                    create: yes

          # Install NCCL-GIB Plugin
          - type: ansible-local
            destination: install_nccl_gib.yml
            content: |
              ---
              - name: Install Google NCCL-GIB Plugin
                hosts: localhost
                become: true
                tasks:
                - name: Add artifact registry gpg key
                  ansible.builtin.apt_key:
                    url: https://us-apt.pkg.dev/doc/repo-signing-key.gpg
                    state: present
                - name: Add artifact registry gpg key
                  ansible.builtin.apt_key:
                    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
                    state: present
                - name: Install Apt Transport AR Apt Repo
                  apt_repository:
                    repo: 'deb http://packages.cloud.google.com/apt apt-transport-artifact-registry-stable main'
                    state: present
                - name: Install AR transport
                  ansible.builtin.apt:
                    name: "apt-transport-artifact-registry"
                    update_cache: true
                - name: Install Google NCCL-GIB Plugin
                  apt_repository:
                    repo: "deb ar+https://us-apt.pkg.dev/projects/gce-ai-infra gpudirect-gib-apt main"
                    state: present
                - name: Install NCCL-GIB Plugin
                  ansible.builtin.apt:
                    name: "nccl-gib"
                    update_cache: true
                - name: Freeze NCCL GIB Plugin
                  ansible.builtin.dpkg_selections:
                    name: "nccl-gib"
                    selection: hold

          # (Optional) Set defaults compatible with NCCL-GIB
          - type: data
            destination: /etc/environment
            content: |
              PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:/usr/local/cuda/bin"
              # The following are set to enable the NCCL gIB network plugin
              LD_LIBRARY_PATH=/usr/local/gib/lib64
              NCCL_CROSS_NIC=0
              NCCL_NET_GDR_LEVEL=PIX
              NCCL_P2P_NET_CHUNKSIZE=131072
              NCCL_NVLS_CHUNKSIZE=524288
              NCCL_IB_GID_INDEX=3
              NCCL_IB_ADAPTIVE_ROUTING=1
              NCCL_IB_QPS_PER_CONNECTION=4
              NCCL_IB_TC=52
              NCCL_IB_FIFO_TC=84
              NCCL_TUNER_CONFIG_PATH=/usr/local/gib/configs/tuner_config.txtpb
              # End of NCCL gIB section

          # (Optional) Update ldconfig in order to prefer NCCL-GIB
          - type: data
            destination: /etc/ld.so.conf.d/000_nccl-gib.conf
            content: |
              /usr/local/gib/lib64

          - type: ansible-local
            destination: update_ldconfig.yml
            content: |
              ---
              - name: Update ldconfig
                hosts: localhost
                become: true
                tasks:
                - name: Configure ldconfig
                  ansible.builtin.command: /usr/sbin/ldconfig
      - id: "{name}_wait"
        source: community/modules/scripts/wait-for-startup
        settings:
          instance_names: ((module.{name}_instance.name))
          timeout: 7200
