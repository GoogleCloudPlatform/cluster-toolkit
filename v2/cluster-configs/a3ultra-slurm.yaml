config_base: slurm

vars:
  # [RECOMMENDED] Enable Slurm Native Authentication. MUNGE is deprecating and scheduled for complete removal on July 31, 2026.
  # For upgrade instructions, see docs/slurm-native-auth-migration-guide.md.
  deployment_name: a3u-slurm # supply unique deployment name
  project_id: # supply project id
  region: # supply region with a3-ultragpu-8g capacity
  zone: # supply zone with a3-ultragpu-8g capacity
  a3u_cluster_size: 2 # supply node count
  a3u_reservation_name: "" # optional: supply a3-ultragpu-8g reservation name

  # Additional provisioning models (pick only one), can be used to substitute `a3u_reservation_name`:
  #
  # a3u_dws_flex_enabled: true
  #
  # To make use of DWS Flex, for more info visit: https://github.com/GoogleCloudPlatform/cluster-toolkit/blob/main/docs/slurm-dws-flex.md
  #
  # a3u_enable_spot_vm: true
  #
  # To make use of spot VMs, for more info visit: https://cloud.google.com/compute/docs/instances/spot

compute_archetypes:
- name: a3u-compute
  machine_type: a3-ultragpu-8g
  settings:
    node_count_static: $(vars.a3u_cluster_size)

features:
- name: my-lustre
  type: managed-lustre
  settings:
    size_gib: 36000
    per_unit_storage_throughput: 500
    local_mount: /home
- name: feat1
  type: aiml-gcsfuse
