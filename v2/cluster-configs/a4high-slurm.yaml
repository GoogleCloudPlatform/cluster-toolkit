config_base: slurm

vars:
  deployment_name: a4high-slurm # supply unique deployment name
  project_id: # supply project id
  region: # supply region with a4-highgpu-8g capacity
  zone: # supply zone with a4-highgpu-8g capacity
  a4_cluster_size: 2 # supply node count
  a4_reservation_name: "" # optional: supply a4-highgpu-8g reservation name

  # Additional provisioning models (pick only one), can be used to substitute `a4_reservation_name`:
  #
  # a4_dws_flex_enabled: true
  #
  # To make use of DWS Flex, for more info visit: https://github.com/GoogleCloudPlatform/cluster-toolkit/blob/main/docs/slurm-dws-flex.md
  #
  # a4_enable_spot_vm: true
  #
  # To make use of spot VMs, for more info visit: https://cloud.google.com/compute/docs/instances/spot

compute_archetypes:
- name: a4high-compute
  machine_type: a4-highgpu-8g
  settings:
    node_count_static: $(vars.a4_cluster_size)

features:
  # a4high-slurm-blueprint.yaml:homefs -- Managed Lustre on /home.
- name: homefs
  type: managed-lustre
  settings:
    size_gib: 36000
    per_unit_storage_throughput: 500
    local_mount: /home
# a4high-slurm-blueprint.yaml:gcs_bucket + gcs_checkpoints / gcs_training_data /
# gcs_model_serving (three gcsfuse profile mounts).
- name: ml-data
  type: aiml-gcsfuse
