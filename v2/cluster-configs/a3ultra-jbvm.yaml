config_base: jbvm

vars:
  deployment_name: a3u-jbvm # supply unique deployment name
  project_id: # supply project id
  region: # supply region with a3-ultragpu-8g capacity
  zone: # supply zone with a3-ultragpu-8g capacity
  number_of_vms: 2 # supply number of vms desired
  # a3u_reservation_name: "" # optional: supply a3-ultragpu-8g reservation name
  a3u_provisioning_model: STANDARD # RESERVATION_BOUND, SPOT, STANDARD (Set to RESERVATION_BOUND to use a reservation)

compute_archetypes:
- name: a3u-compute
  machine_type: a3-ultragpu-8g

features:
- name: homefs
  type: filestore
  settings:
    filestore_tier: BASIC_SSD
    size_gb: 2560
    local_mount: /home
    reserved_ip_range: 192.168.32.0/29
