config_base: gke
vars:
  deployment_name: a4x-gke # supply unique deployment name
  project_id: # supply project id
  region: # supply region with a4x-highgpu-4g capacity
  zone: # supply zone with a4x-highgpu-4g capacity
  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr:
  version_prefix: "1.35."
  a4x_cluster_size: 2 # supply node count
  num_node_pools: 1 # supply number of node pools
  # Uncomment and set it to consume a reservation instead of Spot, mutually exclusive with a4x_enable_spot_vm
  # a4x_reservation_name: "" # supply a4x-highgpu-4g reservation name
  a4x_enable_spot_vm: false # mutually exclusive with a4x_reservation_name

compute_archetypes:
- name: a4x-compute
  machine_type: a4x-highgpu-4g
  settings:
    static_node_count: $(vars.a4x_cluster_size)
    num_node_pools: $(vars.num_node_pools)
    # To consume a reservation instead of Spot, uncomment the block below
    # and set `a4x_enable_spot_vm: false`. The two are mutually exclusive.
    # reservation_affinity:
    #   consume_reservation_type: SPECIFIC_RESERVATION
    #   specific_reservations:
    #     - name: $(vars.a4x_reservation_name)
    spot: $(vars.a4x_enable_spot_vm)

features:
  # Both instances are cloud-storage, and cloud-storage-bucket defaults
  # local_mount to /mnt. Distinct paths are required or the two buckets mount
  # on top of each other.
- name: training
  type: cloud-storage
  settings:
    local_mount: /gcs-training
    gcsfuse_storage_class_name: gcsfusecsi-training
- name: checkpoint
  type: cloud-storage
  settings:
    local_mount: /gcs-checkpoint
    gcsfuse_storage_class_name: gcsfusecsi-checkpointing
- name: kueue
  type: kueue-jobset
  settings:
    kueue:
      version: 0.17.1
      config_path: $(vars.kueue_configuration_path)
      config_template_vars:
        accelerator_type: nvidia-gb200
        num_gpus: ((module.a4x-compute_pool.static_gpu_count))

overlays:
- name: nvidia-smi
  type: run-nvidia-smi
- name: scratch-fio
  type: fio-bench-job
- name: nccl-test
  type: nccl-jobset-test
