config_base: gke

vars:
  deployment_name: a3u-gke # supply unique deployment name
  project_id: # supply project id
  region: # supply region with a3-ultragpu-8g capacity
  zone: # supply zone with a3-ultragpu-8g capacity
  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr:
  version_prefix: "1.35."
  a3u_cluster_size: 2 # supply node count
  # Uncomment and set it to consume a reservation instead of Spot, mutually exclusive with a3u_enable_spot_vm
  # a3u_reservation_name: "" # supply a3-ultragpu-8g reservation name
  a3u_enable_spot_vm: false # mutually exclusive with a3u_reservation_name

compute_archetypes:
- name: a3u-compute
  machine_type: a3-ultragpu-8g
  settings:
    static_node_count: $(vars.a3u_cluster_size)
    # To consume a reservation instead of Spot, uncomment the block below
    # and set `a3u_enable_spot_vm: false`. The two are mutually exclusive.
    # reservation_affinity:
    #   consume_reservation_type: SPECIFIC_RESERVATION
    #   specific_reservations:
    #     - name: $(vars.a3u_reservation_name)
    spot: $(vars.a3u_enable_spot_vm)

features:
- name: my-lustre
  type: managed-lustre
  settings:
    size_gib: 36000
    per_unit_storage_throughput: 500
    local_mount: /lustre
    remote_mount: lustrefs

- name: ai-workload
  type: kueue-jobset
  settings:
    kueue:
      install: true
      config_path: $(vars.kueue_configuration_path)
      config_template_vars:
        num_gpus: ((module.a3u-compute_pool.static_gpu_count))
        accelerator_type: nvidia-h200-141gb
    jobset:
      install: true
    # gIB is NOT installed here. The a3-ultragpu-8g archetype already
    # provisions a `{pool}_manager` kubectl-apply that installs it, with the
    # per-silicon image and node_affinity this block would have lost. Two
    # kubectl-apply modules installing the same DaemonSet is a Terraform
    # ownership conflict, not a redundant no-op.

- name: training
  type: cloud-storage
  settings:
    local_mount: /training-data
    name_prefix: training
    gcsfuse_storage_class_name: gcsfusecsi-training

- name: checkpointing
  type: cloud-storage
  settings:
    local_mount: /checkpoint-data
    name_prefix: checkpoint
    gcsfuse_storage_class_name: gcsfusecsi-checkpointing

overlays:
- name: nvidia-smi
  type: run-nvidia-smi
- name: nccl-test
  type: nccl-jobset-test
- name: lustre-fio
  type: fio-bench-job
