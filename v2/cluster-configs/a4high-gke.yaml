config_base: gke

vars:
  deployment_name: a4high-gke # supply unique deployment name
  project_id: # supply project id
  region: # supply region with a4-highgpu-8g capacity
  zone: # supply zone with a4-highgpu-8g capacity
  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr:
  version_prefix: "1.35."
  a4_cluster_size: 1 # supply node count
  # Uncomment and set it to consume a reservation instead of Spot, mutually exclusive with a4_enable_spot_vm
  # a4_reservation_name: "" # supply a4-highgpu-8g reservation name
  a4_enable_spot_vm: false # mutually exclusive with a4_reservation_name

compute_archetypes:
- name: a4high-compute
  machine_type: a4-highgpu-8g
  settings:
    static_node_count: $(vars.a4_cluster_size)
    # To consume a reservation instead of Spot, uncomment the block below
    # reservation_affinity:
    #   consume_reservation_type: SPECIFIC_RESERVATION
    #   specific_reservations:
    #     - name: $(vars.a4_reservation_name)
    spot: $(vars.a4_enable_spot_vm)

features:
- name: ai-workload
  type: kueue-jobset
  settings:
    kueue:
      install: true
      config_path: $(vars.kueue_configuration_path)
      config_template_vars:
        num_gpus: ((module.a4high-compute_pool.static_gpu_count))
        accelerator_type: nvidia-b200
    jobset:
      install: true

- name: training
  type: cloud-storage
  settings:
    local_mount: /training-data
    name_prefix: training
    gcsfuse_storage_class_name: gcsfusecsi-training

- name: checkpointing
  type: cloud-storage
  settings:
    local_mount: /checkpoint-data
    name_prefix: checkpoint
    gcsfuse_storage_class_name: gcsfusecsi-checkpointing

overlays:
  # gke-a4.yaml:job-template -- nvidia-smi smoke test.
- name: nvidia-smi
  type: run-nvidia-smi
# gke-a4.yaml:fio-bench-job-template -- fio over the checkpoint/training PVs.
- name: scratch-fio
  type: fio-bench-job
