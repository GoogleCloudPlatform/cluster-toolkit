# CPU-only Slurm cluster, modelled on examples/hpc-slurm.yaml:
# debug, c2 and h3 partitions plus a Filestore /home.

config_base: slurm

vars:
  deployment_name: cpu-slurm # supply unique deployment name
  project_id: # supply project id
  region: us-central1
  zone: us-central1-a # h3-standard-88 is available in only specific zones
  # Consumption model. Defaults to on-demand; set at most one of these.
  # cpu_enable_spot_vm: false
  # cpu_reservation_name: ""
  # cpu_dws_flex_enabled: false

compute_archetypes:
- name: debug
  machine_type: n2-standard-2
  settings:
    node_count_dynamic_max: 4
    is_default: true

- name: c2 # "compute" is reserved
  machine_type: c2-standard-60
  settings:
    node_count_dynamic_max: 20
    bandwidth_tier: gvnic_enabled
    is_default: false
    exclusive: true

- name: h3
  machine_type: h3-standard-88
  settings:
    node_count_dynamic_max: 20
    bandwidth_tier: gvnic_enabled
    is_default: false
    exclusive: true

features:
- name: homefs
  type: filestore
  settings:
    local_mount: /home
