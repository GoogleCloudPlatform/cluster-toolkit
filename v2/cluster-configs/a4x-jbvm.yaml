config_base: jbvm

vars:
  deployment_name: a4x-jbvm # supply unique deployment name
  project_id: # supply project id
  region: # supply region with a4x-highgpu-4g capacity
  zone: # supply zone with a4x-highgpu-4g capacity
  number_of_vms: 2 # supply number of vms desired
  # a4x_reservation_name: "" # optional: supply a4x-highgpu-4g reservation name
  a4x_provisioning_model: STANDARD # RESERVATION_BOUND, SPOT, STANDARD (Set to RESERVATION_BOUND to use a reservation)
  filestore_ip_range: 192.168.32.0/24

compute_archetypes:
- name: a4x-compute
  machine_type: a4x-highgpu-4g

features:
- name: homefs
  type: filestore
  settings:
    filestore_tier: HIGH_SCALE_SSD
    size_gb: 10240
    local_mount: /home
    reserved_ip_range: $(vars.filestore_ip_range)
