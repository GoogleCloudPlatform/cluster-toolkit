name: jbvm
description: Standalone Google Compute Engine VM instances (Just-a-Bunch-of-VMs) with VPC networking.
# Default floor for a minimal cluster-config.
#
# Only `project_id` is genuinely mandatory: it is declared null here so the compiler can
# detect its absence and fail with an actionable message rather than emitting a blueprint
# that dies at terraform plan. Everything else has a working default, so the smallest
# valid cluster-config is `config_base` + `project_id` + one compute archetype.
vars:
  project_id: null
  deployment_name: jbvm-cluster
  # Defaulted so a minimal cluster-config compiles without naming a location. Accelerator
  # archetypes are validated against the zone, so a GPU pool that is unavailable here
  # still fails with an explicit "machine type does not exist in zone" error.
  region: us-central1
  zone: us-central1-a

deployment_groups:
- group: cluster-env
  modules:
  - id: network
    source: modules/network/vpc
    settings:
      network_name: "$(vars.deployment_name)-net-0"
      mtu: 8896
      subnetworks:
      - subnet_name: "$(vars.deployment_name)-sub-0"
        subnet_region: "$(vars.region)"
        subnet_ip: "192.168.0.0/19"
      firewall_rules:
      - name: "$(vars.deployment_name)-internal-0"
        ranges: ["192.168.0.0/19"]
        allow:
        - protocol: tcp
        - protocol: udp
        - protocol: icmp
