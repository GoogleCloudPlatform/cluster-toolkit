name: gke
description: Google Kubernetes Engine (GKE) orchestrator foundation with VPC networking and system node pool.

vars:
  project_id:
  deployment_name: gke-cluster
  # Defaulted so a minimal cluster-config compiles without naming a location. Accelerator
  # archetypes are validated against the zone, so a GPU/TPU pool that is unavailable here
  # still fails with an explicit "machine type does not exist in zone" error.
  region: us-central1
  zone: us-central1-a
  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr: 0.0.0.0/0

deployment_groups:
- group: cluster
  modules:
  - id: network
    source: modules/network/vpc
    settings:
      network_name: "$(vars.deployment_name)-net-0"
      ips_per_nat: 6
      subnetworks:
      - subnet_name: "$(vars.deployment_name)-sub-0"
        subnet_region: "$(vars.region)"
        subnet_ip: "192.168.0.0/18"
      secondary_ranges_list:
      - subnetwork_name: "$(vars.deployment_name)-sub-0"
        ranges:
        - range_name: pods
          ip_cidr_range: 10.4.0.0/14
        - range_name: services
          ip_cidr_range: 10.0.32.0/20
      firewall_rules:
      - name: "$(vars.deployment_name)-internal-0"
        ranges: [192.168.0.0/16]
        allow:
        - protocol: tcp
          ports: ["0-65535"]
        - protocol: udp
          ports: ["0-65535"]
        - protocol: icmp
  - id: node_pool_service_account
    source: modules/project/service-account
    settings:
      name: gke-np-sa
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - monitoring.viewer
      - stackdriver.resourceMetadata.writer
      - storage.objectViewer
      - artifactregistry.reader
  - id: workload_service_account
    source: modules/project/service-account
    settings:
      name: gke-wl-sa
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - monitoring.viewer
      - stackdriver.resourceMetadata.writer
      - storage.objectAdmin
      - artifactregistry.reader
      - container.admin
  - id: cluster
    source: modules/scheduler/gke-cluster
    use: [network, workload_service_account]
    settings:
      system_node_pool_taints: []
      enable_private_endpoint: "false"
      configure_workload_identity_sa: true
      release_channel: REGULAR
      maintenance_exclusions:
      - name: no-minor-or-node-upgrades-indefinite
        exclusion_scope: NO_MINOR_OR_NODE_UPGRADES
        exclusion_end_time_behavior: UNTIL_END_OF_SUPPORT
      master_authorized_networks:
      - cidr_block: $(vars.authorized_cidr)
        display_name: "default-access"
    outputs:
    - instructions
