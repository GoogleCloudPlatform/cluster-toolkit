---

spec:
  requirements:
    services:
    - container.googleapis.com

ghpc:
  validators:
  - validator: regex
    inputs:
      vars: [network_id]
      pattern: ^projects/[^/]+/global/networks/[^/]+$
    error_message: "The network id must be provided in the following format: projects/<project_id>/global/networks/<network_name>."

  - validator: conditional
    inputs:
      trigger: enable_ml_diagnostics
      trigger_value: true
      dependent: configure_workload_identity_sa
      dependent_value: true
    error_message: "The variable 'configure_workload_identity_sa' must be set to true when 'enable_ml_diagnostics' is enabled to correctly configure ML Diagnostics."

  - validator: conditional
    inputs:
      trigger: enable_multi_tier_checkpointing
      trigger_value: true
      dependent: enable_gcsfuse_csi
      dependent_value: true
    error_message: "The variable 'enable_gcsfuse_csi' must be set to true when 'enable_multi_tier_checkpointing' is enabled."
  - validator: cidr
    inputs:
      vars: [master_authorized_networks]
      object_key: cidr_block
    error_message: "Validation failed due to invalid CIDR IP address in 'master_authorized_networks.cidr_block'. All values must be in CIDR format (e.g. 1.2.3.4/32)."
  - validator: cidr
    inputs:
      vars: [master_ipv4_cidr_block]
      allow_null: true
    error_message: "master_ipv4_cidr_block must be null or a valid IPv4 /28 CIDR block (e.g. 1.2.3.0/28)."
  - validator: regex
    inputs:
      vars: [master_ipv4_cidr_block]
      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/28$
    error_message: "master_ipv4_cidr_block must be null or a valid IPv4 /28 CIDR block (e.g. 1.2.3.0/28)."
  day2_ignored_settings:
  - setting: version_prefix
    setting_aliases: [min_master_version]
    display_name: "control-plane version setting"
    attribute: min_master_version
    reason: "'min_master_version' is in lifecycle.ignore_changes on the cluster resource."
    remediation: "gcloud container clusters upgrade <cluster-name> --master"
  - setting: labels
    attribute: node_config[0].resource_labels
    reason: "GCE 'resource_labels' on system node pools is in lifecycle.ignore_changes."
    remediation: "gcloud container node-pools update <pool-name> --cluster <cluster-name> --region <region> --labels <key=val,...>"
  - setting: node_locations
    setting_aliases: [system_node_pool_zones]
    display_name: "cluster zone settings ('node_locations' or 'system_node_pool_zones')"
    attribute: node_locations
    reason: "'node_locations' is in lifecycle.ignore_changes on the cluster resource to prevent fighting regional cluster defaults."
    remediation: "Manage node pool zone placement individually via node pool modules."
