---

spec:
  requirements:
    services:
    - container.googleapis.com
ghpc:
  inject_module_id: internal_ghpc_module_id
  validators:
  - validator: regex
    inputs:
      vars: [name]
      pattern: "^[a-z]([-a-z0-9]{0,34}[a-z0-9])?$"
    error_message: "'name' must start with a lowercase letter, followed by up to 34 lowercase letters, numbers, or hyphens, and cannot end with a hyphen."
  - validator: range
    inputs:
      vars: [local.upgrade_settings.max_surge]
      min: 0
    error_message: "'max_surge' value must be at least 0."
  - validator: range
    inputs:
      vars: [local.upgrade_settings.max_unavailable]
      min: 0
    error_message: "'max_unavailable' value must be at least 0."
  - validator: conditional
    inputs:
      trigger: enable_flex_start
      trigger_value: true
      dependent: static_node_count
      dependent_value: null
    error_message: "enable_flex_start does not work with static_node_count. static_node_count should be set to null."
  - validator: conditional
    inputs:
      trigger: enable_flex_start
      trigger_value: true
      dependent: auto_repair
      dependent_value: false
    error_message: "enable_flex_start needs node auto_repair set to false."
  - validator: conditional
    inputs:
      trigger: enable_queued_provisioning
      trigger_value: true
      dependent: autoscaling_total_min_nodes
      dependent_value: 0
    error_message: "autoscaling_total_min_nodes should be 0 when enable_queued_provisioning is true."
  - validator: conditional
    inputs:
      trigger: enable_queued_provisioning
      trigger_value: true
      dependent: enable_flex_start
      dependent_value: true
    error_message: "enable_queued_provisioning requires enable_flex_start to be set to true."
  - validator: exclusive
    inputs:
      vars: [enable_flex_start, spot]
    error_message: "Both enable_flex_start and spot consumption option cannot be set to true at the same time."
  - validator: exclusive
    inputs:
      vars: [enable_queued_provisioning, spot]
    error_message: "Both enable_queued_provisioning and spot consumption option cannot be set to true at the same time."
  - validator: conditional_regex
    inputs:
      trigger: spot
      trigger_value: true
      dependent: reservation_affinity.consume_reservation_type
      pattern: "^NO_RESERVATION$"
    error_message: "Spot consumption option only works with reservation_affinity consume_reservation_type NO_RESERVATION."
  - validator: conditional_regex
    inputs:
      trigger: enable_flex_start
      trigger_value: true
      dependent: reservation_affinity.consume_reservation_type
      pattern: "^NO_RESERVATION$"
    error_message: "enable_flex_start requires reservation_affinity.consume_reservation_type to be 'NO_RESERVATION'."
  - validator: conditional_regex
    inputs:
      trigger: enable_queued_provisioning
      trigger_value: true
      dependent: reservation_affinity.consume_reservation_type
      pattern: "^NO_RESERVATION$"
    error_message: "reservation_affinity should be NO_RESERVATION when enable_queued_provisioning is true."
  - validator: range
    inputs:
      vars: [threads_per_core]
      min: 0
      max: 2
    error_message: "threads_per_core must be between 0 and 2."
  - validator: allowed_enum
    inputs:
      vars: [host_maintenance_interval]
      allowed: ["", "PERIODIC", "AS_NEEDED"]
      allow_null: true
    error_message: "host_maintenance_interval must be 'PERIODIC', 'AS_NEEDED', empty, or null."
  - validator: allowed_enum
    inputs:
      vars: [placement_policy.type]
      allowed: ["COMPACT"]
      allow_null: true
    error_message: "placement_policy.type must be 'COMPACT' or null."
  - validator: required
    inputs:
      vars: [compact_placement]
      deprecated: true
    error_message: "The 'compact_placement' variable has been removed. Please use 'placement_policy' instead."
  - validator: required
    inputs:
      vars: [total_min_nodes]
      deprecated: true
    error_message: "The 'total_min_nodes' variable has been removed. Please use 'autoscaling_total_min_nodes' instead."
  - validator: required
    inputs:
      vars: [total_max_nodes]
      deprecated: true
    error_message: "The 'total_max_nodes' variable has been removed. Please use 'autoscaling_total_max_nodes' instead."
  - validator: required
    inputs:
      vars: [service_account]
      deprecated: true
    error_message: "The 'service_account' variable has been removed. Please use 'service_account_email' and 'service_account_scopes' instead."
  - validator: exclusive
    inputs:
      vars: [autoscaling_total_min_nodes, autoscaling_min_node_count]
    error_message: "autoscaling_total_min_nodes and autoscaling_min_node_count cannot both be set."
  - validator: exclusive
    inputs:
      vars: [autoscaling_total_max_nodes, autoscaling_max_node_count]
    error_message: "autoscaling_total_max_nodes and autoscaling_max_node_count cannot both be set."
  - validator: exclusive
    inputs:
      vars: [static_node_count, initial_node_count]
    error_message: "static_node_count and initial_node_count cannot both be set."
  - validator: exclusive
    inputs:
      vars: [local_ssd_count_ephemeral_storage, local_ssd_count_nvme_block]
    error_message: "local_ssd_count_ephemeral_storage and local_ssd_count_nvme_block cannot both be set."
