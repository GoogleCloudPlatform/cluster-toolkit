---

vars:
  project_id: ## Set GCP Project ID Here ##
  deployment_name: cae-slurm-v6
  # Check here for regions/zones with H4D, C4D, G4, and Managed Lustre:
  # https://cloud.google.com/compute/docs/regions-zones
  region: us-central1
  zone: us-central1-b

  # H4D & Cloud RDMA settings (on-demand by default; pick only one provisioning model)
  h4d_cluster_size: 0
  h4d_reservation_name: ""
  # h4d_dws_flex_enabled: false
  # h4d_enable_spot_vm: false

  # G4 GPU settings (DWS Flex-Start by default; pick only one provisioning model)
  gpu_cluster_size: 0
  gpu_machine_type: g4-standard-48
  # To enable Dual NIC, use g4-standard-384 and uncomment net1 in cae-slurm.yaml:
  # gpu_machine_type: g4-standard-384
  # net1_range: 192.168.2.0/24
  gpu_reservation_name: ""
  # gpu_enable_spot_vm: false
  # gpu_dws_flex_enabled: true

  # Managed Lustre settings for /scratch
  # See https://cloud.google.com/managed-lustre/docs/create-instance#performance-tiers
  lustre_size_gib: 9000
  per_unit_storage_throughput: 1000

## --- Optional overrides (defaults shown) ---
  # rdma_net_range: 192.168.128.0/18
  # h4d_node_count_dynamic_max: 10
  # c4d_node_count_dynamic_max: 10
  # c4d_enable_spot_vm: false
  # gpu_node_count_dynamic_max: 2
  # gpu_disk_size_gb: 100
  # homefs_size_gb: 2560
  # appsfs_size_gb: 2560
  # login_machine_type: n2-standard-8
  # controller_machine_type: n2-standard-16
