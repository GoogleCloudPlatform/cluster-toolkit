blueprint_name: gke-scale-multinic-lustre

# Uncomment to store Terraform state in a remote GCS bucket:
# terraform_backend_defaults:
#   type: gcs
#   configuration:
#     bucket: <your-tf-state-bucket>

vars:
  project_id:  # Set GCP Project ID Here
  deployment_name: scale-mnic-250  # Keep <= 16-20 chars so ${deployment_name}-gke-np-sa stays <= 30 chars
  region: us-central1
  zone: us-central1-a
  lustre_zone: us-central1-a
  authorized_cidr:  # <your-ip-address>/32
  version_prefix: "1.36."

  # 25 pools x 10 nodes = 250 nodes (8 NICs per node requires >= 8 vCPUs)
  machine_type: c3-standard-8
  num_node_pools: 25
  static_node_count: 2  # Step 1: start with 2 nodes per pool; Step 2: increase to 10

  # 7 secondary VPCs + 1 primary VPC = 8 NICs per node
  secondary_network_count: 7
  secondary_subnet_cidr_suffix: 20  # /20 (4,094 IPs per VPC); use 19 for 5,000 nodes

  # Managed Lustre (18 TiB at 1,000 MB/s/TiB)
  lustre_size_gib: 18000
  lustre_throughput: 1000
  lustre_pvc_name: lustre-scale-pvc

  # System node pool and disk settings
  system_node_pool_machine_type: e2-standard-16
  node_disk_type: pd-balanced
  node_disk_size_gb: 100
  max_pods_per_node: 32

  # Kueue and JobSet controller resources
  kueue_controller_cpu: "4"
  kueue_controller_memory: "8Gi"
  jobset_controller_cpu: "4"
  jobset_controller_memory: "8Gi"

deployment_groups:
- group: primary
  modules:
  - id: network1
    source: modules/network/vpc
    settings:
      network_name: $(vars.deployment_name)-net
      subnetwork_name: $(vars.deployment_name)-subnet
      # Creates a /18 primary node subnet (16,382 IPs); GKE manages firewall rules for pod/service ranges
      network_address_range: 10.0.0.0/16
      default_primary_subnetwork_size: 2
      ips_per_nat: 8
      secondary_ranges_list:
      - subnetwork_name: $(vars.deployment_name)-subnet
        ranges:
        - range_name: pods
          ip_cidr_range: 10.32.0.0/11
        - range_name: services
          ip_cidr_range: 10.2.0.0/20

  # Disable Cloud Router, NAT, and IAP on secondary VPCs to save regional quotas
  - id: secondary_vpcs
    source: modules/network/multivpc
    settings:
      network_name_prefix: $(vars.deployment_name)-rail
      network_count: $(vars.secondary_network_count)
      global_ip_address_range: 192.168.0.0/16
      subnetwork_cidr_suffix: $(vars.secondary_subnet_cidr_suffix)
      mtu: 8896
      enable_cloud_router: false
      enable_cloud_nat: false
      ips_per_nat: 0
      enable_iap_ssh_ingress: false

  - id: private_service_access
    source: modules/network/private-service-access
    use: [network1]
    settings:
      address: 10.200.0.0
      prefix_length: 20

  - id: lustre_firewall_rule
    source: modules/network/firewall-rules
    use: [network1]
    settings:
      ingress_rules:
      - name: $(vars.deployment_name)-allow-lustre
        description: "Allow Managed Lustre LNet"
        source_ranges:
        - $(private_service_access.cidr_range)
        allow:
        - protocol: tcp
          ports: ["988", "1021-1023"]

  - id: managed_lustre
    source: modules/file-system/managed-lustre
    use: [network1, private_service_access]
    settings:
      name: $(vars.deployment_name)-lustre
      zone: $(vars.lustre_zone)
      size_gib: $(vars.lustre_size_gib)
      per_unit_storage_throughput: $(vars.lustre_throughput)
      remote_mount: lustrefs
      local_mount: /mnt/lustre

  # Shared across all node pools (gke-np-sa) and Workload Identity pods (gke-wl-sa)
  - id: node_pool_service_account
    source: modules/project/service-account
    settings:
      name: gke-np-sa
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - monitoring.viewer
      - stackdriver.resourceMetadata.writer
      - storage.objectViewer
      - artifactregistry.reader

  # Used by gke_cluster system_node_pools VMs and Workload Identity pods
  - id: workload_service_account
    source: modules/project/service-account
    settings:
      name: gke-wl-sa
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - monitoring.viewer
      - stackdriver.resourceMetadata.writer
      - storage.objectAdmin
      - artifactregistry.reader

  - id: gke_cluster
    source: modules/scheduler/gke-cluster
    use: [network1, secondary_vpcs, workload_service_account]
    settings:
      version_prefix: $(vars.version_prefix)
      enable_dataplane_v2: true
      enable_node_local_dns_cache: true
      enable_gcfs: true
      enable_gcsfuse_csi: true
      enable_managed_lustre_csi: true
      enable_dcgm_monitoring: false
      configure_workload_identity_sa: true
      enable_private_endpoint: false
      gcp_public_cidrs_access_enabled: true
      master_authorized_networks:
      - cidr_block: $(vars.authorized_cidr)
        display_name: "kubectl-access-network"
      default_max_pods_per_node: $(vars.max_pods_per_node)
      system_node_pool_machine_type: $(vars.system_node_pool_machine_type)
      system_node_pool_disk_type: $(vars.node_disk_type)
      system_node_pool_disk_size_gb: $(vars.node_disk_size_gb)
      system_node_pool_zones: [$(vars.zone)]
      system_node_pool_node_count:
        total_min_nodes: 2
        total_max_nodes: 8
      deletion_protection: false
      timeout_create: 2h
      timeout_update: 2h
      timeout_delete: 2h
    outputs: [instructions]

  - id: lustre_pvc
    source: modules/file-system/gke-persistent-volume
    use: [managed_lustre, gke_cluster]
    settings:
      capacity_gib: $(vars.lustre_size_gib)
      pvc_name: $(vars.lustre_pvc_name)

  - id: compute_pools
    source: modules/compute/gke-node-pool
    use: [gke_cluster, node_pool_service_account, secondary_vpcs]
    settings:
      machine_type: $(vars.machine_type)
      # enable_dranet: true  # For A3/A4/CT6E/TPU7X pools (remove secondary_vpcs from use)
      threads_per_core: 2
      disk_type: $(vars.node_disk_type)
      disk_size_gb: $(vars.node_disk_size_gb)
      enable_gcfs: true
      num_node_pools: $(vars.num_node_pools)
      static_node_count: $(vars.static_node_count)
      max_pods_per_node: $(vars.max_pods_per_node)
      zones: [$(vars.zone)]
      enable_private_nodes: true
      taints: []
      timeout_create: 2h
      timeout_update: 2h
      timeout_delete: 2h
      auto_upgrade: false
      auto_repair: false

  - id: workload_manager_install
    source: modules/management/kubectl-apply
    use: [gke_cluster]
    settings:
      kueue:
        install: true
        controller_cpu: $(vars.kueue_controller_cpu)
        controller_memory: $(vars.kueue_controller_memory)
      jobset:
        install: true
        controller_cpu: $(vars.jobset_controller_cpu)
        controller_memory: $(vars.jobset_controller_memory)
