apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: ag-2-
  namespace: default
spec:
  ttlSecondsAfterFinished: 1200
  suspend: False
  network:
    enableDNSHostnames: true
  replicatedJobs:
  - name: w
    template:
      spec:
        parallelism: 2
        completions: 2

        template:
          metadata:
            annotations:
              networking.gke.io/default-interface: 'eth0'
              networking.gke.io/interfaces: |
                [
                  {"interfaceName":"eth0","network":"default"},
                  {"interfaceName":"eth1","network":"vpc1"},
                  {"interfaceName":"eth2","network":"vpc2"},
                  {"interfaceName":"eth3","network":"vpc3"},
                  {"interfaceName":"eth4","network":"vpc4"}
                ]
              devices.gke.io/container.tcpx-daemon: |+
                - path: /dev/nvidia0
                - path: /dev/nvidia1
                - path: /dev/nvidia2
                - path: /dev/nvidia3
                - path: /dev/nvidia4
                - path: /dev/nvidia5
                - path: /dev/nvidia6
                - path: /dev/nvidia7
                - path: /dev/nvidiactl
                - path: /dev/nvidia-uvm
          spec:
            activeDeadlineSeconds: 3600
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-flex-start: "true"
            tolerations:
            - key: cloud.google.com/gke-queued
              effect: NoSchedule
              value: "true"

            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"

            setHostnameAsFQDN: true
            volumes:
            - name: nvidia
              hostPath:
                path: /home/kubernetes/bin/nvidia
            - name: libraries
              hostPath:
                path: /home/kubernetes/bin/nvidia/lib64
            - name: lib64
              hostPath:
                path: /lib64
            - name: tcpx-socket
              hostPath:
                path: /run/tcpx
            - name: shared-memory
              emptyDir:
                medium: "Memory"
                sizeLimit: 250Gi
            - name: sys
              hostPath:
                path: /sys
            - name: proc-sys
              hostPath:
                path: /proc/sys

            initContainers:
            - name: gpu-healthcheck
              image: alpine:latest
              command: ["/bin/sh", "-c"]
              args:
              - |
                apk add --no-cache bash  # Install bash
                /bin/bash -c "set -ex
                NUM_GPUS=$(/usr/local/nvidia/bin/nvidia-smi --query-gpu=driver_version --format=csv,noheader,nounits | wc -l)
                if [ \${NUM_GPUS} -lt 8 ]; then
                  echo \"Error: Only \${NUM_GPUS} GPUs and expected 8\"
                  exit 1
                fi
                gpu_errors=(\$(/usr/local/nvidia/bin/nvidia-smi --query-gpu=ecc.errors.uncorrected.volatile.total --format=csv,noheader,nounits))
                for gpu_index in \${!gpu_errors[@]}; do
                    if [ \${gpu_errors[\$gpu_index]} == '[N/A]' ]; then
                        echo 'Error: ERR detected in GPU index '\$gpu_index
                        exit 1
                    elif [ \${gpu_errors[\$gpu_index]} -gt 0 ]; then
                        echo 'Error: Unrecoverable ECC errors detected in GPU index '\$gpu_index
                        exit 1
                    fi
                done
                echo \${NUM_GPUS} GPUs found with no ERR or Unrecoverable ECC errors"

              volumeMounts:
              - name: nvidia
                mountPath: /usr/local/nvidia
              - name: lib64
                mountPath: /lib64
              securityContext:
                privileged: true
              env:
              - name: LD_LIBRARY_PATH
                value: /usr/local/nvidia/lib64

            containers:
            - name: tcpx-daemon
              image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpx/tcpgpudmarxd-dev:v2.0.12
              imagePullPolicy: Always
              command:
              - /tcpgpudmarxd/build/app/tcpgpudmarxd
              - --gpu_nic_preset
              - a3vm
              - --gpu_shmem_type
              - fd
              - --uds_path
              - /run/tcpx
              - --setup_param
              - \"--verbose 128 2 0 \"
              securityContext:
                capabilities:
                  add:
                  - NET_ADMIN
              volumeMounts:
              - name: libraries
                mountPath: /usr/local/nvidia/lib64
              - name: tcpx-socket
                mountPath: /run/tcpx
              - name: sys
                mountPath: /hostsysfs
              - name: proc-sys
                mountPath: /hostprocsysfs
              env:
              - name: LD_LIBRARY_PATH
                value: /usr/local/nvidia/lib64

            - name: nccl
              stdin: true
              tty: true
              image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpx/nccl-plugin-gpudirecttcpx-dev:v3.1.9
              securityContext:
                privileged: true
              env:
              - name: MY_NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: OMPI_ALLOW_RUN_AS_ROOT
                value: "1"
              - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
                value: "1"
              command:
              - bash
              - -c
              - |
                set -x
                export N_NODES=2
                echo "Starting workload container on ${MY_NODE_NAME} for $N_NODES benchmark"

                # Load all the cuda libs
                /sbin/ldconfig

                # Start sshd
                /scripts/container_entry.sh daemon &

                # Get helper variables to form all hostnames
                export POSTFIX=$(hostname | cut -d . -f 2-)
                export WORKERS_BASENAME=$(hostname | cut -d . -f 1 | rev | cut -d - -f 2- | rev )
                export NODE_RANK=$JOB_COMPLETION_INDEX

                # For every worker, wait till online and add to hostfile
                for i in `seq 0 $(($N_NODES-1))`; do
                  OTHER=${WORKERS_BASENAME}-${i}.${POSTFIX}
                  until ssh -p 222 -o StrictHostKeyChecking=no $OTHER hostname; do
                    echo Waiting for ${OTHER}...
                    sleep 10
                  done
                  echo ${OTHER} port=222 slots=8 | tee -a /tmp/hostfile;
                done

                cat /tmp/hostfile

                # Launch from head node
                if [[ "${NODE_RANK}" -eq "0" ]]; then
                    export NCCL_TESTS_SPLIT_MASK="0x0";
                    export NCCL_GPUDIRECTTCPX_FORCE_ACK=0
                    export NCCL_GPUDIRECTTCPX_TX_COMPLETION_NANOSLEEP=1000
                    export NCCL_DYNAMIC_CHUNK_SIZE=524288
                    export NCCL_P2P_NET_CHUNKSIZE=524288
                    export NCCL_P2P_PCI_CHUNKSIZE=524288
                    export NCCL_P2P_NVL_CHUNKSIZE=1048576
                    export NCCL_GPUDIRECTTCPX_TX_BINDINGS="eth1:8-21,112-125;eth2:8-21,112-125;eth3:60-73,164-177;eth4:60-73,164-177"
                    export NCCL_GPUDIRECTTCPX_RX_BINDINGS="eth1:22-35,126-139;eth2:22-35,126-139;eth3:74-87,178-191;eth4:74-87,178-191"
                    export NCCL_NSOCKS_PERTHREAD=4
                    export NCCL_SOCKET_NTHREADS=1
                    export NCCL_MAX_NCHANNELS=8
                    export NCCL_MIN_NCHANNELS=8
                    export NCCL_BUFFSIZE=4194304
                    export NCCL_DEBUG=INFO
                    export NCCL_DEBUG_SUBSYS=ENV
                    export NCCL_GPUDIRECTTCPX_SOCKET_IFNAME=eth1,eth2,eth3,eth4
                    export NCCL_GPUDIRECTTCPX_CTRL_DEV=eth0
                    export NCCL_GPUDIRECTTCPX_PROGRAM_FLOW_STEERING_WAIT_MICROS=500000
                    export NCCL_CROSS_NIC=0
                    export NCCL_ALGO=Ring
                    export NCCL_PROTO=Simple
                    export NCCL_NET_GDR_LEVEL=PIX
                    export NCCL_P2P_PXN_LEVEL=0
                    export NCCL_SOCKET_IFNAME=eth0

                    ENV_VARS=$(echo ${!NCCL*} ${!OMPI*} LD_LIBRARY_PATH PATH | sed 's/ / -x /g')

                    if [ -f /third_party/nccl-tests-mpi/build/all_gather_perf ]; then
                      BENCHMARK_BIN="/third_party/nccl-tests-mpi/build/all_gather_perf"
                    else
                      BENCHMARK_BIN="/third_party/nccl-tests/build/all_gather_perf"
                    fi

                    mpirun --hostfile /tmp/hostfile \
                      -x $ENV_VARS  \
                      -mca plm_rsh_no_tree_spawn 1 \
                      --mca orte_keep_fqdn_hostnames 1 \
                      --mca btl self,tcp \
                      --mca btl_tcp_if_include eth0 \
                      --bind-to none \
                      --mca plm_rsh_agent "ssh -q -o LogLevel=ERROR -o StrictHostKeyChecking=no -p 222" \
                      $BENCHMARK_BIN -b 1K -e 8G -f 2 -g 1 -w 5 --iters 100 -c 1

                else
                  while ssh -p 222 -o StrictHostKeyChecking=no ${WORKERS_BASENAME}-0.${POSTFIX} true; do
                    sleep 5
                  done
                fi

                exit 0

              volumeMounts:
              - name: tcpx-socket
                mountPath: /tmp
              - name: nvidia
                mountPath: /usr/local/nvidia
              - name: libraries
                mountPath: /usr/local/nvidia/lib64
              - name: shared-memory
                mountPath: /dev/shm
              resources:
                limits:
                  nvidia.com/gpu: 8
                requests:
                  nvidia.com/gpu: 8
