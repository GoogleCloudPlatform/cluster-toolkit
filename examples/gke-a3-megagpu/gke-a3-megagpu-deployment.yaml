---
terraform_backend_defaults:
  type: gcs
  configuration:
    # The GCS bucket used for storing terraform state
    bucket:

vars:
  # This should be unique across all of your Cluster
  # Toolkit Deployments.
  deployment_name:

  # Your GCP Project ID
  project_id:

  # The GCP Region used for this deployment.
  region:

  # The GCP Zone used for this deployment.
  zone:

  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr:

## Choose ONE consumption model from the options below (default is On-Demand):

## --- Option 1: DWS Flex Start ---
  #enable_flex_start: true
  #static_node_count: $(null)

## --- Option 2: DWS Flex Start + Queued Provisioning ---
  ## Change this variable if you want to have a custom kueue config file
  #kueue_configuration_path: $(ghpc_stage("../dws-sample-workloads/dws-queues.yaml.tftpl"))
  #enable_flex_start: true
  #enable_queued_provisioning: true
  #static_node_count: $(null)

## --- Option 3: Spot ---
  #spot: true
  #static_node_count:

## --- Option 4: Specific Reservation ---
## See for more information: https://github.com/GoogleCloudPlatform/cluster-toolkit/tree/main/modules/compute/gke-node-pool#using-gce-reservations
  #reservation_affinity:
  #  consume_reservation_type: SPECIFIC_RESERVATION
  #  specific_reservations:
  #  - name:
  #static_node_count:

## --- Option 5: On-Demand (Default) ---
  static_node_count:
