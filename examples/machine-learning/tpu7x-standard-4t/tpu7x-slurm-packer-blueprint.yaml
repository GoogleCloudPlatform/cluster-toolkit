---
blueprint_name: tpu7x-slurm-packer
vars:
  project_id: ## Set GCP Project ID Here ##
  deployment_name: tpu7x-slurm-packer
  region: us-central1
  zone: us-central1-c
  tpu_cluster_size: 8
  tpu_dynamic_max_nodes: 4
  tpu_accelerator_topology: 2x4x4

  # Image settings
  # Base image for building the Slurm image
  source_image_family: ubuntu-accel-2404-amd64-tpu-tpu7x
  source_image_project: ubuntu-os-accelerator-images

  # Name of the built image family
  built_image_family: slurm-tpu-v7x-ubuntu2404
  instance_image:
    family: $(vars.built_image_family)
    project: $(vars.project_id)

  instance_image_custom: true
  image_build_machine_type: n2-standard-4
  build_slurm_from_git_ref: tpu-2605
  disk_size_gb: 100
  filestore_ip_range: 192.168.0.0/29

  #Provisioning models (set to true or fill in reservation name, pick only one)
  tpu_reservation_name: "" # supply reservation name
  tpu_dws_flex_enabled: false
  tpu_enable_spot_vm: false

deployment_groups:
- group: image-env
  modules:
  - id: build-net
    source: modules/network/vpc
    settings:
      network_name: $(vars.deployment_name)-build-net
      subnetwork_name: $(vars.deployment_name)-build-subnet

  - id: slurm-build-script
    source: modules/scripts/startup-script
    settings:
      install_ansible: true
      runners:
      - type: shell
        destination: wait_for_apt.sh
        content: |
          #!/bin/bash
          echo "Waiting for apt-get locks..."
          while sudo fuser /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            sleep 2
          done
          echo "Apt locks released."

      - type: data
        destination: /var/tmp/slurm_vars.json
        content: |
          {
            "reboot": false,
            "install_cuda": false,
            "install_lustre": false,
            "install_managed_lustre": false,
            "slurm_patch_files": ["patches/tpu-2605.patch"],
            "allow_kernel_upgrades": false,
            "kernel_packages": ["linux-image-gcp", "linux-gcp"],
            "monitoring_agent": "cloud-ops"
          }

      - type: ansible-local
        destination: install_custom_deps.yml
        content: |
          ---
          - name: Install custom TPU dependencies
            hosts: all
            become: true
            tasks:
              - name: Install system packages
                ansible.builtin.apt:
                  name:
                    - python3-pip
                    - git
                    - lua-posix
                    - python3.12
                    - python3.12-venv
                  state: present
                  update_cache: yes

      - type: shell
        destination: install_slurm.sh
        content: |
          #!/bin/bash
          set -e -o pipefail
          sudo apt-mark unhold linux-headers-gcp || true
          echo 'APT::Get::allow-change-held-packages "true";' | sudo tee /etc/apt/apt.conf.d/99allow-held
          sudo apt update
          ansible-pull \
              -U https://github.com/GoogleCloudPlatform/slurm-gcp -C $(vars.build_slurm_from_git_ref) \
              -i localhost, --limit localhost --connection=local \
              -e @/var/tmp/slurm_vars.json \
              ansible/playbook.yml

- group: image
  modules:
  - id: packer-image
    source: modules/packer/custom-image
    kind: packer
    settings:
      disk_size: $(vars.disk_size_gb)
      machine_type: $(vars.image_build_machine_type)
      source_image_family: $(vars.source_image_family)
      source_image_project_id: [$(vars.source_image_project)]
      image_family: $(vars.built_image_family)
      omit_external_ip: false

      metadata:
        # Needed in Ubuntu 24.04 for enroot, not required on VMs using this image
        # Unattended upgrades are disabled in this blueprint so that software does not
        # get updated daily and lead to potential instability in the cluster environment.
        #
        # Unattended Upgrades installs available security updates from the Ubuntu
        # security pocket for installed packages daily by default. Administrators who
        # disable this feature assume all responsibility for manually reviewing and
        # patching their systems against vulnerabilities.
        #
        # To enable unattended upgrades, please remove this section.
        user-data: |
          #cloud-config
          create_hostname_file: true
          write_files:
          - path: /etc/apt/apt.conf.d/20auto-upgrades
            permissions: '0644'
            owner: root
            content: |
              APT::Periodic::Update-Package-Lists "0";
              APT::Periodic::Unattended-Upgrade "0";
    use:
    - build-net
    - slurm-build-script

- group: cluster-env
  modules:
  - id: slurm-network
    source: modules/network/vpc
    settings:
      network_name: $(vars.deployment_name)-net-1
      subnetworks:
      - subnet_name: $(vars.deployment_name)-sub-1
        subnet_region: $(vars.region)
        subnet_ip: 192.168.64.0/18
      firewall_rules:
      - name: $(vars.deployment_name)-internal-1
        ranges: [192.168.0.0/16]
        allow:
        - protocol: tcp
          ports: ["0-65535"]
        - protocol: udp
          ports: ["0-65535"]
        - protocol: icmp

  - id: homefs
    source: modules/file-system/filestore
    use: [slurm-network]
    settings:
      filestore_tier: BASIC_SSD
      size_gb: 2560
      local_mount: /home
      reserved_ip_range: $(vars.filestore_ip_range)

- group: cluster
  modules:
  - id: tpu_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [slurm-network]
    settings:
      machine_type: tpu7x-standard-4t
      accelerator_topology: $(vars.tpu_accelerator_topology)
      enable_public_ips: true
      node_count_static: $(vars.tpu_cluster_size)
      node_count_dynamic_max: 0
      disk_type: hyperdisk-balanced
      reservation_name: $(vars.tpu_reservation_name)
      enable_spot_vm: $(vars.tpu_enable_spot_vm)
      dws_flex:
        enabled: $(vars.tpu_dws_flex_enabled)

  - id: tpu_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [tpu_nodeset]
    settings:
      partition_name: tpu
      resume_timeout: 1200
      suspend_timeout: 600
      exclusive: false
      is_default: true

  - id: tpu_dyn_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [slurm-network]
    settings:
      machine_type: tpu7x-standard-4t
      enable_public_ips: true
      node_count_static: 0
      node_count_dynamic_max: $(vars.tpu_dynamic_max_nodes)
      disk_type: hyperdisk-balanced
      reservation_name: $(vars.tpu_reservation_name)
      enable_spot_vm: $(vars.tpu_enable_spot_vm)
      dws_flex:
        enabled: $(vars.tpu_dws_flex_enabled)

  - id: tpu_dyn_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [tpu_dyn_nodeset]
    settings:
      partition_name: tpu-dyn
      resume_timeout: 1200
      suspend_timeout: 600
      exclusive: true
      is_default: false

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [slurm-network]
    settings:
      machine_type: n2-standard-4
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - tpu_partition
    - tpu_dyn_partition
    - slurm_login
    - slurm-network
    - homefs
    settings:
      machine_type: n2-standard-4
      enable_controller_public_ips: true
