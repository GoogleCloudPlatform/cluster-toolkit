---
blueprint_name: tpu7x-slurm
vars:
  project_id: # supply existing GCP project ID
  deployment_name: # supply unique deployment name, <= 25 chars (e.g. tpu7x-slurm)
  region: # supply region (e.g. us-central1)
  zone: # supply zone (e.g. us-central1-c)
  tpu_static_nodes: # supply total static tpu7x-standard-4t VM nodes (4 TPU chips/node; multiple of slice VMs, e.g. 8 for one 2x4x4 slice or two 2x2x4 slices)
  tpu_accelerator_topology: # topology per static TPU slice (e.g. 2x2x4)
  # Note: slice VMs = total chips / 4, e.g. 2x2x4 = 4 nodes/slice, 2x4x4 = 8 nodes/slice
  tpu_dynamic_max_nodes: # max dynamic tpu7x-standard-4t nodes (e.g. 4)

  # Image settings
  instance_image:
    family: aci-tpu-tpu7x-u2404-slurm-2605-amd64
    project: advanced-compute-images

  # Cluster Settings
  disk_size_gb: 100

  # Managed Lustre is only supported in specific regions and zones
  # Please refer https://cloud.google.com/managed-lustre/docs/locations
  lustre_instance_id: $(vars.deployment_name)-lustre # Managed-Lustre instance name. This should be unique for each deployment.
  # The values of size_gib and per_unit_storage_throughput are co-related
  # Please refer https://cloud.google.com/managed-lustre/docs/create-instance#performance-tiers
  lustre_size_gib: 36000 # Storage capacity of the lustre instance in GiB
  per_unit_storage_throughput: 500 # Maximum throughput of the lustre instance in MBps per TiB

  #Provisioning models (set to true or fill in reservation name, pick only one)
  tpu_reservation_name: "" # supply reservation name
  tpu_dws_flex_enabled: false
  tpu_enable_spot_vm: false

  # Optional overrides (defaults shown)
  # Machine type for the login node.
  login_machine_type: n2d-standard-4
  # Machine type for the controller node.
  controller_machine_type: n2d-standard-4
  # Off by default; set to true to install and start diagon-daemon.service at
  # boot on TPU compute nodes and grant Google Cloud ML Diagnostics permissions.
  # TPU compute nodes and the Slurm controller always use dedicated service
  # accounts instead of the default Compute Engine service account; workloads
  # relying on extra default service account permissions need those roles added.
  # Redeploying under the exact same deployment_name 7-44 days after destroy
  # requires setting role_id_suffix on controller_profile.
  enable_ml_diagnostics_daemon: false

deployment_groups:
- group: cluster-env
  modules:
  - id: slurm-network
    source: modules/network/vpc
    settings:
      network_name: $(vars.deployment_name)-net-1
      subnetworks:
      - subnet_name: $(vars.deployment_name)-sub-1
        subnet_region: $(vars.region)
        subnet_ip: 192.168.64.0/18
      firewall_rules:
      - name: $(vars.deployment_name)-internal-1
        ranges: [192.168.0.0/16]
        allow:
        - protocol: tcp
          ports: ["0-65535"]
        - protocol: udp
          ports: ["0-65535"]
        - protocol: icmp

  - id: private_service_access
    source: modules/network/private-service-access
    use: [slurm-network]

  - id: homefs
    source: modules/file-system/managed-lustre
    use:
    - slurm-network
    - private_service_access
    settings:
      size_gib: $(vars.lustre_size_gib)
      name: $(vars.lustre_instance_id)
      local_mount: /home
      remote_mount: lustrefs
      per_unit_storage_throughput: $(vars.per_unit_storage_throughput)
    outputs:
    - network_storage

- group: cluster
  modules:
  - id: project
    source: community/modules/project/pre-existing-project

  - id: tpu_sa
    source: modules/project/service-account
    settings:
      name: tpu
      project_roles: >-
        $(vars.enable_ml_diagnostics_daemon ? ["hypercomputecluster.editor"] : [])
      conditional_project_roles: >-
        $(vars.enable_ml_diagnostics_daemon ? [
        {role = "storage.objectUser",
        title = "ml-diagnostics-default-bucket",
        description = "Read and write objects in default regional ML Diagnostics buckets.",
        expression = "resource.name.startsWith(\"projects/_/buckets/diagon-${project.project_number}-${vars.region}-\")"},
        {role = "storage.bucketViewer",
        title = "ml-diagnostics-default-bucket",
        description = "Inspect default regional ML Diagnostics buckets.",
        expression = "resource.name.startsWith(\"projects/_/buckets/diagon-${project.project_number}-${vars.region}-\")"}
        ] : [])

  - id: tpu_profile
    source: community/modules/iam/service-account-profiles
    use: [tpu_sa]
    settings:
      name: tpu
      profile: slurm-compute

  - id: controller_sa
    source: modules/project/service-account
    settings:
      name: ctrl
      project_roles: []

  - id: controller_profile
    source: community/modules/iam/service-account-profiles
    use: [controller_sa]
    settings:
      name: ctrl
      profile: slurm-controller
      enable_tpu_gce: true
      enable_public_ips: true
      enable_placement_policies: true
      act_as_service_accounts:
      - $(tpu_profile.service_account_email)

  - id: tpu_startup
    source: modules/scripts/startup-script
    settings:
      enable_ml_diagnostics_daemon: $(vars.enable_ml_diagnostics_daemon)
      bucket_viewers:
      - $(tpu_sa.service_account_iam_email)

  - id: tpu_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [slurm-network, tpu_profile, tpu_startup]
    settings:
      machine_type: tpu7x-standard-4t
      accelerator_topology: $(vars.tpu_accelerator_topology)
      enable_public_ips: true
      node_count_static: $(vars.tpu_static_nodes)
      node_count_dynamic_max: 0
      disk_type: hyperdisk-balanced
      reservation_name: $(vars.tpu_reservation_name)
      enable_spot_vm: $(vars.tpu_enable_spot_vm)
      dws_flex:
        enabled: $(vars.tpu_dws_flex_enabled)

  - id: tpu_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [tpu_nodeset]
    settings:
      partition_name: tpu
      resume_timeout: 1200
      suspend_timeout: 600
      exclusive: false
      is_default: true

  - id: tpu_dyn_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [slurm-network, tpu_profile, tpu_startup]
    settings:
      machine_type: tpu7x-standard-4t
      enable_public_ips: true
      node_count_static: 0
      node_count_dynamic_max: $(vars.tpu_dynamic_max_nodes)
      disk_type: hyperdisk-balanced
      reservation_name: $(vars.tpu_reservation_name)
      enable_spot_vm: $(vars.tpu_enable_spot_vm)
      dws_flex:
        enabled: $(vars.tpu_dws_flex_enabled)

  - id: tpu_dyn_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [tpu_dyn_nodeset]
    settings:
      partition_name: tpu-dyn
      resume_timeout: 1200
      suspend_timeout: 600
      exclusive: true
      is_default: false

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [slurm-network]
    settings:
      machine_type: $(vars.login_machine_type)
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - tpu_partition
    - tpu_dyn_partition
    - slurm_login
    - slurm-network
    - homefs
    - controller_profile
    settings:
      machine_type: $(vars.controller_machine_type)
      enable_controller_public_ips: true
