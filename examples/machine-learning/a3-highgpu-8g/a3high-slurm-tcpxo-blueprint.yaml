---
blueprint_name: a3high-slurm

vars:
  # Set to true to enable the secure Slurm Native Authentication standard.
  # Default fallback remains false (MUNGE) to guarantee zero regression risk on upgrades.
  enable_slurm_auth: false
  sys_net_range: 172.16.0.0/16
  filestore_ip_range: 192.168.0.0/29
  base_image:
    project: ubuntu-os-accelerator-images
    image: ubuntu-accelerator-2404-amd64-with-nvidia-580-v20260522
  local_mount_homefs: /home
  instance_image:
    project: $(vars.project_id)
    family: $(vars.deployment_name)-tcpxo-image
  localssd_mountpoint: /mnt/localssd
  enable_nvidia_dcgm: true
  enable_nvidia_persistenced: true
  disk_size_gb: 200
  build_slurm_from_git_ref: 6.12.1
  #Provisioning models (set to true or fill in reservation name, pick only one)
  a3_reservation_name: "" # supply reservation name
  a3_dws_flex_enabled: false
  a3_enable_spot_vm: false

deployment_groups:
- group: base
  modules:
  - id: sysnet
    source: modules/network/vpc
    settings:
      network_name: $(vars.deployment_name)-net-0
      network_address_range: $(vars.sys_net_range)
      mtu: 8244
      # using explicit var.subnetworks to allow for easier addition
      # of multiple system subnetworks in other regions
      subnetworks:
      - subnet_name: $(vars.deployment_name)-sub-0
        subnet_region: $(vars.region)
        new_bits: 4
        subnet_private_access: true
        description: primary subnetwork in $(vars.deployment_name)-net-0

  - id: gpunets
    source: modules/network/multivpc
    settings:
      global_ip_address_range: 10.0.0.0/9
      network_name_prefix: $(vars.deployment_name)-gpunet
      network_count: 4
      subnetwork_cidr_suffix: 20

  - id: homefs
    source: modules/file-system/filestore
    use:
    - sysnet
    settings:
      filestore_tier: BASIC_SSD
      size_gb: 2560
      reserved_ip_range: $(vars.filestore_ip_range)
      local_mount: $(vars.local_mount_homefs)

- group: build-script
  modules:
  - id: image_build_script
    source: modules/scripts/startup-script
    settings:
      install_ansible: true
      docker:
        enabled: true
        world_writable: true
      configure_ssh_host_patterns:
      - 10.0.0.*
      - 10.1.0.*
      - 10.2.0.*
      - 10.3.0.*
      - $(vars.slurm_cluster_name)*
      runners:
      - type: ansible-local
        destination: gpudirect_tcpxo.yml
        content: |
          ---
          - name: Setup GPUDirect-TCPXO dependencies
            hosts: all
            become: true
            tasks:
            - name: Setup apt-transport-artifact-registry repository
              ansible.builtin.apt_repository:
                repo: deb [trusted=yes] http://packages.cloud.google.com/apt apt-transport-artifact-registry-stable main
                state: present
                filename: artifact-registry
            - name: Install driver dependencies
              ansible.builtin.apt:
                name:
                - dkms
                - apt-transport-artifact-registry
                - linux-headers-{{ ansible_kernel }}
            - name: Setup gpudirect-tcpxo apt repository
              ansible.builtin.apt_repository:
                repo: deb [arch=all trusted=yes ] ar+https://us-apt.pkg.dev/projects/gce-ai-infra gpudirect-tcpxo-apt main
                state: present
            - name: Check if dmabuf-import-helper DKMS module is already installed
              ansible.builtin.command:
                cmd: dkms status -m dmabuf-import-helper -v 1.1
              register: dkms_status
              failed_when: false
              changed_when: false
            - name: Install and patch dmabuf-import-helper
              block:
                - name: Create temp directory for dmabuf package
                  ansible.builtin.tempfile:
                    state: directory
                    suffix: dmabuf
                  register: tempdir
                - name: Download dmabuf-import-helper package
                  ansible.builtin.command:
                    cmd: apt-get download dmabuf-import-helper=1.1
                    chdir: "{{ tempdir.path }}"
                  register: download_res
                  changed_when: download_res.rc == 0
                - name: Extract dmabuf-import-helper deb package
                  ansible.builtin.shell:
                    cmd: dpkg-deb -x *.deb .
                    chdir: "{{ tempdir.path }}"
                  register: extract_res
                  changed_when: extract_res.rc == 0
                - name: Clean existing dmabuf source in /usr/src
                  ansible.builtin.file:
                    path: /usr/src/dmabuf-import-helper-1.1
                    state: absent
                - name: Move dmabuf-import-helper source to /usr/src
                  ansible.builtin.command:
                    cmd: mv "{{ tempdir.path }}/usr/src/dmabuf-import-helper-1.1" /usr/src/
                  register: move_res
                  changed_when: move_res.rc == 0
                - name: Patch import-helper.c for kernel 6.17 compatibility
                  ansible.builtin.replace:
                    path: /usr/src/dmabuf-import-helper-1.1/import-helper.c
                    regexp: 'MODULE_IMPORT_NS\(DMA_BUF\)'
                    replace: 'MODULE_IMPORT_NS("DMA_BUF")'
                - name: Add dmabuf-import-helper to DKMS
                  ansible.builtin.command:
                    cmd: dkms add -m dmabuf-import-helper -v 1.1
                  when: "'added' not in dkms_status.stdout"
                - name: Build dmabuf-import-helper via DKMS
                  ansible.builtin.command:
                    cmd: dkms build -m dmabuf-import-helper -v 1.1
                - name: Install dmabuf-import-helper via DKMS
                  ansible.builtin.command:
                    cmd: dkms install -m dmabuf-import-helper -v 1.1
                - name: Clean up temp directory
                  ansible.builtin.file:
                    path: "{{ tempdir.path }}"
                    state: absent
              when: "'installed' not in dkms_status.stdout"
      - type: ansible-local
        destination: aperture_devices.yml
        content: |
          ---
          - name: Setup GPUDirect-TCPXO aperture devices
            hosts: all
            become: true
            tasks:
            - name: Mount aperture devices to /dev and make writable
              ansible.builtin.copy:
                dest: /etc/udev/rules.d/00-a3-megagpu.rules
                owner: root
                group: root
                mode: 0o644
                content: |
                  ACTION=="add", SUBSYSTEM=="pci", ATTR{vendor}=="0x1ae0", ATTR{device}=="0x0084", TAG+="systemd", \
                      RUN+="/usr/bin/mkdir --mode=0755 -p /dev/aperture_devices", \
                      RUN+="/usr/bin/systemd-mount --type=none --options=bind --collect %S/%p /dev/aperture_devices/%k", \
                      RUN+="/usr/bin/bash -c '/usr/bin/chmod 0666 /dev/aperture_devices/%k/resource*'"
              notify: Update initramfs
            handlers:
            - name: Update initramfs
              ansible.builtin.command: /usr/sbin/update-initramfs -u -k all

      - type: data
        destination: /etc/systemd/system/delay-a3.service
        content: |
          [Unit]
          Description=Delay A3 boot until all network interfaces are routable
          After=network-online.target
          Wants=network-online.target
          Before=google-startup-scripts.service

          [Service]
          ExecCondition=/bin/bash -c '/usr/bin/curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/machine-type | grep -q "/a3-highgpu-8g$"'
          ExecStart=/usr/lib/systemd/systemd-networkd-wait-online -i enp6s0f0 -i enp12s0f0 -i enp134s0f0 -i enp140s0f0 -o routable --timeout=120
          ExecStartPost=/bin/sleep 10

          [Install]
          WantedBy=multi-user.target

      - type: shell
        destination: enable_delay_a3.sh
        content: |
          #!/bin/bash
          set -e -o pipefail
          # workaround b/309016676 systemd-resolved restarts 4 times causing DNS
          # resolution failures during google-startup-scripts.service
          systemctl daemon-reload
          systemctl enable delay-a3.service

      - type: shell
        destination: install_gcloud.sh
        content: |
          #!/bin/bash
          set -e -o pipefail
          DEBIAN_FRONTEND=noninteractive

          apt-get -y install apt-transport-https ca-certificates gnupg curl
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          apt-get -y update && apt-get -y install google-cloud-cli

      - type: data
        destination: /var/tmp/slurm_vars.json
        content: |
          {
            "reboot": false,
            "install_cuda": false,
            "install_gcsfuse": true,
            "install_lustre": false,
            "install_ompi": true,
            "monitoring_agent": "cloud-ops",
            "nvidia_version": "latest",
            "allow_kernel_upgrades": true,
            "install_nvidia_repo": true,
            "monitoring_agent": "cloud-ops",
          }

      - type: shell
        destination: install_slurm.sh
        content: |
          #!/bin/bash
          set -e -o pipefail
          ansible-galaxy role install googlecloudplatform.google_cloud_ops_agents
          ansible-pull \
              -U https://github.com/GoogleCloudPlatform/slurm-gcp -C $(vars.build_slurm_from_git_ref) \
              -i localhost, --limit localhost --connection=local \
              -e @/var/tmp/slurm_vars.json \
              ansible/playbook.yml

      - type: ansible-local
        destination: install_cuda_and_dcgm.yml
        content: |
          ---
          - name: Install and Configure CUDA 13 / DCGM
            hosts: all
            become: true
            vars:
              distribution: "{{ ansible_distribution | lower }}{{ ansible_distribution_version | replace('.','') }}"
              cuda_repo_url: "https://developer.download.nvidia.com/compute/cuda/repos/{{ distribution }}/x86_64/cuda-keyring_1.1-1_all.deb"
              nvidia_packages:
                - cuda-toolkit-13-0
                - nvidia-container-toolkit
                - datacenter-gpu-manager-4-cuda13=1:4.6.0-1
                - datacenter-gpu-manager-4-dev=1:4.6.0-1
                - datacenter-gpu-manager-4-core=1:4.6.0-1

            tasks:
              - name: Install NVIDIA repository keyring
                ansible.builtin.apt:
                  deb: "{{ cuda_repo_url }}"
                  state: present

              - name: Update apt cache
                ansible.builtin.apt:
                  update_cache: yes

              - name: Install NVIDIA packages
                ansible.builtin.apt:
                  name: "{{ nvidia_packages }}"
                  state: present
                  allow_downgrade: yes

              - name: Hold DCGM packages
                ansible.builtin.command:
                  argv:
                    - apt-mark
                    - hold
                    - "{{ item }}"
                loop:
                  - datacenter-gpu-manager-4-cuda13
                  - datacenter-gpu-manager-4-dev
                  - datacenter-gpu-manager-4-core

              - name: Create nvidia-persistenced override directory
                ansible.builtin.file:
                  path: /etc/systemd/system/nvidia-persistenced.service.d
                  state: directory
                  owner: root
                  group: root
                  mode: 0o755

              - name: Configure nvidia-persistenced override
                ansible.builtin.copy:
                  dest: /etc/systemd/system/nvidia-persistenced.service.d/persistence_mode.conf
                  owner: root
                  group: root
                  mode: 0o644
                  content: |
                    [Service]
                    ExecStart=
                    ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --verbose
                notify: Reload SystemD

              - name: Disable nvidia-persistenced SystemD unit (enable during boot on GPU nodes)
                ansible.builtin.service:
                  name: nvidia-persistenced.service
                  state: stopped
                  enabled: false

            handlers:
              - name: Reload SystemD
                ansible.builtin.systemd:
                  daemon_reload: true
      - type: shell
        destination: fix_enroot_env.sh
        content: |
          #!/bin/bash
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            echo "kernel.apparmor_restrict_unprivileged_userns = 0" > /etc/sysctl.d/90-enroot-namespaces.conf
          fi
          if [ ! -f /etc/hostname ]; then hostname > /etc/hostname; fi
      - type: data
        destination: /etc/security/limits.d/99-unlimited.conf
        content: |
          * - memlock unlimited
          * - nproc unlimited
          * - stack unlimited
          * - nofile 1048576
          * - cpu unlimited
          * - rtprio unlimited

      - type: data
        destination: /etc/enroot/enroot.conf
        content: |
          ENROOT_RUNTIME_PATH    /mnt/localssd/${UID}/enroot/runtime
          ENROOT_CACHE_PATH      /mnt/localssd/${UID}/enroot/cache
          ENROOT_DATA_PATH       /mnt/localssd/${UID}/enroot/data
          ENROOT_TEMP_PATH       /mnt/localssd/${UID}/enroot
      # Add gpu_rxq configs
      - type: shell
        destination: generate_gpu_rxq_config.sh
        content: |
          #!/bin/bash
          get_ifname() {
            local bdf=$1
            if [ -d "/sys/bus/pci/devices/$bdf/net" ]; then
              ls "/sys/bus/pci/devices/$bdf/net" | head -n 1
            else
              case "$bdf" in
                "0000:06:00.0") echo "enp6s0f0" ;;
                "0000:0c:00.0") echo "enp12s0f0" ;;
                "0000:86:00.0") echo "enp134s0f0" ;;
                "0000:8c:00.0") echo "enp140s0f0" ;;
                *) echo "unknown" ;;
              esac
            fi
          }
          ifname_06=`get_ifname "0000:06:00.0"`
          ifname_0c=`get_ifname "0000:0c:00.0"`
          ifname_86=`get_ifname "0000:86:00.0"`
          ifname_8c=`get_ifname "0000:8c:00.0"`
          mkdir -p /opt/tcpdirect_benchmark
          cat << EOF > /opt/tcpdirect_benchmark/gpu_rxq_configuration.textproto
          gpu_rxq_configs {
            gpu_infos {
              gpu_pci_addr: "0000:04:00.0"
              queue_ids: 8
              queue_ids: 9
              queue_ids: 10
              queue_ids: 11
            }
            gpu_infos {
              gpu_pci_addr: "0000:05:00.0"
              queue_ids: 12
              queue_ids: 13
              queue_ids: 14
              queue_ids: 15
            }
            nic_pci_addr: "0000:06:00.0"
            ifname: "$ifname_06"
          }
          gpu_rxq_configs {
            gpu_infos {
              gpu_pci_addr: "0000:0a:00.0"
              queue_ids: 8
              queue_ids: 9
              queue_ids: 10
              queue_ids: 11
            }
            gpu_infos {
              gpu_pci_addr: "0000:0b:00.0"
              queue_ids: 12
              queue_ids: 13
              queue_ids: 14
              queue_ids: 15
            }
            nic_pci_addr: "0000:0c:00.0"
            ifname: "$ifname_0c"
          }
          gpu_rxq_configs {
            gpu_infos {
              gpu_pci_addr: "0000:84:00.0"
              queue_ids: 8
              queue_ids: 9
              queue_ids: 10
              queue_ids: 11
            }
            gpu_infos {
              gpu_pci_addr: "0000:85:00.0"
              queue_ids: 12
              queue_ids: 13
              queue_ids: 14
              queue_ids: 15
            }
            nic_pci_addr: "0000:86:00.0"
            ifname: "$ifname_86"
          }
          gpu_rxq_configs {
            gpu_infos {
              gpu_pci_addr: "0000:8a:00.0"
              queue_ids: 8
              queue_ids: 9
              queue_ids: 10
              queue_ids: 11
            }
            gpu_infos {
              gpu_pci_addr: "0000:8b:00.0"
              queue_ids: 12
              queue_ids: 13
              queue_ids: 14
              queue_ids: 15
            }
            nic_pci_addr: "0000:8c:00.0"
            ifname: "$ifname_8c"
          }
          rss_set_size: 8
          tcpd_queue_size: 8
          max_rx_rules: 100000
          EOF
      - type: shell
        destination: fix_hostname.sh
        content: |
          #!/bin/bash
          ## Manually signal Packer that the startup script is done because Packer's wrapper script
          ## fails when it tries to use the FQDN to add the metadata.
          SHORT_NAME=`curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/name"`
          ZONE=`curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/zone" | awk -F/ '{print $4}'`
          gcloud compute instances add-metadata $SHORT_NAME --metadata startup-script-status=done --zone $ZONE

- group: image
  modules:
  - id: slurm-image
    source: modules/packer/custom-image
    kind: packer
    use:
    - image_build_script
    - sysnet
    settings:
      # building this image does not require a GPU-enabled VM but must *not* be
      # run on a N-series VM otherwise, the "open" drivers will not install
      machine_type: c2d-standard-32
      source_image_project_id: [$(vars.base_image.project)]
      source_image: $(vars.base_image.image)
      image_family: $(vars.instance_image.family)
      disk_size: $(vars.disk_size_gb)
      omit_external_ip: false
      # Unattended upgrades are disabled in this blueprint so that software does not
      # get updated daily and lead to potential instability in the cluster environment.
      #
      # Unattended Upgrades installs available security updates from the Ubuntu
      # security pocket for installed packages daily by default. Administrators who
      # disable this feature assume all responsibility for manually reviewing and
      # patching their systems against vulnerabilities.
      #
      # To enable unattended upgrades, please remove this section.
      metadata:
        user-data: |
          #cloud-config
          write_files:
          - path: /etc/apt/apt.conf.d/20auto-upgrades
            permissions: '0644'
            owner: root
            content: |
              APT::Periodic::Update-Package-Lists "0";
              APT::Periodic::Unattended-Upgrade "0";

- group: cluster
  modules:
  - id: compute_sa
    source: modules/project/service-account
    settings:
      name: compute
      project_roles:
      - logging.logWriter
      - monitoring.metricWriter
      - storage.objectAdmin

  - id: a3_startup
    source: modules/scripts/startup-script
    settings:
      # When shutting down a VM with local SSD disks, we strongly recommend the
      # automatic migration of data following these instructions:
      # https://cloud.google.com/compute/docs/disks/local-ssd#stop_instance
      # Failure to do will result in VMs that lose data and do not automatically
      # mount local SSD filesystems
      local_ssd_filesystem:
        mountpoint: $(vars.localssd_mountpoint)
        permissions: "1777" # must quote numeric filesystem permissions!
      # Docker was successfully installed in the image, this configures it
      # to use the A3-specific local SSD volumes to store container images
      docker:
        enabled: true
        world_writable: true
        daemon_config: |
          {
            "data-root": "$(vars.localssd_mountpoint)/docker"
          }
      runners:
      - type: shell
        destination: fix_enroot_env.sh
        content: |
          #!/bin/bash
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            echo "kernel.apparmor_restrict_unprivileged_userns = 0" > /etc/sysctl.d/90-enroot-namespaces.conf
          fi
          if [ ! -f /etc/hostname ]; then hostname > /etc/hostname; fi
      - type: data
        destination: /etc/apt/preferences.d/block-broken-nvidia-container
        content: |
          Package: nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1
          Pin: version 1.17.7-1
          Pin-Priority: 100
      - type: ansible-local
        destination: enable_dcgm.yml
        content: |
          ---
          - name: Enable NVIDIA DCGM on GPU nodes
            hosts: all
            become: true
            vars:
              enable_ops_agent: true
              enable_nvidia_dcgm: $(vars.enable_nvidia_dcgm)
              enable_nvidia_persistenced: $(vars.enable_nvidia_persistenced)
            tasks:
            - name: Update Ops Agent configuration
              ansible.builtin.blockinfile:
                path: /etc/google-cloud-ops-agent/config.yaml
                insertafter: EOF
                block: |
                  metrics:
                    receivers:
                      dcgm:
                        type: dcgm
                    service:
                      pipelines:
                        dcgm:
                          receivers:
                            - dcgm
              notify:
              - Restart Google Cloud Ops Agent
            handlers:
            - name: Restart Google Cloud Ops Agent
              ansible.builtin.service:
                name: google-cloud-ops-agent.service
                state: "{{ 'restarted' if enable_ops_agent else 'stopped' }}"
                enabled: "{{ enable_ops_agent }}"
            post_tasks:
            - name: Enable Google Cloud Ops Agent
              ansible.builtin.service:
                name: google-cloud-ops-agent.service
                state: "{{ 'started' if enable_ops_agent else 'stopped' }}"
                enabled: "{{ enable_ops_agent }}"
            - name: Enable NVIDIA DCGM
              ansible.builtin.service:
                name: nvidia-dcgm.service
                state: "{{ 'started' if enable_nvidia_dcgm else 'stopped' }}"
                enabled: "{{ enable_nvidia_dcgm }}"
            - name: Enable NVIDIA Persistence Daemon
              ansible.builtin.service:
                name: nvidia-persistenced.service
                state: "{{ 'started' if enable_nvidia_persistenced else 'stopped' }}"
                enabled: "{{ enable_nvidia_persistenced }}"

      - type: ansible-local
        destination: slurm_aperture.yml
        content: |
          ---
          - name: Setup GPUDirect-TCPXO aperture devices
            hosts: all
            become: true
            tasks:
            - name: Add a drop-in override for slurmd to wait for aperture devices
              ansible.builtin.copy:
                dest: /etc/systemd/system/slurmd.service.d/10-aperture.conf
                owner: root
                group: root
                mode: 0o644
                content: |
                  [Unit]
                  ConditionPathExists=/dev/aperture_devices
              notify: Reload SystemD
            handlers:
            - name: Reload SystemD
              ansible.builtin.systemd:
                daemon_reload: true
          - name: Setup RXDM
            hosts: all
            become: true
            tasks:
            - name: Override slurmd so it has RXDM capabilities
              ansible.builtin.copy:
                dest: /etc/systemd/system/slurmd.service.d/override.conf
                owner: root
                group: root
                mode: 0o644
                content: |
                  [Service]
                  AmbientCapabilities=CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_SYS_NICE CAP_IPC_LOCK
              notify: Reload SystemD
            handlers:
            - name: Reload SystemD
              ansible.builtin.systemd:
                daemon_reload: true

  - id: a3_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use:
    - sysnet
    - gpunets
    - compute_sa
    - a3_startup
    settings:
      reservation_name: $(vars.a3_reservation_name)
      enable_spot_vm: $(vars.a3_enable_spot_vm)
      dws_flex:
        enabled: $(vars.a3_dws_flex_enabled)
      node_count_static: $(vars.a3_static_cluster_size)
      node_count_dynamic_max: 0
      disk_type: pd-ssd
      machine_type: a3-highgpu-8g
      enable_public_ips: false
      advanced_machine_features:
        threads_per_core: null # Use platform default value
      node_conf:
        CoresPerSocket: 52
        ThreadsPerCore: 2
      on_host_maintenance: TERMINATE
      bandwidth_tier: gvnic_enabled

  - id: a3_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - a3_nodeset
    settings:
      partition_name: $(vars.a3_partition_name)
      resume_timeout: 3600
      exclusive: false
      is_default: true
      partition_conf:
        OverSubscribe: EXCLUSIVE

  - id: controller_startup
    source: modules/scripts/startup-script
    settings:
      runners:
      - type: shell
        destination: stage_scripts.sh
        content: |
          #!/bin/bash
          SLURM_ROOT=/opt/apps/adm/slurm
          mkdir -m 0755 -p "${SLURM_ROOT}/scripts"
          mkdir -p "${SLURM_ROOT}/prolog_slurmd.d"
          mkdir -p "${SLURM_ROOT}/epilog_slurmd.d"
          mkdir -p "${SLURM_ROOT}/partition-$(vars.a3_partition_name)-prolog_slurmd.d"
          mkdir -p "${SLURM_ROOT}/partition-$(vars.a3_partition_name)-epilog_slurmd.d"
          # enable the use of password-free sudo within Slurm jobs on all compute nodes
          # feature is restricted to users with OS Admin Login IAM role
          # https://cloud.google.com/iam/docs/understanding-roles#compute.osAdminLogin
          curl -s -o "${SLURM_ROOT}/scripts/sudo-oslogin" \
              https://raw.githubusercontent.com/GoogleCloudPlatform/slurm-gcp/master/tools/prologs-epilogs/sudo-oslogin
          chmod 0755 "${SLURM_ROOT}/scripts/sudo-oslogin"
          ln -s "${SLURM_ROOT}/scripts/sudo-oslogin" "${SLURM_ROOT}/prolog_slurmd.d/sudo-oslogin.prolog_slurmd"
          ln -s "${SLURM_ROOT}/scripts/sudo-oslogin" "${SLURM_ROOT}/epilog_slurmd.d/sudo-oslogin.epilog_slurmd"
          curl -s -o "${SLURM_ROOT}/scripts/receive-data-path-manager" \
              https://raw.githubusercontent.com/GoogleCloudPlatform/slurm-gcp/master/tools/prologs-epilogs/receive-data-path-manager-mega
          chmod 0755 "${SLURM_ROOT}/scripts/receive-data-path-manager"
          sed -i -e 's/a3-megagpu-8g/a3-highgpu-8g/g' "${SLURM_ROOT}/scripts/receive-data-path-manager"
          sed -i -e 's/ --num_nics=8 --uid= --alsologtostderr//g' "${SLURM_ROOT}/scripts/receive-data-path-manager"

          # Link the downloaded path manager into slurm (applies to both TCPX and TCPXO)
          ln -s "${SLURM_ROOT}/scripts/receive-data-path-manager" "${SLURM_ROOT}/partition-$(vars.a3_partition_name)-prolog_slurmd.d/start-rxdm.prolog_slurmd"
          ln -s "${SLURM_ROOT}/scripts/receive-data-path-manager" "${SLURM_ROOT}/partition-$(vars.a3_partition_name)-epilog_slurmd.d/stop-rxdm.epilog_slurmd"

          # enable a GPU health check that runs at the completion of all jobs on A3high nodes
          ln -s "/slurm/scripts/tools/gpu-test" "${SLURM_ROOT}/partition-$(vars.a3_partition_name)-epilog_slurmd.d/gpu-test.epilog_slurmd"
      - type: shell
        destination: reset_enroot.sh
        content: |
          #!/bin/bash
          # reset enroot to defaults of files under /home and running under /run
          # allows basic enroot testing on login/controller nodes (reduced I/O)
          rm -f /etc/enroot/enroot.conf

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [sysnet]
    settings:
      name_prefix: login
      disk_type: pd-balanced
      machine_type: c2-standard-4
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - sysnet
    - a3_partition
    - slurm_login
    - homefs
    settings:
      cloud_parameters:
        resume_rate: 0
        resume_timeout: 3600
        suspend_rate: 0
        suspend_timeout: 600
        no_comma_params: false
        tree_width: $(vars.a3_static_cluster_size)
      machine_type: c2-standard-8
      compute_startup_scripts_timeout: 10000
      disk_type: pd-balanced
      slurm_conf_tpl: ../_modules/embedded/community/modules/scheduler/schedmd-slurm-gcp-v6-controller/etc/long-prolog-slurm.conf.tpl
      enable_controller_public_ips: true
      enable_external_prolog_epilog: true
      controller_startup_script: $(controller_startup.startup_script)
      login_startup_script: |
        #!/bin/bash
        # reset enroot to defaults of files under /home and running under /run
        # allows basic enroot testing on login node (reduced I/O)
        rm -f /etc/enroot/enroot.conf
