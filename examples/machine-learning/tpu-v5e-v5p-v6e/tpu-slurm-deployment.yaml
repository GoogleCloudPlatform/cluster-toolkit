---

terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: # supply bucket name to store Terraform state (created automatically by gcluster if missing)

vars:
  deployment_name: # supply unique deployment name (e.g. tpu-slurm)
  project_id: # supply existing GCP project ID
  region: # supply region (e.g. us-west1)
  zone: # supply zone (e.g. us-west1-c)

  # TPU machine type to provision (choose one based on your TPU generation):
  #   TPU v6e : ct6e-standard-4t
  #   TPU v5p : ct5p-hightpu-4t
  #   TPU v5e : ct5lp-hightpu-4t
  tpu_machine_type: ct6e-standard-4t

  tpu_static_nodes: # supply total static TPU VM nodes (4 TPU chips/node; multiple of slice VMs, e.g. 4 for one 4x4 or 2x2x4 slice)
  tpu_dynamic_max_nodes: # supply max dynamic TPU nodes (e.g. 4)
  tpu_accelerator_topology: # supply topology per static TPU slice (e.g. 4x4 for v6e/v5e, 2x2x4 for v5p; defaults to 1-node topology)
  # Note: slice VMs = total chips / 4, e.g. 4x4 or 2x2x4 = 4 nodes/slice, 4x8 or 2x4x4 = 8 nodes/slice
  tpu_reservation_name: # supply TPU reservation name

# Additional provisioning models (pick only one), can be used to substitute `tpu_reservation_name`:
#
# tpu_dws_flex_enabled: true
#
# To make use of DWS Flex, for more info visit: https://github.com/GoogleCloudPlatform/cluster-toolkit/blob/main/docs/slurm-dws-flex.md
#
# tpu_enable_spot_vm: true
#
# To make use of spot VMs, for more info visit: https://cloud.google.com/compute/docs/instances/spot
