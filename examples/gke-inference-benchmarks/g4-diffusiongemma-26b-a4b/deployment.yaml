terraform_backend_defaults:
  type: gcs
  configuration:
    # The GCS bucket used for storing terraform state
    bucket:

vars:
  # Your GCP Project ID
  project_id:

  # This should be unique across all of your Cluster Toolkit Deployments.
  deployment_name: g4-diffusiongemma

  # The GCP Region and Zone used for this deployment. Spot capacity is zonal;
  # pick a zone with G4 availability:
  # https://cloud.google.com/compute/docs/gpus/gpu-regions-zones
  # (the reference results in README.md were measured in us-central1-b).
  region: us-central1
  zone: us-central1-b

  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr:

  # g4-standard-48 (1x RTX PRO 6000, 96 GB) is enough for DiffusionGemma 26B-A4B
  # in BF16. See allowed values here: https://cloud.google.com/compute/docs/gpus#rtx-6000-gpus
  machine_type: g4-standard-48
  num_gpus: 1

  # Number of nodes. One node is enough for the benchmark.
  static_node_count: 1

  # Consumption model: Spot VMs (preemptible). Set to false for on-demand.
  spot: true

  # Hugging Face token with access to the gated google/diffusiongemma-26B-A4B-it
  # (accept the license at https://huggingface.co/google/diffusiongemma-26B-A4B-it).
  # The blueprint stores it in the `hf-secret` Kubernetes Secret through the
  # kubernetes-secret module. Do NOT commit this file with a real token; pass it
  # on the command line instead:
  #   --vars hf_token=$HF_TOKEN
  # NOTE: a token passed this way is written in plaintext to the deployment
  # folder's terraform.tfvars and to the Terraform state in the bucket above.
  # If that is not acceptable, leave it empty and patch the (then empty) Secret
  # yourself after deployment, see README.md:
  #   kubectl patch secret hf-secret --type merge -p "{\"stringData\":{\"hf_api_token\":\"$HF_TOKEN\"}}"
  hf_token: ""

  # Set to false to only deploy the vLLM server (no benchmark Job).
  run_benchmark: true
