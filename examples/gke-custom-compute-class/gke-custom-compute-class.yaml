---

blueprint_name: gke-custom-compute-class

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: ccc-demo
  region: us-central1
  zone: us-central1-a

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/vpc
    settings:
      subnetwork_name: $(vars.deployment_name)-subnet
      secondary_ranges_list:
      - subnetwork_name: $(vars.deployment_name)-subnet
        ranges:
        - range_name: pods
          ip_cidr_range: 10.4.0.0/14
        - range_name: services
          ip_cidr_range: 10.0.32.0/20

  - id: gke_cluster
    source: modules/scheduler/gke-cluster
    use: [network]
    settings:
      enable_external_dns_endpoint: true
      system_node_pool_machine_type: n2-standard-4
      cluster_autoscaling:
        enabled: true
        limits:
        - autoprovisioning_resource_type: cpu
          autoprovisioning_max_count: 1000
        - autoprovisioning_resource_type: memory
          autoprovisioning_max_count: 4000
        autoprovisioning_cpu_max: 1000
        autoprovisioning_memory_max: 4000
        autoprovisioning_disk_size_gb: 100
        autoprovisioning_disk_type: pd-balanced

  # Example 1: Inline-defined Custom Compute Class (prioritizing Spot C3 with on-demand N2 fallback)
  - id: ccc_inline
    source: modules/management/custom-compute-class
    use: [gke_cluster]
    settings:
      compute_classes:
      - name: spot-priority-compute-class
        description: "Priority list: Spot C3 instances falling back to on-demand N2"
        node_pool_auto_creation: true
        priorities:
        - machine_family: c3
          spot: true
          min_cores: 4
          min_memory_gb: 16
        - machine_family: n2
          spot: false
          min_cores: 4
          min_memory_gb: 16
        node_pool_config:
          image_type: cos_containerd
          gvnic_enabled: true
          node_labels:
            workload-tier: high-throughput
          taints:
          - key: "workload.example.com/tier"
            value: "high-throughput"
            effect: "NoSchedule"

  # Example 2: Template-defined Custom Compute Class (parameterized via custom templatefile)
  - id: ccc_template
    source: modules/management/custom-compute-class
    use: [gke_cluster]
    settings:
      custom_manifest_path: $(ghpc_stage("./templates/custom-compute-class.yaml.tftpl"))
      custom_template_vars:
        class_name: template-defined-compute-class
        description: "Custom Compute Class generated from an external parameterized template"
        machine_family: c3
        spot: false
        min_cores: 8
        min_memory_gb: 32
        zone: $(vars.zone)
        image_type: cos_containerd
        node_labels:
          provisioner: template
        taints: []
