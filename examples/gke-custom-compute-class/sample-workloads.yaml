---
# Workload 1: Targeting the inline-defined Spot-priority ComputeClass
apiVersion: v1
kind: Pod
metadata:
  name: batch-workload-spot
spec:
  nodeSelector:
    cloud.google.com/compute-class: spot-priority-compute-class
  tolerations:
  - key: "workload.example.com/tier"
    operator: "Equal"
    value: "high-throughput"
    effect: "NoSchedule"
  containers:
  - name: worker
    image: alpine:latest
    command: ["sh", "-c", "echo Running on Spot-priority compute class && sleep 3600"]
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
---
# Workload 2: Targeting the template-defined ComputeClass
apiVersion: v1
kind: Pod
metadata:
  name: batch-workload-template
spec:
  nodeSelector:
    cloud.google.com/compute-class: template-defined-compute-class
  containers:
  - name: worker
    image: alpine:latest
    command: ["sh", "-c", "echo Running on template-defined compute class && sleep 3600"]
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
