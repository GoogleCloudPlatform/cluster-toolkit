---

# See instructions at
# https://github.com/GoogleCloudPlatform/hpc-toolkit/tree/main/examples#image-builderyaml-

blueprint_name: image-builder-v6

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: image-builder-v6-001
  region: us-central1
  zone: us-central1-a
  custom_image:
    family: my-slurm-image
    project: $(vars.project_id)
  disk_size: 50

# Documentation for each of the modules used below can be found at
# https://github.com/GoogleCloudPlatform/hpc-toolkit/blob/main/modules/README.md

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  - id: scripts_for_image
    source: modules/scripts/startup-script
    settings:
      # The build VM downloads these runners from this module's staging bucket;
      # grant the image builder read access to that bucket only.
      bucket_viewers:
      - serviceAccount:$(image_builder_sa.service_account_email)
      runners:
      - type: shell
        destination: generate_hello.sh
        content: |
          #!/bin/sh
          hostname \$(hostname -s)
          echo "Hello World" > /usr/local/hello.txt

  # A least-privilege identity for the temporary build VM; see
  # community/modules/iam/service-account-profiles/README.md. Account IDs
  # ("<deployment_name>-<name>") are limited to 30 characters, so names here
  # and below are short.
  - id: image_builder_account
    source: modules/project/service-account
    settings:
      name: builder
      project_roles: []

  - id: image_builder_sa
    source: community/modules/iam/service-account-profiles
    use: [image_builder_account]
    settings:
      name: builder
      profile: image-builder

- group: packer
  modules:
  - id: custom-image
    source: modules/packer/custom-image
    kind: packer
    use:
    - network
    - scripts_for_image
    - image_builder_sa
    settings:
      source_image_project_id: [schedmd-slurm-public]
      # see latest in https://github.com/GoogleCloudPlatform/slurm-gcp/blob/master/docs/images.md#published-image-family
      # Rocky 8: slurm-gcp-6-12-hpc-rocky-linux-8
      # Rocky 9: slurm-gcp-6-12-hpc-rocky-linux-9
      source_image_family: slurm-gcp-6-12-hpc-rocky-linux-9
      # You can find size of source image by using following command
      # gcloud compute images describe-from-family <source_image_family> --project schedmd-slurm-public
      disk_size: $(vars.disk_size)
      image_family: $(vars.custom_image.family)
      state_timeout: 15m

- group: cluster
  modules:
  # The cluster's own identities.
  - id: compute_account
    source: modules/project/service-account
    settings:
      name: compute
      project_roles: []

  - id: compute_sa
    source: community/modules/iam/service-account-profiles
    use: [compute_account]
    settings:
      name: compute
      profile: slurm-compute

  - id: login_account
    source: modules/project/service-account
    settings:
      name: login
      project_roles: []

  - id: login_sa
    source: community/modules/iam/service-account-profiles
    use: [login_account]
    settings:
      name: login
      profile: slurm-login

  - id: controller_account
    source: modules/project/service-account
    settings:
      name: ctrl
      project_roles: []

  - id: controller_sa
    source: community/modules/iam/service-account-profiles
    use: [controller_account]
    settings:
      name: ctrl
      profile: slurm-controller
      # compute_nodeset keeps the nodeset default enable_placement: true.
      enable_placement_policies: true
      act_as_service_accounts:
      - $(compute_sa.service_account_email)

  - id: compute_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network, compute_sa]
    settings:
      node_count_dynamic_max: 20
      disk_size_gb: $(vars.disk_size)
      instance_image: $(vars.custom_image)
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: compute_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [compute_nodeset]
    settings:
      partition_name: compute
      is_default: true

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network, login_sa]
    settings:
      enable_login_public_ips: true
      disk_size_gb: $(vars.disk_size)
      instance_image: $(vars.custom_image)

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - controller_sa
    - compute_partition
    - slurm_login
    settings:
      enable_controller_public_ips: true
      disk_size_gb: $(vars.disk_size)
      instance_image: $(vars.custom_image)
