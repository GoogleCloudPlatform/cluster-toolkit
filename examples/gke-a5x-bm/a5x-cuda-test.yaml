# Smoke test: nvidia-smi + CUDA vectorAdd on 4 GPUs.
#   kubectl apply -f a5x-cuda-test.yaml && kubectl logs -f a5x-cuda-test
apiVersion: v1
kind: Pod
metadata:
  name: a5x-cuda-test
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
  containers:
  - name: cuda-sample
    image: gcr.io/kubernetes-e2e-test-images/cuda-sample:vectoradd-cuda12.5.0
    command: ["/bin/sh", "-c"]
    args:
    - "nvidia-smi && ./cuda-samples/vectorAdd"
    resources:
      limits:
        nvidia.com/gpu: 4
