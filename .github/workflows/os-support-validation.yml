name: OS Support Validation

permissions:
  contents: read

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  validate-binary-compatibility:
    name: Verify binary on ${{ matrix.os-name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - os-name: "Debian 11 (Bullseye)"
          image: "debian:11-slim"
        - os-name: "Debian 12 (Bookworm)"
          image: "debian:12-slim"
        - os-name: "Debian 13 (Trixie)"
          image: "debian:trixie-slim"
        - os-name: "Ubuntu 22.04"
          image: "ubuntu:22.04"
        - os-name: "Ubuntu 24.04"
          image: "ubuntu:24.04"
        - os-name: "Ubuntu 26.04"
          image: "ubuntu:26.04"
        - os-name: "Rocky Linux 8"
          image: "rockylinux:8"
        - os-name: "Rocky Linux 9"
          image: "rockylinux:9"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
    - name: Set up Go 1.26
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff #v5.6.0
      with:
        go-version: '1.26'
    - name: Build Binary
      run: |
        go mod tidy
        CGO_ENABLED=0 go build -o gcluster .

    - name: Dry-Run Test on Target OS
      run: |
        docker run --rm -v "$(pwd)/gcluster:/gcluster" ${{ matrix.image }} /gcluster --version

  validate-windows:
    name: Verify on Windows
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
    - name: Set up Go 1.26
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff #v5.6.0
      with:
        go-version: '1.26'
    - name: Run Core Unit Tests
      run: go test -v ./pkg/shell/... ./pkg/modulereader/... ./pkg/sourcereader/...
    - name: Build Binary
      run: go build -o gcluster.exe .
    - name: Verify Binary Execution
      run: |
        .\gcluster.exe --version
        .\gcluster.exe --help
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
      with:
        terraform_version: "1.12.2"
        terraform_wrapper: false
    - name: Verify Deployment Creation & Terraform Validation
      env:
        GHPC_MOCK_MACHINE_CONFIG: '{"gpus": {}, "tpus": {}, "cpus": {}}'
      run: |
        # Offline validation: cloud-dependent validators are skipped to avoid indefinite
        # network retries against unauthenticated GCP endpoints. Offline semantic validators remain active.
        .\gcluster.exe create tools/cloud-build/daily-tests/blueprints/e2e.yaml --skip-validators="test_project_exists,test_apis_enabled,test_region_exists,test_zone_exists,test_zone_in_region,test_quota_availability,test_machine_type_in_zone,test_reservation_exists,test_disk_type_in_zone" --vars="project_id=test-project,deployment_name=ci-test-dep,region=us-central1,zone=us-central1-a" -o test-deployment
        terraform -chdir=test-deployment/ci-test-dep/first init -backend=false
        terraform -chdir=test-deployment/ci-test-dep/first validate
        terraform -chdir=test-deployment/ci-test-dep/second init -backend=false
        terraform -chdir=test-deployment/ci-test-dep/second validate
