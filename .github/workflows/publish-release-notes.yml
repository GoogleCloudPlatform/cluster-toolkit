name: Publish Release Notes

on:
  pull_request:
    types:
    - closed
    branches:
    - main

permissions:
  contents: write
  discussions: write

jobs:
  publish-release:
    if: |
      github.event.pull_request.merged == true &&
      (
        startsWith(github.event.pull_request.head.ref, 'release-candidate-') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix-')
      )

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Get Release Information
      id: release
      shell: bash
      env:
        BRANCH: ${{ github.event.pull_request.head.ref }}
      run: |
        if [[ "$BRANCH" == release-candidate-* ]]; then
          VERSION="${BRANCH#release-candidate-}"
        elif [[ "$BRANCH" == hotfix-* ]]; then
          VERSION="${BRANCH#hotfix-}"
        else
          echo "Unsupported branch: $BRANCH"
          exit 1
        fi

        # Ensure consistent 'v' prefix
        VERSION="${VERSION#v}"
        VERSION="v${VERSION}"

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish Existing Draft Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.release.outputs.version }}
        TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        if [[ -z "$TARGET_SHA" ]]; then
          echo "ERROR: merge_commit_sha is empty or missing in PR event." >&2
          exit 1
        fi

        echo "Publishing release: $VERSION (target: $TARGET_SHA)"

        if gh release view "$VERSION" >/dev/null 2>&1; then
          gh release edit "$VERSION" \
            --target "$TARGET_SHA" \
            --draft=false \
            --latest \
            --discussion-category "Announcements"
        else
          echo "Draft release not found; creating release directly at $TARGET_SHA"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$TARGET_SHA" \
            --generate-notes \
            --latest \
            --discussion-category "Announcements"
        fi

        echo "Release published successfully."
