# Dependency Review Action
#
# This Action will ensure that a label exists on a PR.
name: 'Ensure PR label exists'

on:
  pull_request:
    types:
    - opened
    - labeled
    - unlabeled
    - synchronize
    - edited
    - ready_for_review
    - unlocked
    branches:
    - main
    - develop
    - release-candidate-*
    - hotfix-*

jobs:
  pr-label-validation:
    if: github.repository == 'GoogleCloudPlatform/cluster-toolkit' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
    - id: check-labels
      uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 #v5.6.0
      with:
        mode: minimum
        count: 1
        labels: "release-chore, release-key-new-features, release-new-modules, release-module-improvements, release-improvements, release-deprecations, release-version-updates, release-bugfix, release-breaking-changes"
        message: "This PR is being prevented from merging because it is not labeled.  Please add a label to this PR.  Accepted labels: release-chore, release-key-new-features, release-new-modules, release-module-improvements, release-improvements, release-deprecations, release-version-updates, release-bugfix, release-breaking-changes"
    - id: do-not-merge
      uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 #v5.6.0
      with:
        mode: exactly
        count: 0
        labels: "do-not-merge"
        add_comment: false
    - id: no-chore-combo
      # release-chore is in the `exclude` list of .github/release.yml, so a PR that
      # carries release-chore together with any other release-* label is hidden
      # from the release notes entirely, even if it is release-breaking.
      env:
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      run: |
        RELEASE_LABELS=$(echo "$PR_LABELS" | tr ',' '\n' | grep -E '^release-' || true)
        if echo "$RELEASE_LABELS" | grep -qx 'release-chore' && [ "$(echo "$RELEASE_LABELS" | grep -c .)" -gt 1 ]; then
          echo "::error::release-chore cannot be combined with other release-* labels ($(echo "$RELEASE_LABELS" | tr '\n' ' ')). release-chore hides the PR from the release notes; keep either release-chore alone or remove it."
          exit 1
        fi
        echo "Label combination OK."
    - id: print-labels
      run: |
        echo "Current PR labels:"
        for f in $(echo "{{steps.check-labels.outputs.labels}}" | sed "s/,/ /g")
        do
          echo "$f"
        done
